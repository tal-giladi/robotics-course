[pytest]
# importlib mode: exercise directories are named by lesson id (e.g. labs/exercises/09.04) and
# every exercise has its own test_exercise.py — neither works with the default "prepend" mode.
addopts = --import-mode=importlib -ra
testpaths = labs/python/tests labs/exercises
# `robotlab` is importable without `pip install -e labs/python`.
pythonpath = labs/python
filterwarnings =
    error::DeprecationWarning:robotlab.*
    ignore::DeprecationWarning:matplotlib.*
    ignore::DeprecationWarning:pyparsing.*
    ignore:Matplotlib is currently using agg:UserWarning
    ignore:FigureCanvasAgg is non-interactive:UserWarning
