  question: You want to know whether karmel's LiDAR will see the legs of your dining table. Simulator or real robot?
  options:
    - "Both, in that order: simulate the geometry, then measure whether the real material reflects"
    - "Simulator only: Gazebo models the reflectivity of every material, so the real test adds nothing"
    - "Real robot only: a simulator cannot say anything useful about scan height or leg thickness"
    - "Neither: a 2D LiDAR cannot detect table legs, so the question needs a depth camera instead"
