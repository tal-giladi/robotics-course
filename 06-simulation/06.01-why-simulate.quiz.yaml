# Multiple-choice version of the quiz in 06.01-why-simulate.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: d371f444943c
  question: Which sequence correctly describes the three steps of a simulator's loop?
  options:
    - Render the scene on the GPU; detect collisions in the rendered image; move the robot to the nearest collision-free pose
    - Apply commands through an actuator model to get forces; integrate the state one step, solving contacts; compute sensor readings
    - Read the previous sensor values; average them over one time step; publish the averaged values back to your software
    - Compute sensor readings from the current state; set joint positions directly from commands; resolve contacts every tenth step
  correct: 1
- source: 6179deb44792
  question: A real-time factor of 0.25 is reported and your navigation test takes 90 s of simulated time. How long do you wait, and is the result wrong because the simulation was slow?
  options:
    - 22.5 wall-clock seconds; the result is wrong because physics ran four times too fast
    - 360 wall-clock seconds; the result is wrong because the simulation ran slower than real time
    - 90 wall-clock seconds; the real-time factor only affects how often the GUI redraws
    - 360 wall-clock seconds; the result is fine if every node uses `use_sim_time:=true`
  correct: 3
