- source: 9cbf2c1ceca8
  question: Why does this course use two simulators instead of just Gazebo?
  options:
    - "`robotlab.sim` is the only one that runs the real URDF and controllers; Gazebo is kept for quick 2D checks of filter maths"
    - "`robotlab.sim` is fast and deterministic for filters, tuning and Monte Carlo runs; Gazebo runs the real URDF, controllers and ROS 2 topics"
    - "`robotlab.sim` is photorealistic for camera work and perception, while Gazebo only simulates 2D wheel motion and odometry"
    - The two simulators run side by side on every test so that each averages out the other's physics errors
  correct: 1
- source: 209095ac6544
  question: You set `max_step_size` to 0.05 s in a Gazebo world to make it run faster. What happens?
  options:
    - It runs faster with identical physics, since the step size only changes how often state is logged
    - Gazebo rejects the value at load time and silently falls back to its default 1 ms step
    - "Contacts become unstable: wheels sink and bodies jitter, possibly at a higher real-time factor"
    - It runs slower, because every larger step needs many more solver iterations to converge
  correct: 2
- source: bb416133dcb1
  question: A colleague proposes running Isaac Sim on karmel's Jetson Orin Nano for navigation work. What is the right response?
  options:
    - "Good idea: the Orin Nano's GPU is the reference platform that Isaac Sim is developed and tested on"
    - Fine, as long as the robot's LiDAR driver is disabled to free up enough VRAM for the renderer
    - "Good idea: photorealistic rendering is exactly what tuning a navigation stack needs the most"
    - "No: Isaac Sim needs an RTX GPU with 16 GB VRAM, and Gazebo suits navigation tuning better"
  correct: 3
- source: 0c63a6c5f544
  question: A tutorial spawns a robot with `ros2 run gazebo_ros spawn_entity.py -topic robot_description`. What is wrong, and what is the modern command?
  options:
