  question: Why is the dining table modelled as a top plus four legs instead of one solid box?
  options:
    - A solid box has too many triangles for the renderer and slows the whole physics engine down
    - Like the real table, the 2D LiDAR sees only four legs, not a solid obstacle
    - Gazebo cannot render or collide boxes larger than 1 m on any side without a mesh
    - Four separate legs let the table be moved with `UserCommands` during a run
