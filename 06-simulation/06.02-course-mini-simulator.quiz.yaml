  question: Karmel's motor has $\tau = 0.08$ s. At what step size does forward Euler become unstable, and what does the wheel speed do there?
  options:
    - Above $dt = 0.16$ s ($2\tau$); the speed oscillates with growing amplitude
    - Above $dt = 0.08$ s ($\tau$); the speed freezes at its initial value
    - Above $dt = 0.04$ s ($\tau/2$); the speed slowly converges to half the target
    - Above $dt = 0.16$ s ($2\tau$); the speed saturates cleanly at 17 rad/s
  correct: 0
- source: ffa6802b61f4
  question: The course simulator at 10 Hz beats a naive simulator at 1000 Hz. What kind of error does the naive simulator have, and why does shrinking the step not remove it?
  options:
    - Random noise; each smaller step adds another noise sample, so the total noise keeps growing
    - A systematic one-step lag; halving the step halves the lag but doubles the number of steps
    - Floating-point round-off; at 1000 Hz the round-off per second dominates the result
    - A discretization error that does shrink with the step, but 1000 Hz is still too coarse
  correct: 1
