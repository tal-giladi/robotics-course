  question: Why is the update `w += (target - w) * (1 - exp(-dt/tau))` better than `w += (target - w) * dt/tau`?
  options:
    - It is cheaper to compute, because `exp` runs faster than a division on most CPUs
    - It adds damping the Euler form lacks, so it settles faster than the real motor does
    - It is the exact solution over the step, so it is accurate and stable at any step size
    - It only differs for negative targets, where forward Euler would reverse the direction
  correct: 2
