# Multiple-choice version of the quiz in 06.03-gazebo-basics.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 9ff2fe01d6bf
  question: Which three systems does every world in this course load, and what does each give you?
  options:
    - "`Sensors` (all sensor data), `Imu` (orientation estimates), and `Physics` (gravity only, no contacts)"
    - "`Physics` (time and contacts), `UserCommands` (spawn/delete/move entities), `SceneBroadcaster` (scene for GUI)"
    - "`Physics` (contacts), `Rendering` (the GUI window), and `Clock` (publishes `/clock` straight to ROS 2)"
    - "`UserCommands` (keyboard teleop), `SceneBroadcaster` (camera images), and `Sensors` (LiDAR scans)"
  correct: 1
