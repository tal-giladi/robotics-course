- source: 280f49ebf073
  question: Your world runs and `gz model --list` shows your robot, but there is no `/clock` topic and `iterations` stays at 0. What is the likely cause?
  options:
    - The `SceneBroadcaster` system is missing, so the robot was never really spawned
    - The server is paused, or the `Physics` system is missing from the world file
    - The ROS 2 bridge is not running, so Gazebo has nothing to count iterations for
    - "`use_sim_time` is false, which stops Gazebo from publishing the `/clock` topic"
  correct: 1
- source: 93a154ebdc88
  question: You want a table in your world without modelling it. What are your two options and their costs?
  options:
    - Import a CAD file (costs a licence), or sketch it in the GUI (free, but it cannot be saved to SDF)
    - Use a Fuel model (always the fastest physics), or a mesh collision (slower, but more realistic)
    - "`<include>` a Fuel model (download, dependency, maybe slow mesh collisions), or use primitives"
    - Spawn it from a URDF (needs the ROS bridge), or from SDF (needs the GUI to be open to place it)
  correct: 2
