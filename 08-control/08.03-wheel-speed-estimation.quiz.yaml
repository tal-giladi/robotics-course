  question: "A moving average of 8 samples and an EMA with the same lag: which removes more white noise?"
  options:
    - "About the same: both reduce it to about 0.35×"
    - The moving average, by roughly a factor of two
    - The EMA, by roughly a factor of two
    - "Neither: both leave white noise unchanged"
  correct: 0
- source: fb073af1a95d
  question: Why is the total rms of the raw 10 ms estimate lower than that of the 5-sample moving average, even though its noise is higher?
  options:
    - The moving average adds noise at its window edges
    - The raw estimate is computed with more precise timestamps
    - The average's extra lag costs more on a fast signal than it saves
