- source: 78d1ee4f6f95
  question: Why does halving the sample period double the noise of a raw derivative?
  options:
    - Faster sampling picks up more electrical noise from the motor driver
    - The same position error is divided by a period half as long
    - Twice as many samples means twice as much noise is summed
    - The encoder's edges jitter more when it is read more often
  correct: 1
- source: 2b4d92b41cc6
  question: You replace the firmware's α = 0.5 with α = 0.1. What happens to noise, and to a speed controller that was well tuned before?
  options:
    - Noise rises and lag falls; the controller becomes sluggish
    - Noise drops and lag is unchanged; the controller improves
    - Noise drops but lag grows from 15 to 95 ms; it may overshoot
    - Noise and lag both drop; the controller can use higher gains
  correct: 2
- source: 8d2b79943fbc
  question: A Pi-side speed estimate shows +100% spikes about every 30 samples at steady speed, while the CPU is busy. Likely cause and fix?
  options:
    - Encoder noise from the camera's USB cable; add shielding
    - Integer overflow in the tick counter; use 64-bit counts
    - The EMA is unstable at this rate; lower α to 0.1
    - Late telemetry with a fixed `dt`; use the robot's timestamps
  correct: 3
