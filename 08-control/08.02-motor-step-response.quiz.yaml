  options:
    - "Yes: a 24% gain difference means one motor is damaged"
    - "Yes: the teammate's encoder must be counting extra ticks"
    - "Probably not: normalised to 10.8 V both are about 18"
    - "Probably not: slopes always vary ±25% between runs"
