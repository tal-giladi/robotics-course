  question: Why validate a model on a staircase instead of the step you fitted?
  options:
    - A fitted model always matches its own data; a new input tests the structure
    - A staircase has less noise than a step, so the fit becomes more accurate
    - Steps saturate the motor, so they cannot be used for validation at all
    - The staircase measures the deadband, which the step cannot show
  correct: 0
- source: b86cae23438d
  question: The discrete model uses $\alpha = 1 - e^{-\Delta t/\tau}$. What is α for Δt = 10 ms and τ = 80 ms, and what does it mean?
  options:
    - "0.125: the speed reaches 12.5% of its final value in the first period"
