  question: Why must the outer loop be slower than the inner one, and by how much?
  options:
    - Otherwise the inner loop's lag acts as delay and they oscillate; 3–10× in bandwidth
    - Because the outer loop's sensor is noisier; about 1.5× in bandwidth is enough
    - Because the Pi cannot run both at the same rate; exactly 2× in bandwidth
    - It must actually be faster, so it can correct the inner loop's errors; 3–10×
  correct: 0
