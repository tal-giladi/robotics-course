- source: 56bf625ea92e
  question: Which pair correctly converts wheel speeds $(\omega_L, \omega_R)$ to $(v, \omega_z)$?
  options:
    - $v = r(\omega_L+\omega_R)/2$, $\omega_z = r(\omega_L-\omega_R)/b$
    - $v = r(\omega_L+\omega_R)$, $\omega_z = r(\omega_R-\omega_L)/(2b)$
    - $v = r(\omega_L+\omega_R)/2$, $\omega_z = r(\omega_R-\omega_L)/b$
    - $v = (\omega_L+\omega_R)/(2r)$, $\omega_z = (\omega_R-\omega_L)/(rb)$
  correct: 2
