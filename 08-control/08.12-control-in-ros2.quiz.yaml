  question: "`/odom` runs at 50 Hz, `/joint_states` positions never change, and the wheels are turning. Where is the fault?"
  options:
    - Between telemetry and the state interfaces, in the hardware component
    - In `diff_drive_controller`, which ignores the joint positions
    - In `robot_state_publisher`, which freezes `/joint_states`
    - In the encoders, which have stopped counting ticks
  correct: 0
- source: 0668b15b0dc1
  question: Why is swapping `karmel_hardware/KarmelSystem` for `gz_ros2_control/GazeboSimSystem` enough to run the robot in simulation?
