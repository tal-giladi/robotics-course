  question: Why are "D on the error" and "D on the measurement" identical when the setpoint is constant?
  options:
    - Because $de/dt = dr/dt - dy/dt = -dy/dt$ when $dr/dt = 0$
    - Because the derivative filter removes the setpoint term
    - Because $de/dt = dy/dt$ whenever the error is small
    - Because D is multiplied by zero when the setpoint is constant
