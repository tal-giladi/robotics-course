- source: c9706a6db70a
  question: Why does every tuning procedure start with an open-loop step?
  options:
    - It measures the plant alone ($K$, τ, θ), not plant plus controller
    - It is the only test that cannot damage the motor or gearbox
    - It finds the ultimate gain $K_u$ without needing any oscillation
    - It warms up the motor so later closed-loop tests are repeatable
  correct: 0
- source: fb3e41f3adc9
  question: A fit gives $\theta/\tau = 0.8$. What does that change about your plan?
  options:
    - "Nothing: it is lag-dominated, so use aggressive gains and D"
    - "It is delay-dominated: gentle gains, no D, and first remove delay"
    - It means the fit failed; repeat the step with a larger amplitude
    - Use Ziegler–Nichols open-loop gains, which suit this ratio best
  correct: 1
