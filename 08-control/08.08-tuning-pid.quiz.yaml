  question: Why does the relay method ship in commercial auto-tuners, rather than "raise $k_p$ until it oscillates"?
  options:
    - "It is bounded: the command stays within $u_0 \\pm d$, so nothing runs away"
    - It gives exact optimal gains, while raising $k_p$ gives only estimates
    - It needs no sensor, so it works on plants without feedback
    - It is required by the IEC standard for industrial controllers
