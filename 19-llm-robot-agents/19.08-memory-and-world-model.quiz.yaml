  question: The robot saw the keys on the desk 20 minutes ago with confidence 0.9. Keys have an 1800 s half-life and the threshold is 0.35. Is it worth a drive?
  options:
    - No; belief is about 0.23, below the threshold
    - Yes; belief is about 0.57, above 0.35
    - Yes; belief stays 0.9 until the half-life has passed
    - No; belief is about 0.36, too close to the threshold
