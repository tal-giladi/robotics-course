  question: Why is "looked and did not see" weaker evidence than "looked and saw"?
  options:
    - Misses are common and hallucinations rare, so a miss only scales the belief
    - A non-detection is logged with lower priority, so it is overwritten sooner
    - The detector's confidence for a miss is always 0.5 by design
    - Sightings are confirmed by the user, while misses are not
  correct: 0
