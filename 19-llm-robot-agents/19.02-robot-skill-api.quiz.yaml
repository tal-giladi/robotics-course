  question: "A colleague proposes one skill `do(action: string)` that accepts free text. Which are the three strongest objections?"
  options:
    - Nothing is enforceable, verifiable or testable
    - It costs more tokens, is slower to parse and needs a larger model
    - It cannot be serialized to JSON, cannot be logged and cannot be cached
    - It breaks MCP, prevents voice use and needs a GPU on the robot
  correct: 0
