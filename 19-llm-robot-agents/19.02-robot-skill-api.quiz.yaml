  question: "`pick` declares the precondition \"object detected in the last 120 s\" and also checks it at runtime. Isn't one redundant?"
  options:
    - Yes; the runtime check alone is enough, so the prose can be removed
    - Yes; the prose alone is enough if the model is instructed well
