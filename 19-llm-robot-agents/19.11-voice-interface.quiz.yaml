  question: You measure your wake word's false-accept rate at 4 per hour. Is that acceptable?
  options:
    - Yes, anything under 10 per hour is standard for consumer devices
    - No, any false accept is unacceptable on a robot
    - Yes, as long as the stop word has the same rate
