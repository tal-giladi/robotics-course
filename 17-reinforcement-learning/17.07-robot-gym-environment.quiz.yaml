- source: 6bf0dd6000e7
  question: Why do 8 parallel environments help PPO but not SAC?
  options:
    - PPO uses a replay buffer that parallel envs fill faster; SAC discards data after each update
    - PPO's bottleneck is collecting on-policy rollouts; SAC's is the gradient step per environment step
    - SAC requires a GPU per environment, while PPO shares one GPU across all environments
    - PPO's policy is deterministic, so parallel envs give independent data; SAC's is not
  correct: 1
