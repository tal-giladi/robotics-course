# Multiple-choice version of the quiz in 17.07-robot-gym-environment.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 52ea6091bbeb
  question: Why does the observation use $(\cos e, \sin e)$ rather than $e$?
  options:
    - $e$ is measured in degrees, which networks cannot process; $(\cos, \sin)$ converts it to radians
    - $(\cos, \sin)$ doubles the input size, which gives the network more capacity for heading
    - $e$ wraps at $\pm\pi$, so near-identical headings sit at opposite ends; $(\cos, \sin)$ is continuous in $[-1, 1]$
    - $e$ is noisy near zero, and $(\cos, \sin)$ acts as a low-pass filter on the heading signal
  correct: 2
- source: 95d116c1deb0
  question: The robot hits a wall at step 130 of a 200-step episode. What are `terminated` and `truncated`, and what happens to the next state's value?
  options:
    - "`terminated=True`, `truncated=False`; the bootstrap is masked, so the target is just the reward"
    - "`terminated=False`, `truncated=True`; the target still bootstraps with $\\gamma V(s')$"
    - "`terminated=True`, `truncated=True`; the target bootstraps with $\\gamma V(s')$ at half weight"
    - "`terminated=False`, `truncated=False`; the episode continues from the wall position"
  correct: 0
- source: dee5d74bd450
  question: What return does a policy that stands still for the whole episode get, and why is it useful to know?
  options:
    - 0, since standing still earns no reward; it shows the reward has no hidden per-step bias
    - −20 (−0.1 × 200); it is the maximum penalty, used to normalize all returns
    - +10, from the goal bonus; it shows the task is solved without moving at all
    - −10 (−0.05 × 200); it is the floor any learned behaviour must beat and a reference for hacking
  correct: 3
