  question: What does the hand-written controller do in the robustness table that the learned policies do not?
  options:
    - "Degrades gracefully: 1.00 success on every test robot, just slower, since it has no training distribution"
    - Reaches the goal fastest on every test robot, since it uses the exact robot model
    - Fails on every randomized robot, since it was tuned only for the nominal parameters
    - Matches the learned policies exactly, since both were tuned on the same simulator
