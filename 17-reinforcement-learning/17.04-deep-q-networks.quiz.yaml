    - Is γ above 0.99, is the network deeper than three layers, is the target refreshed every step
    - Is the reward normalized, is Double DQN enabled, is the learning rate above 0.01
    - Is the GPU used, is the batch size above 256, is the replay buffer larger than one million
  correct: 0
- source: feaeb937b227
  question: Why does `torch.no_grad()` around the target computation matter algorithmically, not just for speed?
  options:
    - Without it, the target network's weights are updated too, which doubles the effective learning rate
    - Q-learning is semi-gradient; differentiating through the target optimizes another objective and destabilizes
    - Without it, gradients flow into the replay buffer and corrupt the stored transitions
    - It prevents the target from being computed on the GPU, which would change floating-point results
  correct: 1
