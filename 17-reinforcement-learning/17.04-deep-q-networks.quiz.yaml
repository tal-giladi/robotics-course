- source: f37cb7f2a181
  question: Why can't you just discretize karmel's state finely and use the 17.03 tabular code?
  options:
    - Tabular Q-learning only supports four actions, while karmel needs continuous velocity commands
    - Discretizing adds quantization noise that makes the Q-learning update diverge on every step
    - The table grows as the product of all bins and generalizes to nothing; a network shares weights across similar states
    - The table would fit in memory, but lookups would be too slow for a 20 Hz control loop
  correct: 2
- source: cbc4b2a846fd
  question: What does the replay buffer fix, and what does the target network fix?
  options:
    - "Buffer: the moving target. Target net: correlated consecutive samples from the robot."
    - "Buffer: correlated data and reuse. Target net: the moving target, making each interval plain regression."
    - "Buffer: exploration, by replaying random actions. Target net: overestimation from the max."
    - "Buffer: sparse rewards, by replaying successes. Target net: the exploration schedule."
  correct: 1
