- source: 2551dd30680b
  question: Why does the max in the TD target bias values upward, and how does Double DQN help?
  options:
    - The max ignores negative rewards; Double DQN adds them back with a second reward head
    - The max uses a stale network; Double DQN refreshes the target network twice as often
    - The max favours frequent actions; Double DQN samples actions twice to balance their counts
    - The max picks lucky noise (Jensen); Double DQN selects with the online net and evaluates with the target net
  correct: 3
