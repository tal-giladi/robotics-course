- source: 40470f74e631
  question: Why can't you compute $\nabla_\theta J$ by differentiating the reward with respect to the action?
  options:
    - The reward is always a constant per episode, so its derivative with respect to the action is zero
    - There is no differentiable model of the environment; the log-derivative trick moves the derivative onto $\pi$
    - Actions are integers in policy-gradient methods, so no derivative with respect to them exists
    - Differentiating the reward is possible but ten times slower than sampling trajectories
  correct: 1
