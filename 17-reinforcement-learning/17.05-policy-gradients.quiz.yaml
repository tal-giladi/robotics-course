- source: fb3823feb3b2
  question: Why is subtracting a baseline free, and what does it buy?
  options:
    - The baseline is learned separately, so it costs no samples; it removes all bias from the estimate
    - The baseline is constant, so its gradient vanishes; it speeds up each gradient computation
    - $\mathbb{E}_a[\pi] = 1$, so it cancels in the ratio; it lets the policy reuse old trajectories
    - $\mathbb{E}_a[\nabla\log\pi] = 0$, so it stays unbiased; it lowers variance and makes failures informative
  correct: 3
- source: 9add68aa27a9
  question: Rewards are 0 everywhere and +1 on success, no baseline, and the policy succeeds once in 200 episodes. What does the learning curve look like?
  options:
    - "Steadily rising: each failure pushes the policy away from bad actions, even without a baseline"
    - "Oscillating wildly: each failure gives a large negative gradient that cancels the success"
    - Rising quickly at first, then flat, as the single success is replayed many times
    - "Flat for long stretches: 199 of 200 episodes give zero gradient, and the rare update is very noisy"
  correct: 3
- source: 4555c55babca
  question: Why can't REINFORCE use a replay buffer, while DQN can?
  options:
    - Its networks are too small to benefit from replay; DQN's larger networks need more data
    - Its estimator assumes data from the current policy; DQN's Bellman-optimality target is off-policy
    - It updates once per episode, so there is nothing to replay; DQN updates every step
    - Its rewards are sparse, so replay would only repeat failures; DQN's rewards are dense
  correct: 1
