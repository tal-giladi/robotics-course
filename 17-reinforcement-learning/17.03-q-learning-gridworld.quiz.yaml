# Multiple-choice version of the quiz in 17.03-q-learning-gridworld.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 05243b675968
  question: Which is the correct Q-learning update?
  options:
    - $Q(s,a) \leftarrow Q(s,a) + \alpha[r + \gamma Q(s',a') - Q(s,a)]$ with $a'$ the action taken
    - $Q(s,a) \leftarrow Q(s,a) + \alpha[r + \gamma \max_{a'} Q(s',a') - Q(s,a)]$
    - $Q(s,a) \leftarrow Q(s,a) + \gamma[r + \alpha \max_{a'} Q(s',a') - Q(s,a)]$
    - $Q(s,a) \leftarrow r + \gamma \max_{a'} Q(s',a') - \alpha Q(s,a)$
  correct: 1
