- source: 5495015bb1b0
  question: Why is Q-learning called off-policy, and why is that useful for a robot?
  options:
    - It learns a policy without ever executing it, so the robot never needs to move during training
    - It switches policies every episode, so the robot explores several strategies in parallel
    - Its target uses the greedy max, not the action taken, so it can learn from exploring, teleop or logged data
    - Its target uses the action actually taken, so it matches exactly what the robot did
  correct: 2
- source: 519222d63d2d
  question: You train on the slippery grid with α = 0.9 for 50 000 episodes. Will the greedy policy be reliable?
  options:
    - "Yes: 50 000 episodes average out any noise, whatever the step size"
    - "Yes: a high α converges faster, and the slip noise only affects the first episodes"
    - "Not reliably: α = 0.9 is too small, so Q-values never reach the true values"
    - "Not reliably: each update copies the latest noisy target, so risky actions flip"
  correct: 3
- source: aaab989828d2
  question: Episodes are cut at 100 steps. At step 100 the robot is in cell 7, not terminal. What target does the last update use?
  options:
    - $r$ alone, since the episode has ended
    - $0$, since truncated transitions are discarded
    - $r + \gamma \max_{a'} Q(7, a')$, since truncation still bootstraps
    - $r + \gamma \max_{a'} Q(0, a')$, from the reset state
  correct: 2
