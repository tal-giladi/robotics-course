- source: 5a2dfcf6fbe5
  question: Why do optimistic initial values explore only early on?
  options:
    - The optimism decays with a fixed schedule, like ε in ε-greedy, reaching zero after N steps
    - Optimistic values are reset after each episode, so exploration only happens in the first steps
    - Trying an action drags its overrated estimate down; once all are realistic, the agent is plain greedy
    - Optimism raises the learning rate early, which shrinks as estimates converge to the true values
