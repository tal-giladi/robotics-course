  question: A greedy bandit starts at 0. Approach 1 (true 0.70) first fails; approach 0 (0.55) first succeeds. What happens, and why does ε-greedy fix it?
  options:
    - Greedy alternates between both until their estimates match; ε-greedy only speeds that up
    - Greedy switches to approach 1 once approach 0 fails; ε-greedy is unnecessary here
    - Greedy sticks to approach 1 (it was tried first); ε-greedy moves it to approach 0
    - Greedy sticks to approach 0 (~0.55 > frozen 0); ε-greedy keeps sampling approach 1 until it overtakes
  correct: 3
