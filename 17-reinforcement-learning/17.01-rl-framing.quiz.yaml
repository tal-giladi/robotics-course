- source: e529cca49013
  question: Why is (x, y, θ) alone not a Markov state for a robot with a 0.08 s motor time constant?
  options:
    - The pose is measured with noise, and Markov states must be noise-free
    - The next pose depends on current wheel speeds, which the state lacks; add $v, \omega$
    - θ wraps around at 2π, which breaks the Markov property; use sin θ and cos θ
    - The time constant is shorter than the control period, so the state is always stale
  correct: 1
