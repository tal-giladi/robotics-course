- source: 274b127f2646
  question: What is the difference between the agent's policy and the environment's transition function?
  options:
    - The policy $\pi(s' \mid s, a)$ predicts the next state; $P(a \mid s)$ picks the action the world allows
    - "Both are learned by the agent: the policy from rewards, the transition function from observations"
    - The policy is fixed by the designer; the transition function is what the agent learns to control
    - The policy $\pi(a \mid s)$ is learned by the agent; $P(s' \mid s, a)$ belongs to the world and is usually unseen
  correct: 3
- source: ba3f0e838c1f
  question: A teammate's go-to-goal environment feeds the simulator's true pose, slip and battery voltage into the observation. Training works great. Why worry?
  options:
    - True values make training too easy, so the policy converges before it has explored enough
    - The simulator's values are in different units from the real sensors, so the policy must be rescaled
    - The real robot can't observe them; keep observations sensor-derived with noise, privileged info only for the critic
    - Privileged inputs slow training down, so removing them will make the policy converge faster
  correct: 2
