  question: Which list gives the five parts of an MDP with karmel's go-to-goal version of each?
  options:
    - States (camera image), actions (motor PWM), transitions (the policy), reward (+1 per step), discount (0.5)
    - States ($v$, $\omega$), actions (goal pose), transitions (the reward), reward (physics), discount (0.99)
    - States (goal distance/heading), actions ($v, \omega$), transitions (the critic), reward (−1 per step), learning rate (0.99)
    - States (goal distance/heading, $v$, $\omega$), actions ($v, \omega$), transitions (physics), reward (progress, ±10), discount (0.99)
