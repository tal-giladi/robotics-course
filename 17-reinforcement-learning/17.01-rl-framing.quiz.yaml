  question: An environment marks the 20 s time limit as `terminated=True`, and the robot is near the goal at 19.9 s in many episodes. What does the learner believe?
  options:
    - Those states have no future value, so near-goal-late is undervalued and targets become inconsistent
    - Those states are very valuable, since the episode ends successfully at the time limit
    - Nothing changes, since the learner treats termination and truncation identically
    - Those states are dangerous, since termination is always interpreted as a collision
