[develop]
script_dir=$base/lib/karmel_base
[install]
install_scripts=$base/lib/karmel_base

[flake8]
# ament_flake8 defaults, with 120 columns for readable, commented teaching code.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D213,D301,D404,I202,Q000
import-order-style = google
application-import-names = karmel_base
max-line-length = 120
show-source = true
statistics = true
