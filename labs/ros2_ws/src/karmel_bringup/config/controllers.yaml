# ros2_control controllers for karmel — identical for simulation and the real robot.
#
#   sim:   gz_ros2_control (inside Gazebo) loads this file; hardware = GazeboSimSystem
#   real:  ros2_control_node loads this file;               hardware = karmel_hardware/KarmelSystem
#
# Physical values are copied from labs/config/karmel.yaml; karmel_bringup/test/test_config.py
# fails if they drift apart.
#
# Topics (robot.launch.py remaps the controller's private topics to the usual names):
#   /cmd_vel   geometry_msgs/TwistStamped  -> diff_drive_controller   (Jazzy: stamped only!)
#   /odom      nav_msgs/Odometry           <- diff_drive_controller
#   /tf        odom -> base_footprint      <- diff_drive_controller (enable_odom_tf)
#   /joint_states                          <- joint_state_broadcaster

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz. The Pico sends telemetry at 50 Hz; faster buys nothing on the real robot.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # karmel.yaml: drive.wheel_separation_m, drive.wheel_radius_m
    wheel_separation: 0.200
    wheel_radius: 0.045
    # Calibration knobs (lesson 09.05): scale instead of editing the geometry above.
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    # base_footprint, not base_link: the URDF root is base_footprint (-> base_link, fixed). A TF frame can
    # have only one parent, so odometry must attach to the root or the tree splits in two.
    base_frame_id: base_footprint
    # x, y, z, roll, pitch, yaw — a planar robot knows z/roll/pitch "exactly"
    pose_covariance_diagonal: [0.001, 0.001, 1.0e-6, 1.0e-6, 1.0e-6, 0.01]
    twist_covariance_diagonal: [0.001, 1.0e-6, 1.0e-6, 1.0e-6, 1.0e-6, 0.005]

    open_loop: false          # integrate measured wheel motion, not the commands
    position_feedback: true   # use wheel position state (encoder ticks), not velocity
    enable_odom_tf: true      # set false when robot_localization's EKF publishes odom -> base_footprint

    cmd_vel_timeout: 0.5      # s without a command -> stop
    publish_limited_velocity: true

    # karmel.yaml: drive.max_linear_speed_m_s, drive.max_angular_speed_rad_s, drive.max_linear_accel_m_s2
    # (Jazzy: limits apply when set; leave a limit as NaN (.nan) to disable it.
    #  min_acceleration is deprecated in ros2_controllers 4.x -- use max_deceleration, same
    #  sign convention: max_acceleration >= 0, max_deceleration <= 0. The reverse-direction
    #  limits default to -max_acceleration / -max_deceleration, which is what we want.)
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.0
    angular.z.max_velocity: 2.5
    angular.z.min_velocity: -2.5
    angular.z.max_acceleration: 5.0
    angular.z.max_deceleration: -5.0
