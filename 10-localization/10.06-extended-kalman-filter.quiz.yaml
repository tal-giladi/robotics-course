  question: You set the gate to $d^2 < 0.1$ instead of 5.991. What happens over a 50 s tour?
  options:
    - ~95 % rejected; drifts toward dead reckoning, then accepts again in a ragged cycle
    - Nothing changes, since honest measurements always have $d^2 < 0.1$
    - All outliers pass, since a tighter gate admits more measurements
    - The filter crashes on the first rejection with a singular S
  correct: 0
- source: 8f3dcda9126e
  question: Analytic and numerical $H$ agree except in the bearing row, off by about $3\times10^6$ at one pose. What is wrong?
  options:
    - The analytic $H$ has a sign error in the bearing row
    - ε is too large; use $10^{-12}$ in the numerical Jacobian
    - "Nothing in $H$: the numerical bearing wrapped across ±π; wrap angle differences"
    - The landmark is at the robot's position, so $H$ is singular
  correct: 2
- source: ca234f328d67
  question: On the real robot you have no ground truth. How do you decide whether the EKF's covariance is trustworthy?
  options:
    - Check that $P$ shrinks after every update and never grows
    - Compare the EKF pose with raw odometry at the end of a drive
    - Run in simulation only, since real robots can't be validated
    - NIS averaging m, a few-percent rejection rate, and a taped closed loop vs 2σ
