- source: 1ef50d0fcb6d
  question: In the 2-state filter the off-diagonal of $\bar P$ is zero. A position measurement arrives. What happens to the velocity estimate?
  options:
    - It is set to the position change divided by Δt
    - It moves by the full innovation, since $K_v = 1$
    - "Nothing: $K_v = 0$, so velocity and its variance are unchanged"
    - Its variance drops, but its value stays the same
  correct: 2
