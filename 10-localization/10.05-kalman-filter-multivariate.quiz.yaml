- source: e768aef23b45
  question: Which set of Kalman filter equations is correct?
  options:
    - $\bar P = FPF^\top + Q$; $S = H\bar PH^\top + R$; $K = \bar PH^\top S^{-1}$; $P = (I-KH)\bar P$
    - $\bar P = FPF^\top - Q$; $S = H\bar PH^\top + R$; $K = S^{-1}H\bar P$; $P = (I+KH)\bar P$
    - $\bar P = F^\top PF + Q$; $S = H\bar PH^\top - R$; $K = \bar PH^\top S$; $P = KH\bar P$
    - $\bar P = FP + Q$; $S = \bar P + R$; $K = \bar P S^{-1}$; $P = (I-K)\bar P$ for any $H$
  correct: 0
- source: 3ba401137fc6
  question: $\Delta t = 0.02$ s, σ_a = 1 m/s². What is Q for the constant-velocity model?
