- source: be677a654afe
  question: What is the innovation variance S, and what should the average of ν²/S be for a well-tuned filter?
  options:
    - S = P̄ − R, the prediction's excess over noise; about 0
    - S = P̄ + R, the expected innovation variance; about 1
    - S = R, the sensor's own variance alone; about 2
    - S = K·P̄, the variance removed by the update; about 0.5
