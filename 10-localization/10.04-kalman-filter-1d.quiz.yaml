- source: b168b9c6f45f
  question: A filter works at 20 Hz; raising the loop to 100 Hz with the same Q and R makes it noisier. Why, and the fix?
  options:
    - R is per second; multiply R by 5 at 100 Hz
    - The sensor is noisier at 100 Hz; add a low-pass filter
