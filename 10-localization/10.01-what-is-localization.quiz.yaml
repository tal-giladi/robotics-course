- source: 3f8d43207732
  question: Which is the definition of the belief $bel(\mathbf{x}_k)$?
  options:
    - "$p(\\mathbf{z}_k \\mid \\mathbf{x}_k)$: the probability of the latest measurement given the state"
    - "$p(\\mathbf{x}_k \\mid \\mathbf{z}_{1:k}, \\mathbf{u}_{1:k})$: the state given all measurements and controls so far"
    - "$p(\\mathbf{x}_k \\mid \\mathbf{x}_{k-1}, \\mathbf{u}_k)$: the state given the last state and control"
    - "$p(\\mathbf{x}_k \\mid \\mathbf{z}_k)$: the state given only the current measurement"
  correct: 1
