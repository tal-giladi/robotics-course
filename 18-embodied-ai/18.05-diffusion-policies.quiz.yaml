# Multiple-choice version of the quiz in 18.05-diffusion-policies.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 0270299ff56a
  question: Why does MSE regression fail on bimodal demonstrations while a diffusion policy does not?
  options:
    - MSE overfits to the more frequent mode; diffusion reweights modes so both are equally likely
    - MSE predicts the mean, which lies between the modes; diffusion turns noise into samples that each land in one mode
    - MSE cannot handle multi-dimensional actions; diffusion predicts each joint independently
    - MSE needs more data per mode; diffusion works because it trains for many more epochs
  correct: 1
