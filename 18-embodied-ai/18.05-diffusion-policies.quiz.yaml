- source: 26a8546f56ea
  question: Why does Diffusion Policy generate a sequence of actions but execute only part of it?
  options:
    - The later actions in the sequence are always too noisy to execute safely
    - Executing only part saves GPU memory, since the rest of the sequence is never computed
    - The sequence is averaged with the previous one, and only the overlap is valid
    - Consistent motion committed to one mode; executing the first $T_a$ then re-planning stays reactive
  correct: 3
- source: bdf09325f75e
  question: A policy was trained with $K = 100$. How many network passes does inference need with DDPM, and with DDIM at 10 steps, and what is the trade-off?
  options:
    - 100 vs 10; DDIM is ~10× cheaper but its larger deterministic steps amplify model errors
    - 10 vs 100; DDPM is cheaper but its random steps can reduce mode balance
    - 100 vs 10; DDIM is ~10× cheaper with no loss in success, so it is always better
    - 1 vs 10; DDPM predicts the clean chunk directly, DDIM needs iterative refinement
  correct: 0
