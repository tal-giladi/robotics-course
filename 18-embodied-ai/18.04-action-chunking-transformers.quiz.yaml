  question: Why does ACT's CVAE use its encoder only during training, and what replaces $z$ at run time?
  options:
    - The encoder is too slow for real time; $z$ is sampled randomly from $\mathcal{N}(0, I)$ each step
    - The encoder needs the true future action chunk; at run time $z$ is set to zero, the prior mean
    - The encoder overfits to camera images; at run time $z$ is taken from the last training batch
    - The encoder is only needed for the KL loss; at run time $z$ comes from the current joint state
