  question: Latency is 2 s and the chunk is 50 actions at 30 Hz. What does the arm do in async mode?
  options:
    - "Holds still: the chunk covers 1.67 s, so every action is stale on arrival and discarded"
    - Executes each chunk late but completely, lagging 2 s behind the scene
    - "Moves in jerks: executes 0.33 s of each chunk, then pauses 1.67 s"
    - Works normally, because async mode hides any latency shorter than the episode
