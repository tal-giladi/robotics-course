- source: 7382f07b369e
  question: What does SmolVLA train by default when you fine-tune it in LeRobot, and why does that matter for VRAM?
  options:
    - All parameters with LoRA adapters; adapters halve the activation memory
    - Only the vision encoder; the action expert is frozen to keep peak VRAM near 4 GB
    - The action expert (and state projection) with the VLM frozen; no gradients or optimizer state for it, ≈10–16 GB
    - All parameters in full precision; VRAM stays low because SmolVLA has only 45M parameters
  correct: 2
- source: 0d5268c3408e
