  options:
    - It sends observations more often, multiplying server load, while freshness gains flatten
    - It makes each chunk longer, so the arm runs open loop for more time
    - It forces the server to use more denoising steps per chunk, raising latency
    - It lowers the control rate, since the robot waits for each chunk to fill
