- source: 016415c00de0
  question: Your filter clips steps relative to the last commanded position instead of the measured one, and the servo is stalled against an object. What happens?
  options:
    - The filter trips immediately, since the command stops changing
    - Nothing; the clipping keeps every step small, so the servo stays safe
    - The joint oscillates around the object at the step size
    - The command runs away from the real position, then jumps when it slips free
