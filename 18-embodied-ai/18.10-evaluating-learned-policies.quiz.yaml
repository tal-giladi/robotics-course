- source: bae79962c06c
  question: A held-out condition scores 3/10 and the in-distribution one 17/20. The team wants to ship because "overall 20/30 = 67%". What is wrong?
  options:
    - Nothing, if the 67% lower bound exceeds the target
    - 30 trials are too few; pooling is fine once you reach 100
    - Pooling hides failure in the held-out condition; report per condition and restrict preconditions
    - The held-out trials should be dropped, since they test an unsupported case
  correct: 2
