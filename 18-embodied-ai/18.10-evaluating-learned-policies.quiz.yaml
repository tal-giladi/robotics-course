# Multiple-choice version of the quiz in 18.10-evaluating-learned-policies.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 4d313adeb1f9
  question: You observe 9/10 successes. What is the Wilson 95% interval, and what can you honestly claim?
  options:
    - About [85%, 95%]; the policy succeeds about 90% of the time
    - About [60%, 98%]; more often than not, but not 80% with confidence
    - About [80%, 100%]; you can claim at least 80% success
    - About [10%, 90%]; you cannot claim anything from 10 trials
  correct: 1
- source: 971500c89cfc
  question: Why does the Wald interval fail at 10/10, and what does the rule of three say instead?
  options:
    - Wald divides by zero and returns no interval; failure-rate bound ≈ 3%
    - Wald widens to [0%, 100%]; failure-rate bound is 3 failures per 10 trials
    - Wald is fine at 10/10; the rule of three only applies to fewer than 3 trials
    - Standard error is 0, so it collapses to [100%, 100%]; 95% failure-rate bound ≈ 3/n ≈ 30%
  correct: 3
- source: 92a960ced611
  question: Policy A scores 18/20, policy B 14/20. Is A better?
  options:
    - Not established; the difference interval includes 0 (Fisher p ≫ 0.05)
    - Yes; a 20-point difference is significant at 20 trials each
    - Yes, because A's lower Wilson bound is above B's point estimate
    - No; B is better, since its interval is wider
  correct: 0
