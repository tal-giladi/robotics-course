- source: 6065a571b027
  question: What does shadow mode catch on the deployment ladder that simulation does not?
  options:
    - Contact forces and grasp slip, because the arm moves at reduced speed
    - Unit/sign errors, camera mismatches and latency on real inputs, with no motion
    - Long-term drift in success rate after weeks of use in production
    - Bugs in the training code, because the policy is retrained on live data
