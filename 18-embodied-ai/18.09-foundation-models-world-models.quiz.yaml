  question: What does "robot foundation model" mean in practice in September 2026?
  options:
    - A model that runs zero-shot on any new robot without demonstrations from that robot
    - A large language model that writes robot control code from natural-language task descriptions
    - A model pre-trained on diverse robot data; fine-tuning on tens to hundreds of target demos beats training from scratch
    - A simulator-trained model that transfers to hardware using domain randomization alone
