- source: b3e735f4fea1
  question: What is covariate shift in behavior cloning?
  options:
    - The expert's demonstrations drift over time, so later episodes contradict the earlier ones
    - The camera's lighting changes between training and deployment, shifting the input pixel statistics
    - The policy is trained on the expert's states but its own actions lead it to states with no training data
    - The action labels are noisy, so the policy learns the mean of the expert's actions instead of the mode
  correct: 2
- source: ebab81873149
  question: Per-step unrecoverable-mistake probability 0.5%, episode 20 s at 30 Hz. What is the probability of a clean episode?
  options:
    - About 90%
    - About 5%
    - About 50%
    - About 0.5%
  correct: 1
- source: 879a979451c1
  question: Why does DAgger reduce the compounding-error bound from $O(\epsilon T^2)$ to roughly $O(\epsilon T)$?
  options:
    - It trains on the state distribution the learner itself visits, so its mistakes no longer lead into unlabelled states
    - It shortens every episode to a fixed horizon, so the number of steps $T$ grows more slowly
    - It replaces the MSE loss with an L1 loss, which is less sensitive to large errors
    - It collects many more expert demonstrations on the same centre line, reducing $\epsilon$ quadratically
  correct: 0
- source: 0f59e1a8e650
  question: Demonstrations at the start state are 50% $a = (0.4, +0.3)$ and 50% $a = (0.4, -0.3)$ m/s. What do MSE- and L1-trained policies output?
  options:
    - MSE picks one mode, e.g. $(0.4, +0.3)$; L1 outputs the mean $(0.4, 0.0)$
    - Both pick a mode at random each step, alternating between $+0.3$ and $-0.3$
    - "MSE: the mean $(0.4, 0.0)$; L1: a median, any $v_y$ in $[-0.3, 0.3]$"
    - MSE outputs $(0.4, 0.0)$; L1 always picks the upper mode $(0.4, +0.3)$
  correct: 2
