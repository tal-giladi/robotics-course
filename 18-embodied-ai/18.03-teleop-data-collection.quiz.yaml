- source: 13da0930751c
  question: In a LeRobot SO-101 recording, what is stored as `action` and what as `observation.state`, and why does it matter?
  options:
    - "`action` is the follower's measured joints; `observation.state` is the leader's; the policy learns what actually happened"
    - "`action` = leader's joints (the intended command, valid even if the follower lags); `observation.state` = follower's measured joints"
    - Both store the follower's joints at different timestamps; the difference gives the velocity the policy learns
    - "`action` is the motor current; `observation.state` is the leader's joints; the policy learns torque control"
  correct: 1
- source: 382f75671818
  question: Why does the leader arm use lower gear ratios (1/147, 1/191) on most joints than the follower (1/345)?
  options:
    - Lower reduction gives the leader higher position resolution for precise recording
    - Lower reduction makes the leader faster so it can move ahead of the follower
    - Easier to back-drive by hand with torque off; the follower needs reduction for torque
    - Lower reduction draws less current, so the leader can run from USB power alone
  correct: 2
