- source: 024b4502f561
  question: Why must a learned policy never command the servos directly?
  options:
    - Its output rate is too slow for servos, so hard limits are only needed to interpolate between actions
    - It can output any value, even far outside training, with no warning; hard limits, watchdog and e-stop must enforce safety
    - Servos only accept joint angles, while policies always output end-effector poses in Cartesian space
    - Learned policies are nondeterministic, so identical inputs must be averaged over several runs before sending
  correct: 1
