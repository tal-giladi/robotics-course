- source: 915104ef5731
  question: Which single invariant, asserted once per cycle, catches both a forgotten detach and a wrongly attached object?
  options:
    - The number of world objects equals the number of detections in the current frame
    - The attached object's pose equals the tool frame's pose to within the padding
    - The scene's attached object equals the pipeline's `holding` state (same id, or both empty)
    - The gripper width equals the attached object's width to within 5 mm
  correct: 2
- source: 6e09bcd73450
  question: Why is `stop` the first rung of the collision-recovery ladder rather than `retreat`?
  options:
    - Retreating requires a plan, which takes longer than the servo's thermal protection allows
    - A moving controller is a hazard and later steps assume no motion; stopping is free, retreating changes the world
    - Stopping clears the collision from the planning scene, which retreating cannot do
    - Retreating is only allowed after a human confirms, while stopping needs no confirmation
  correct: 1
