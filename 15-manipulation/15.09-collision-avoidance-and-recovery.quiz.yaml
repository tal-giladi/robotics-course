  question: 'Which recoveries must not be prefixed with "put the held object down": `plan_failed`, `dropped`, `joint_limit`, `attached_but_empty`?'
  options:
    - "`plan_failed` and `joint_limit`, since their recoveries don't move the gripper"
    - "`plan_failed` and `dropped`, since both happen before the object is lifted"
    - All four, since putting an object down is never part of a recovery
    - "`dropped` and `attached_but_empty`, since the gripper is not holding anything"
