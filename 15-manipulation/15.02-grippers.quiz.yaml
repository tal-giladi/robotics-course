- source: e63fe5b2f78f
  question: You swap a 20 mm suction cup for a 40 mm one at the same 60 kPa. How do pull-off force and payload change?
  options:
    - Both 2×; force scales with diameter, and a larger cup also seals more easily
    - Force 4×, payload unchanged; the pump's flow rate limits the payload, not the area
    - Both 8×; force scales with volume, so doubling the diameter multiplies it by eight
    - Both 4×; but finding a flat, clean 40 mm patch is usually the binding constraint
  correct: 3
- source: 638a0e23cdf1
  question: Why can a coin-sized suction cup out-lift an entire servo-driven jaw?
  options:
    - The pump's motor is far stronger than the servo, and suction transfers its full power without gearbox losses
    - The atmosphere does the work (up to ~31.7 N on 20 mm); the pump only removes air, while a jaw needs a flat patch less
    - Suction cups exploit static electricity on plastic surfaces, which adds to the vacuum force
    - The cup's rubber lip has a friction coefficient above 2, which multiplies the pump's holding force
  correct: 1
