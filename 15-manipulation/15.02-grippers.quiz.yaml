  question: Your gripper has a 45 mm stroke. What is the widest object you should plan to grasp, and why not 45 mm?
  options:
    - About 45 mm; the stroke is measured with clearance already included by the maker
    - About 35 mm; the jaws must descend around it despite pose and positioning errors
    - About 22 mm; each jaw can only travel half the stroke toward the object
    - About 40 mm; the pads compress by 5 mm, which is all the margin needed
