  question: "Two grippers cost the same: one has twice the stroke, the other twice the force. Which do you buy for a kitchen pick-and-place robot?"
  options:
    - "Force: heavier kitchen items like pots need it, while stroke can be extended with longer fingers"
    - "Force: grip force is the main cause of failed picks, while stroke only matters for boxes"
