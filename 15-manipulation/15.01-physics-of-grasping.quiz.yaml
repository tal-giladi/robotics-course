- source: 6fc43d4cad11
  question: You double the grip force on a grasp whose $\varepsilon$ is 0. What happens to $\varepsilon$?
  options:
    - It becomes positive, since more force widens each friction cone
    - It doubles, since $\varepsilon$ scales linearly with contact force
    - It becomes negative, since extra force pushes the object out
    - "Nothing: it stays 0, since $\\varepsilon$ uses unit wrenches and is scale-free"
  correct: 3
- source: e28b6a50a176
  question: Why does adding a fourth and fifth finger around a disc not improve $\varepsilon$, when the third one did?
  options:
    - Three evenly spaced cones already span the wrench space; extra wrenches fall inside the existing hull
    - Each extra finger adds friction, but also adds an opposing wrench that cancels the gain exactly
    - $\varepsilon$ is defined for at most three contacts, so extra fingers are simply ignored by the metric
    - With more fingers the contact forces are split further, so each cone shrinks and $\varepsilon$ stays flat
  correct: 0
- source: fa3352e294d8
  question: A grasp passes `is_antipodal` but the object spins out of the jaws during lift. What's happening, and the cheapest fix?
  options:
    - Insufficient friction along the normal; double the grip force until the object stops rotating
    - The pads are too soft and compress unevenly; switch to harder, smaller pads with a higher $\mu$
    - Torsion about the contact normal from an off-centre grasp; move the grasp line nearer the centre of mass
    - The lift is too fast; reduce lift acceleration so the object's inertia cannot overcome friction
  correct: 2
- source: d45f714345fc
  question: An object's gripping faces taper by 25°. What is the minimum pad $\mu$ for force closure in a pinch?
