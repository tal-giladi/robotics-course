  question: A pad has $\mu = 0.45$. What is the friction-cone half-angle, and what does it mean physically?
  options:
    - About 24.2°; forces within it of the normal stick, beyond it slip (also the object's sliding ramp angle)
    - About 65.8°; forces within it of the surface plane stick, beyond it slip toward the normal
    - About 24.2°; forces within it of the surface plane stick, beyond it lift the object off
    - About 45.0°; forces within it of the normal stick, since cone angles are independent of $\mu$
  correct: 0
- source: cbce3117864a
  question: The jaw makes 6 N per pad. With $\mu = 0.5$, two pads, safety factor 2 and a 1 m/s² lift, what is the heaviest object you may pick?
  options:
