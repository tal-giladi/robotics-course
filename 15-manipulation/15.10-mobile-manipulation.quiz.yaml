# Multiple-choice version of the quiz in 15.10-mobile-manipulation.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 4daad7ac5bab
  question: karmel's support polygon has vertices (+0.10, 0) and (0, ±0.10). What is its backward stability margin with no arm, and why is that surprising?
  options:
    - "100 mm: the CoM sits at the caster, far from the rear edge of the polygon"
    - "50 mm: the CoM sits midway between axle and caster, a comfortable margin"
    - "Zero: the CoM sits on the wheel axle, which is the polygon's rear edge"
    - "Negative: the bare base already tips backward without the arm mounted"
  correct: 2
- source: b8e41376379b
  question: You move the arm's mount 80 mm backwards, reasoning that mass further back is further from the tipping edge. Does it work?
  options:
    - "No: the rear edge is the one that matters, and the folded margin goes from +12 mm to −11 mm"
    - "Yes: the folded margin grows from +12 mm to +78 mm, since the arm moves away from the caster"
    - Yes, but only when folded; at full extension the margin drops from +12 mm to −11 mm
    - "No: the margin is unchanged, since the arm's mass is too small to move the CoM"
