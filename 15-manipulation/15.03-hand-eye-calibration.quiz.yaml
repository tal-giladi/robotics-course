    - Target on the gripper, $X = T_{\text{gripper,cam}}$, and $B_{ij}$ is inverted while $A$ is unchanged
    - "Nothing: the same code works, since eye-to-hand is only a different physical setup"
    - Target stays on the table, $X = T_{\text{base,cam}}$, and twice as many poses are required
