# Multiple-choice version of the quiz in 07.04-tof-sensors.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: aa614ef660cb
  question: Why can a cheap ToF chip resolve 6.67 ps when no cheap clock can?
  options:
    - It uses a crystal oscillator running at 150 GHz inside the package
    - It measures the phase of a single pulse with an analogue comparator
    - It histograms millions of photon arrivals; precision improves as $1/\sqrt N$
    - It interpolates between two coarse clock ticks with a lookup table
  correct: 2
