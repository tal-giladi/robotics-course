  question: σ at 1 m is 3 mm in the dark. What is σ at 3 m in the dark, and in a room whose ambient rate equals 3× the 1 m signal?
  options:
    - 9 mm in the dark; about 24 mm with that ambient light
    - 27 mm in the dark; about 72 mm with that ambient light
    - 3 mm in the dark; about 9 mm with that ambient light
    - 9 mm in the dark; still about 9 mm with that ambient light
  correct: 0
