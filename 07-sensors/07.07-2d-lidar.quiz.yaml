# Multiple-choice version of the quiz in 07.07-2d-lidar.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: ef98a33affdc
  question: "`angle_min = -π`, `angle_increment = 0.01745`, 360 ranges. Which index is straight ahead, and which is the robot's left?"
  options:
    - Ahead is index 0; left is index 90
    - Ahead is index 180; left is index 90
    - Ahead is index 180; left is index 270
    - Ahead is index 0; left is index 270
  correct: 2
