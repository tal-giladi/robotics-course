  question: Your unit's range error is 3 cm at 1 m and 13 cm at 6 m. What technology is it, and what does that mean for mapping?
  options:
    - "Triangulation (error ~ range²): far walls fuzzy; map in short legs"
    - "dToF (error constant): far walls sharp; map in one long pass"
    - "dToF (error ~ range): all walls equally fuzzy; lower resolution"
    - "Triangulation (error constant): near walls fuzzy; map from afar"
  correct: 0
- source: f39760abb73b
  question: Why does `sector_min` return `inf` rather than `0.0` for an empty sector?
  options:
    - "`0.0` would overflow the float in the scan message and corrupt the data"
    - "`inf` is required by the `LaserScan` spec for every sector function"
    - "`inf` makes the safety stop fire sooner, which is always safer"
    - "`inf` is the truth; `0.0` would fire a safety stop in every clear corridor"
  correct: 3
