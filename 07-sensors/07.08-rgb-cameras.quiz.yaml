# Multiple-choice version of the quiz in 07.08-rgb-cameras.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: fd96ec94b34e
  question: How many Mbit/s is a 640×480 `rgb8` stream at 15 fps, and what happens over an 80 Mbit/s Wi-Fi link?
  options:
    - 36.9 Mbit/s; it fits comfortably with room to spare
    - 110.6 Mbit/s; frames drop silently, a stuttering stream
    - 110.6 Mbit/s; the publisher blocks and reports an error
    - 13.8 Mbit/s; it fits, but only in `mono8` encoding
  correct: 1
- source: 3eeb4c05df78
  question: Turning at 1 rad/s with a 33 ms exposure, how much blur, versus driving toward an object 2 m away at 0.3 m/s?
  options:
    - About 2.6 px turning; about 17.6 px driving forward
    - About 17.6 px in both cases, since exposure is the same
    - About 1.8 px turning; about 0.3 px driving forward
    - About 17.6 px turning; about 2.6 px driving forward
