  question: What does `K[0] == 0.0` mean in a `CameraInfo`, and what will a 3D projection node do with it?
  options:
    - Uncalibrated camera; projection divides by zero, giving inf/nan
    - Ideal pinhole with no distortion; projection works as normal
    - Focal length in millimetres; the node converts it automatically
    - Mono camera; the node falls back to the default intrinsics
