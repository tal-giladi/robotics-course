- source: 72546405c5e6
  question: Why does a mission layer belong in your code rather than in Nav2?
  options:
    - Nav2 cannot run more than one goal per session, so missions must restart Nav2 between every stop.
    - The right failure policy is domain-specific; Nav2 provides the mechanism (one goal, one result) and leaves policy out.
    - Nav2's behavior trees cannot call Python, so any mission logic must live in a separate Python node.
    - Mission logic in Nav2 would slow its controller loop below 20 Hz on a Raspberry Pi.
  correct: 1
- source: 7456dcf82826
  question: You call `goToPose`, then 2 seconds later `goToPose` with a different pose, without cancelling. What happens?
  options:
    - The new goal is queued; the robot finishes the first pose, then drives on to the second one
    - The new goal is rejected because a goal is active; the robot keeps heading for the first pose
    - The new goal preempts the old one; the robot heads for the new pose and `getResult()` refers to it
    - Both goals abort with an error, and the robot stops until you cancel and resend a single goal
  correct: 2
