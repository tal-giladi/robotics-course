- source: 6982399a4a6a
  question: What is the difference between `goThroughPoses` and `followWaypoints`?
  options:
    - "`goThroughPoses` sends each pose as a separate goal and stops at each; `followWaypoints` plans one path through them all."
    - "`goThroughPoses` skips unreachable poses and continues; `followWaypoints` aborts the whole mission on the first failure."
    - They behave identically; `followWaypoints` is simply the older name kept for backward compatibility with ROS 1.
    - "`goThroughPoses` plans one path through all poses without stopping; `followWaypoints` sends separate goals and can skip failures."
  correct: 3
- source: 4f6d4a232006
  question: Your poll loop calls `getFeedback()` and gets `None` on the first call. Bug or normal?
  options:
    - "Bug: the goal was rejected, so check `getResult()` and resend the goal before polling again"
    - "Bug: feedback only works after `waitUntilNav2Active()` is called a second time in the loop"
    - "Normal: no feedback has arrived yet; keep the last non-None value and read again after the loop"
    - "Normal: feedback is always `None` for `goToPose`, and only `followWaypoints` publishes it"
  correct: 2
