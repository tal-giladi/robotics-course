- source: 835e5c8ba6c7
  question: Which split correctly describes what the global planner knows that the local planner doesn't, and vice versa?
  options:
    - "Global: latest sensor data, current velocity, dynamics. Local: whole map, topology, route distance to goal."
    - "Global: whole map and the robot's dynamics. Local: topology, route distance to goal and odometry drift."
    - "Global: whole map, topology, route distance to goal. Local: latest sensor data, current velocity, acceleration limits."
    - "Global: route distance and moving obstacles. Local: whole map, door topology and the robot's current velocity."
  correct: 2
