  question: karmel's controller runs at 20 Hz and cruises at 0.25 m/s. How far does it move per control cycle, and how far if the controller ran at 2 Hz?
  options:
    - 1.25 cm at 20 Hz; 12.5 cm at 2 Hz
    - 12.5 cm at 20 Hz; 1.25 cm at 2 Hz
    - 5 cm at 20 Hz; 50 cm at 2 Hz
    - 1.25 cm at 20 Hz; 125 cm at 2 Hz
