- source: 2eb2e3f9c86b
  question: Why doesn't an unknown cell 0.3 m from a wall get the inflated cost 99?
  options:
    - Unknown cells are always treated as lethal, so inflation is skipped for them to save computation time.
    - Inflation only spreads into cells the LiDAR has cleared, and 0.3 m is below its minimum range.
    - Inflation only overwrites unknown cells with ≥ 253; writing 99 would mark unexplored space as observed and plannable.
    - Unknown cells get 99 only in the global costmap; the local costmap keeps them at 255 by design.
  correct: 2
