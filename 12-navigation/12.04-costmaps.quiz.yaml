  question: What do costmap values 253, 254 and 255 mean, and which does a planner never enter?
  options:
    - 253 lethal, 254 inscribed, 255 unknown; planners never enter 254, and unknown is always entered
    - 253 unknown, 254 lethal, 255 inscribed; planners never enter 255, and unknown depends on `allow_unknown`
    - 253 inscribed, 254 lethal, 255 unknown; planners only avoid 254, since 253 is merely high-cost
    - 253 inscribed, 254 lethal, 255 unknown; planners never enter ≥ 253, and unknown depends on `allow_unknown`
