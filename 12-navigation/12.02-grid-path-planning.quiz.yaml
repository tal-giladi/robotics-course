  question: Why can BFS return a longer path than Dijkstra on an 8-connected grid, but not on a 4-connected grid with unit costs?
  options:
    - BFS minimizes move count; with unit costs that equals length, but diagonals cost √2 so equal move counts can differ in length.
    - BFS explores diagonals first on 8-connected grids, so it always prefers longer diagonal routes over straight ones.
    - BFS minimizes path length; on 8-connected grids it ignores obstacles near diagonals, producing detours.
    - Dijkstra uses a heuristic on 8-connected grids that BFS lacks, so it finds shortcuts BFS cannot see.
  correct: 0
