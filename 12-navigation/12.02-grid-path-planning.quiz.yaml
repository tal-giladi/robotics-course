  question: Which statement correctly defines admissibility and consistency, and gives a heuristic admissible on a 4-connected grid but not on an 8-connected one?
  options:
    - "Admissible: $h(n) \\ge h^*(n)$; consistent: $h(n) \\le c(n,m) + h(m)$; Euclidean distance."
    - "Admissible: $h(n) \\le h^*(n)$; consistent: $h(n) \\ge c(n,m) + h(m)$; octile distance."
    - "Admissible: $h(n) \\le h^*(n)$; consistent: $h(n) \\le c(n,m) + h(m)$; Manhattan distance."
    - "Admissible: $h(n) \\le c(n,m) + h(m)$; consistent: $h(n) \\le h^*(n)$; Manhattan distance."
  correct: 2
