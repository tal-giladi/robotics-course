- source: fc2399babfc2
  question: At 0.25 m/s, which is larger for karmel — the blind distance or the braking distance — and what does that imply?
  options:
    - Braking distance (8.8 vs 3.9 cm); stronger brakes buy more safety than a faster sensor or costmap
    - Blind distance (8.8 vs 3.9 cm); faster sensing or costmap updates buy more safety than stronger brakes
    - They are equal (about 6 cm each), so latency and brakes matter equally for the local costmap size
    - Blind distance (8.8 vs 3.9 cm); so the local costmap can be made smaller than the braking distance
  correct: 1
- source: b211c3d6cb19
  question: Your AMCL pose jitters by σ = 7 cm standing still. Which answer gives correct parameter consequences and the real fix?
  options:
    - "`xy_goal_tolerance` ≈ 0.07 m and a shorter lookahead; really fix it by adding more AMCL particles"
    - "`xy_goal_tolerance` ≈ 0.14 m and a shorter lookahead; really fix it by lowering the controller rate"
    - "`xy_goal_tolerance` ≈ 0.28 m and a longer lookahead; really fix the map, environment or LiDAR placement"
    - No parameter changes needed; really fix it by raising `desired_linear_vel` so jitter averages out
  correct: 2
- source: 1b2a77c18965
  question: Why should the global costmap's `obstacle_max_range` be shorter than the local one's?
  options:
    - The global costmap updates faster than the local one, so long-range marks overload its update loop.
    - The local costmap needs long range to plan whole routes, while the global one only sees nearby obstacles.
    - Global marks in `odom` carry wheel drift; the local costmap is in `map`, so AMCL corrects its marks.
    - Global marks in `map` carry localization error and persist, closing doorways; local `odom` marks are rebuilt quickly.
  correct: 3
