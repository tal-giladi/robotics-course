  question: karmel's inflated inscribed radius is 11.5 cm. What is the narrowest doorway it can plan through, and the narrowest you should actually ask it to?
  options:
    - Plans through anything over 23 cm; in practice about 45 cm is the floor and 60 cm is comfortable
    - Plans through anything over 11.5 cm; in practice about 23 cm is the floor and 30 cm is comfortable
    - Plans through anything over 23 cm; in practice 25 cm is fine, since localization error is tiny indoors
    - Plans through anything over 46 cm; in practice about 90 cm is the floor and 1.2 m is comfortable
