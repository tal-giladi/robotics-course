- source: e2157e3fb438
  question: Why does this lesson insist on a written diff rather than an edited file?
  options:
    - Nav2 only reloads parameters that appear in a diff file, so direct edits are silently ignored.
    - A diff is smaller to store on the Pi's SD card than a full copy of the parameter file.
    - Every change must trace to a measurement and be revertible one at a time when the robot gets worse.
    - Edited YAML files lose their comments, which Nav2 needs to parse nested costmap blocks.
  correct: 2
