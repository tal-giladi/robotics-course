- source: 2939a0c0aae1
  question: Why does RRT explore unexplored space quickly (Voronoi bias)?
  options:
    - RRT deliberately samples only outside the current tree's bounding box until the whole space is covered.
    - Frontier nodes next to large empty regions own large Voronoi cells, so random samples pick them more often.
    - Nodes near the start own the largest Voronoi cells, so the tree grows outward evenly in all directions.
    - Each new node is connected to its farthest neighbour, which pushes the tree toward empty regions.
  correct: 1
- source: d9f3498038d7
  question: Which two changes turn RRT into RRT*?
  options:
    - Pick the nearest node as parent, and bias 50% of samples toward the goal instead of sampling uniformly.
    - Grow two trees from start and goal, and connect them as soon as their nearest nodes can see each other.
    - Pick the lowest-cost parent within radius $r$, and shortcut the final path once the goal has been reached.
    - Pick the lowest-cost parent within radius $r$, and rewire neighbours within $r$ through $q_{\text{new}}$ when cheaper.
  correct: 3
