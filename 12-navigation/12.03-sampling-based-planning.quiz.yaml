  question: What is karmel's configuration space if you model it as its real rectangle, and why is the disk model only 2D?
  options:
    - "$(x, y, \\theta)$: a rotated rectangle covers different floor; a disk looks the same at every heading, so C-space is $(x, y)$."
    - "$(x, y)$: a rectangle's heading never affects collision; a disk needs $(x, y, \\theta)$ because it can spin in place."
    - "$(x, y, \\theta, v)$: a rectangle needs velocity too; a disk has no velocity limits, so C-space is $(x, y)$."
    - "$(x, y, \\theta)$: the rectangle adds heading; a disk is 2D only because the planner ignores the robot's size."
