  question: A corridor leaves 0.05 m² free for the robot's center in a 20 m² sampling area. What is the probability of missing it with 2,000 uniform samples?
  options:
    - About $e^{-5} \approx 0.0067$ (and the real failure rate is higher, since RRT needs several nodes in it)
    - About $e^{-0.5} \approx 0.61$ (and the real failure rate is lower, since RRT only needs one node in it)
    - About $0.0025$, the probability that a single sample lands in the corridor
    - Exactly zero, since 2,000 samples exceed the 400 needed to cover the corridor once
  correct: 0
