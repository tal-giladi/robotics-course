  question: You run plain RRT (not RRT*) with 10× more `max_iterations`. Does the path get shorter?
  options:
    - "Yes: more iterations give a denser tree, so the returned path gets close to optimal"
    - "No: RRT returns at the first solution; more iterations only help find a path in hard cases"
    - "Yes: path length shrinks roughly with the square root of the iteration count"
    - "No: more iterations make paths longer, because the tree wanders farther before reaching the goal"
