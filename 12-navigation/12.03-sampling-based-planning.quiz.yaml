- source: 70c89f2c58bc
  question: Why can't a sampling planner report "no path exists"?
  options:
    - It can, once the number of samples exceeds the number of cells in the equivalent occupancy grid.
    - It only checks the sampled nodes, not the edges, so it cannot tell which regions are connected.
    - It only knows the configurations it sampled; failure means "not found yet", and a tiny passage may still exist.
    - It samples only free space, so it has no record of obstacles from which to build a proof of absence.
  correct: 2
