  question: Your arm planner produces paths where the forearm passes through a thin shelf board, though every waypoint is collision-free. Cause and fix?
  options:
    - Motions between waypoints are checked too coarsely; lower `longest_valid_segment_fraction` below the board thickness.
    - The waypoints are too close together; raise the motion-check step so fewer checks disagree about the board.
    - The shelf is missing from the planning scene; add it as a box and re-run with the same settings.
    - The planner is not RRT*; switch to RRT* so rewiring removes edges that pass through obstacles.
