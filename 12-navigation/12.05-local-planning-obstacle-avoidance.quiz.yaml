- source: 7d8d1c623317
  question: "MPPI with `temperature` → 0: what does the update become, and why is that bad?"
  options:
    - All samples get equal weight, so the update ignores costs and drifts toward the mean noise
    - All weight goes to the single cheapest sample, so commands jump to noisy sequences and become jerky
    - The update freezes at the previous sequence, so the robot stops reacting to new obstacles
    - All weight goes to the most expensive sample, so the robot steers toward obstacles
  correct: 1
- source: e56a8a086c59
  question: Why can MPPI use a cost like "+1000 if the trajectory collides", while a gradient-based MPC can't easily?
  options:
    - MPPI linearizes the cost around the previous solution, which smooths out any step functions
    - MPPI clips every cost to a maximum of 1000, so large steps cannot destabilize its optimizer
    - MPPI solves the problem exactly with dynamic programming, which is unaffected by discontinuities
    - MPPI only evaluates and weights sampled costs, never differentiates them, so steps are fine
  correct: 3
- source: 3dc523a9013e
  question: With RPP, karmel stops 60 cm before a chair on the path and waits until the behavior tree aborts. Is RPP broken?
  options:
    - Yes; RPP should steer around obstacles, so raise its lookahead distance until it passes the chair.
    - No; RPP is waiting for the chair to move. Increase the behavior tree timeout so it waits longer.
    - No; RPP stops on projected collision but doesn't steer around. Put the chair in the global costmap or use MPPI/DWB.
    - Yes; RPP's collision check is broken. Disable it so the robot proceeds and relies on the bumper.
  correct: 2
