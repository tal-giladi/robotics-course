    - $\kappa = 0$ (straight); then $\kappa = 5$ m⁻¹, though a real controller rotates in place at a 90° bearing
    - $\kappa = 0$ (straight); then $\kappa = 0.8$ m⁻¹, an arc of radius 1.25 m
  correct: 2
