- source: 04a177d96219
  question: Which derivation of the pure pursuit curvature $\kappa = 2y_r/L^2$ is correct?
  options:
    - "Arc is a circle centered at $(R, 0)$: $x^2 + y^2 = 2xR$; at the carrot $L^2 = 2x_r R$, so $\\kappa = 2y_r/L^2$."
    - "Arc is a circle centered at $(0, R)$: $x^2 + y^2 = 2yR$; at the carrot $L^2 = 2y_r R$, so $\\kappa = 1/R = 2y_r/L^2$."
    - "Arc is a circle centered at $(0, R)$: $x^2 + y^2 = R^2$; at the carrot $L = y_r R$, so $\\kappa = 2y_r/L^2$."
    - Heading error $\alpha$ satisfies $\sin\alpha = y_r/L$; curvature is $\kappa = \alpha/L$, which equals $2y_r/L^2$.
  correct: 1
- source: 431870b0ee28
