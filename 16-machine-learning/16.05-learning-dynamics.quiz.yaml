- source: 7d6971c916f9
  question: Why is `speed ∝ duty × battery_voltage` the single most valuable term in this model for a battery-powered robot?
  options:
    - Battery voltage sets the encoder resolution, so without it every speed reading is scaled wrong
    - Duty cycle alone is nonlinear, and multiplying by voltage linearizes the motor's deadband
    - The voltage term captures motor temperature, which dominates speed error on long runs
    - A 3S pack swings ~27% (12.6 → 9.9 V), which the H-bridge passes straight to the motor speed
  correct: 3
- source: 9270ca493252
  question: The physics model's RMSE is 0.005 in range and 0.004 at an unseen voltage; the MLP's is 0.048 and 0.288. What single property explains both columns?
  options:
    - "Parameter count: the MLP has too few parameters to fit both regimes, while the physics model has enough"
    - "Training time: the MLP was stopped early, while the physics model was fitted to convergence"
    - "Where the knowledge comes from: physics structure holds everywhere, the MLP has none outside its training hull"
    - "Noise level: the unseen voltage had less sensor noise, which helps the physics model and hurts the MLP"
  correct: 2
