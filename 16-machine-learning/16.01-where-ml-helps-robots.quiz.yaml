- source: 221f882ce0b7
  question: A detector's false-positive rate is 0.2% per frame at 5 Hz. How many false alarms per hour, and what changes if they come from one poster passed daily?
  options:
    - 36 per hour; poster errors are independent, so requiring three consecutive frames removes them
    - 3.6 per hour; poster errors are rare, so they can be ignored in practice
    - 360 per hour; poster errors dominate, so the detector must be replaced entirely
    - 36 per hour; poster errors aren't independent, so temporal confirmation fails and you need plausibility checks or data
  correct: 3
- source: 8bf6373d08a5
  question: You fit an MLP and a 3-parameter physics model to motor logs recorded with a full battery. Whose error grows more when the battery is nearly empty?
  options:
    - "The physics model's: its three parameters were fitted at full voltage and cannot adapt to low voltage"
    - "Neither: both models see the voltage as an input, so they extrapolate equally well"
    - "The MLP's (about 6×): it only interpolates, while speed ∝ duty × voltage still holds outside the range"
    - Both grow equally, since the battery's internal resistance is missing from both models
  correct: 2
- source: 4bea5fdd1515
  question: A detector scores 0.95 on a "bottle" the LiDAR places 3.5 m away; the box is 70 px tall on the 320×240 stream ($f_y$ = 233.9 px). Accept or reject?
  options:
    - "Accept: a 0.95 score is well above any threshold, and geometry is only a tie-breaker"
    - "Reject: the implied height is about 1.05 m, which no bottle has, whatever the score"
    - "Reject: the implied height is about 0.10 m, which is too small for a bottle at that range"
    - "Accept: the implied height is about 0.30 m, which is a plausible wine bottle"
  correct: 1
