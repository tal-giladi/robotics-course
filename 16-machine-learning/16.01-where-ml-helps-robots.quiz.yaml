  question: Where does ML not belong in karmel under any score, and what goes there instead?
  options:
    - The safety path; use a range threshold, a watchdog on the Pico and a hardware e-stop
    - Object detection; use HSV thresholds and contours, which are always more reliable
    - Navigation planning; use A* on the costmap, since learned planners cannot find paths
    - Localization; use wheel odometry alone, since learned models drift over time
