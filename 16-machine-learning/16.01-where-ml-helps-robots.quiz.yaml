  question: karmel spins at 0.6 rad/s while searching. Model A takes 90 ms per frame, model B 1.2 s. Using the current heading to aim, what heading error does each cause?
  options:
    - "A: about 0.05°; B: about 0.7°"
    - "A: about 3.1°; B: about 41°"
    - "A: about 5.4°; B: about 72°"
    - "A: about 3.1°; B: about 4.1°"
