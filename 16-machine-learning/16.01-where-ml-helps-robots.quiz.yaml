- source: be9f6a6a9a4c
  question: Which set of answers to the six questions (model, data, variety, latency, failure, verify) pushes a component towards being engineered?
  options:
    - Physics unknown, data plentiful, inputs open-world, loose deadlines, failure is cheap, no certification needed
    - Physics can be written down, data plentiful, inputs open-world, loose deadlines, failure is cheap, must be certified
    - Physics unknown, data scarce, inputs fixed, hard ms deadlines, failure is cheap, no certification needed
    - Physics can be written down, data scarce, inputs fixed, hard ms deadlines, failure causes harm, must be certified
  correct: 3
- source: 6061e8779cea
  question: Why is detecting bottles and cups the textbook case for a learned component, while AprilTag detection is not?
  options:
    - Bottles can't be written down and labels are cheap; tags are designed patterns a classical decoder handles exactly
    - Bottles are rigid objects with exact geometry; tags vary with lighting, so only learning can decode them
    - Bottle detection has hard millisecond deadlines; tag detection can tolerate a second of latency
    - Bottles are rare in training data; tags appear in every dataset, so a network adds no new information
  correct: 0
