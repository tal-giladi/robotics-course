  question: You lower `--min-change` from 1.0 to 0.2. Which sessions change most, and what frames get added?
  options:
    - Fast-moving sessions; mostly blurred frames that were previously rejected as too different
    - Sessions with parked, slow or dim noisy periods; mostly near-copies where noise exceeds 0.2
    - All sessions equally; a uniform 5× more frames spread across every scene
    - Bright daytime sessions; mostly new views of objects that had been skipped
