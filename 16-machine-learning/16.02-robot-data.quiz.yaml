- source: 62a8b3c6c531
  question: Why is a random frame-level train/validation split misleading for robot camera data?
  options:
    - Consecutive frames are near-duplicates, so validation sees near-twins of training images and overestimates
    - Random splits put more frames in validation than training, which makes training too short
    - Random splits ignore class balance, so validation always has too few bottles to evaluate
    - Consecutive frames differ too much in lighting, so validation underestimates performance
  correct: 0
