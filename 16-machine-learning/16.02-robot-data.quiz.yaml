    - "Model version, score threshold, IoU threshold, image size: to reproduce evaluation numbers"
    - "GPS position, date, weather, time zone: to align sessions from different robots"
    - "Session id, room, lighting/conditions, operator/camera settings: to split, slice, find failures and reproduce"
  correct: 3
