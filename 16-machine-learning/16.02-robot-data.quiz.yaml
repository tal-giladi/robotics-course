  question: Which are valid privacy measures for a dataset recorded at home, with a real limitation of face blurring?
  options:
    - Encrypt the rosbags, rename the files, compress images; blurring removes all identifying information
    - Record only at night, lower resolution, convert to grayscale; blurring is too slow for 10 Hz
