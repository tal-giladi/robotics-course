  correct: 2
- source: ff24917bf748
  question: Why does a 1k/2k divider on the CS pin change the current limit, while a 47k/68k divider barely does?
  options:
    - The divider sits in parallel with the carrier's 2.49 kΩ; 3 kΩ drops it about 45% (trip rises 83%), 115 kΩ only about 2%.
    - The small divider draws current from the motor supply, reducing the voltage available to the motors.
    - The large divider filters the CS signal, while the small one passes all the switching noise.
    - The small divider pulls CS above 3.3 V, which disables current regulation.
  correct: 0
