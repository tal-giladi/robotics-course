  question: In the brake state, what voltage drives the circulating current down, and in the coast state?
  options:
    - "Brake: the full supply opposes it; coast: only the back-EMF, so coast decays slowly."
    - "Brake: only the motor's back-EMF around $R_M + R_{DS}$, so it decays slowly; coast: about 13.8 V ($V_M + 2V_{SD}$) opposes it, so it decays fast."
    - "Both: only the back-EMF, so they decay at the same rate."
    - "Brake: the diode drops (about 1.4 V); coast: the back-EMF alone."
  correct: 1
