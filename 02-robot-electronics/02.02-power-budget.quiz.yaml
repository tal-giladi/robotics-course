# Multiple-choice version of the quiz in 02.02-power-budget.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 7d55f1943814
  question: A regulator delivers 15 W at 90% efficiency. What current does it draw at 12.0 V and at 9.0 V?
  options:
    - 1.25 A and 1.67 A
    - 1.39 A and 1.85 A
    - 1.39 A at both voltages
    - 1.85 A and 1.39 A
  correct: 1
- source: 154698d2d3be
  question: A 6 V motor has 2 Ω winding resistance. Estimate its current at stall and when reversing from full speed on a 6 V supply.
  options:
    - 3 A at stall; 0 A when reversing, as back-EMF cancels the supply.
    - 3 A at stall; 3 A when reversing.
    - 3 A at stall; about 6 A briefly when reversing, as back-EMF adds to the supply.
    - 6 A at stall; 12 A briefly when reversing.
  correct: 2
