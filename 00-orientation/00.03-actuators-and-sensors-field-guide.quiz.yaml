  question: You set 50% PWM duty on karmel's motors at 12.6 V, and again near cutoff at 9.9 V. What happens to the wheel speed?
  options:
    - It stays the same, because the duty cycle fixes the speed.
    - It rises by about 20%, because the motor draws more current at low voltage.
    - It drops to about half, because duty and voltage both halve the power.
    - It drops by roughly 20%, because the average motor voltage falls from about 6.3 V to 5.0 V.
