  question: What is the difference between a DC gear motor and a servo, from your code's point of view?
  options:
    - A DC motor gets a target angle and holds it; a servo gets a PWM duty and turns continuously.
    - A DC motor needs no encoder because it reports its own position; a servo needs an external encoder.
    - A DC motor gets a power level (PWM duty) and your code adds sensing and control; a servo gets a target angle and closes the loop itself.
    - Both get a PWM duty; the servo just has a stronger gearbox and turns more slowly.
