# Multiple-choice version of the quiz in 00.05-ros2-in-one-page.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 0987c84a6e83
  question: What problem does robot middleware solve that a single program with threads doesn't?
  options:
    - It makes each component run faster by moving work from Python into compiled C++ code.
    - It guarantees hard real-time deadlines for every message exchanged between threads.
    - It lets independent programs in different languages and machines discover each other and exchange typed, timestamped data, with tools to inspect and replay.
    - It replaces the microcontroller, so motor control can run directly inside the main program.
  correct: 2
- source: 084e6b785002
  question: 'Match each to topic, service or action: LiDAR scans; "save map"; "go to the kitchen".'
  options:
    - "Scans: service; save map: topic; go to kitchen: action."
    - "Scans: topic; save map: action; go to kitchen: service."
    - "Scans: action; save map: service; go to kitchen: topic."
    - "Scans: topic; save map: service; go to kitchen: action."
  correct: 3
