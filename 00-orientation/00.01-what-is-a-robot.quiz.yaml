- source: aa14af81148a
  question: What is the difference between open-loop and closed-loop control, with a robot example of each?
  options:
    - Open loop measures the result before acting ("drive until the ToF reads 0.30 m"); closed loop just sends commands ("drive 3.6 s").
    - Open loop sends commands without measuring the result ("drive 3.6 s"); closed loop uses the measured result ("drive until the ToF reads 0.30 m").
    - Open loop runs on the microcontroller ("drive 3.6 s"); closed loop runs on the Raspberry Pi ("drive until the ToF reads 0.30 m").
    - Open loop uses a fixed loop rate ("drive 3.6 s"); closed loop changes its rate as needed ("drive until the ToF reads 0.30 m").
  correct: 1
