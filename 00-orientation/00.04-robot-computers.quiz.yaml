- source: 2275de563584
  question: After adding a Jetson, battery runtime dropped from 2.5 h to 1.2 h and the robot sometimes resets when accelerating. What is the likely cause?
  options:
    - The Jetson adds 7–25 W and its current peaks coincide with motor starts, causing voltage dips that reset the computers.
    - The Jetson's inference slows the Nav2 controller, so the motors accelerate too hard to catch up.
    - The Jetson floods the serial link, so the Pico's watchdog resets the robot during acceleration.
    - The Jetson's Wi-Fi interferes with the encoders, which triggers a firmware reset when speed changes.
  correct: 0
