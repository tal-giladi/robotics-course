- source: cc6656e349e8
  question: Which pair gives two valid reasons why karmel uses a Pico in addition to the Raspberry Pi 5?
  options:
    - More RAM for the navigation stack, and Wi-Fi for talking to the laptop.
    - Deterministic microsecond timing for PWM and encoder decoding, and failure isolation via a watchdog that stops the motors.
    - Running ROS 2 natively, and hosting the LLM agent close to the motors.
    - A faster CPU than the Pi 5, and a built-in GPU for camera processing.
  correct: 1
- source: 0cee78147adc
  question: What is the difference between "real-time" and "fast"?
  options:
    - Real-time means responding in under 1 ms; fast means responding in under 10 ms.
    - Real-time means running on a microcontroller; fast means running on a multi-core computer.
    - Real-time means the average response time is low; fast means the peak clock speed is high.
    - Real-time means meeting deadlines predictably (bounded worst case); fast means a low typical response time that can sometimes spike.
  correct: 3
