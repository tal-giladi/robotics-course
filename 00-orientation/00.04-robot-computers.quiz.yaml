- source: 18211df18a6e
  question: The Pi keeps sending valid `V` commands, but the Pico's main loop is stuck in an infinite loop inside a sensor driver. Does the 300 ms command watchdog stop the motors?
  options:
    - "Yes: the watchdog notices that the sensor data stopped updating and stops the motors."
    - "Yes: the Pi detects the stuck loop from the telemetry and sends an `S` stop command."
    - "Not necessarily: the watchdog code runs in the stuck loop and PWM keeps the last duty; you need a hardware watchdog."
    - No, but the PWM hardware times out on its own after 300 ms and cuts the motors.
  correct: 2
