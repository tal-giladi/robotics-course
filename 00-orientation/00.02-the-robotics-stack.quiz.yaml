# Multiple-choice version of the quiz in 00.02-the-robotics-stack.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 1aeaff5acff0
  question: Which list gives the eight stack layers in the right order, top to bottom?
  options:
    - Motor drivers, motors, control, perception/localization/planning, ROS 2 middleware, high-level planning, AI/application, physical robot.
    - AI/application, high-level planning, ROS 2 middleware, perception/localization/planning, control, motor drivers, motors, physical robot.
    - AI/application, ROS 2 middleware, control, high-level planning, perception/localization/planning, motors, motor drivers, physical robot.
    - High-level planning, AI/application, perception/localization/planning, ROS 2 middleware, motor drivers, control, physical robot, motors.
  correct: 1
- source: c39d62df4528
  question: Why do layers get faster as you go down the stack?
  options:
    - Lower layers run on faster processors, so they can afford higher rates.
    - Lower layers carry less data per message, so the middleware can deliver them more often.
    - Each layer controls faster-changing dynamics and must correct disturbances between upper-layer decisions.
    - Higher layers are written in Python and lower layers in C, which sets their maximum rates.
  correct: 2
