- source: 5f37b2121704
  question: The robot drives smoothly in simulation but stutters on the real robot whenever you watch the camera feed in RViz on your laptop. What is the likely cause?
  options:
    - The camera driver steals CPU from the Pico's wheel PID loop.
    - RViz sends extra `cmd_vel` messages that conflict with Nav2's commands.
    - The motors draw more current while the camera is on, causing brownouts.
    - Raw images saturate the Wi-Fi link, so `cmd_vel` and odometry arrive late or in bursts.
  correct: 3
- source: b253645a602f
  question: Where does ROS 2 stop and the microcontroller take over on karmel, and what crosses that boundary?
  options:
    - At the Pico's PWM output; raw PWM duty values cross it over I2C.
    - "At `base_node` on the Pi; protocol v1 lines cross over USB serial: `V`/`S`/`P` down, `T` telemetry up."
    - At the DDS layer on the Pi; ROS 2 messages cross it over Wi-Fi to the Pico.
    - At the Nav2 controller; `cmd_vel` messages cross it over CAN bus to the motor drivers.
  correct: 1
