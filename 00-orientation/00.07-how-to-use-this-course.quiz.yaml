    - It sends you back to the module's first lesson, 10.01, to review from the start.
    - It notes a repeated struggle and says to do the first unfinished foundation (FM.15) before retrying 10.05.
    - It says to do both FM.15 and FM.16 and then marks 10.05 as read automatically.
  correct: 2
