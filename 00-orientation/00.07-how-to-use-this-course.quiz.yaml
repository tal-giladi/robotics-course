- source: bd5aabc9136d
  question: What's the difference between a hard prerequisite and an optional one, and where are they defined?
  options:
    - Hard (`requires`) lessons must be done before `next` unlocks a lesson; optional ones are foundations you may skip; both are in `curriculum/syllabus.yaml`.
    - Hard (`requires`) lessons are graded exams; optional ones are ungraded readings; both are in `progress/progress.json`.
    - Hard (`requires`) lessons are only recommended by `next`; optional ones are enforced; both are in `PROGRESS.md`.
    - Hard (`requires`) lessons unlock the module; optional ones unlock the projects; both are in `course.py` itself.
  correct: 0
- source: 0dd8ff8f4b24
  question: You read lesson 01.09 but didn't do the exercises. Which command do you run, and what effect does it have on later lessons?
  options:
    - "`python course.py done 01.09`; later lessons unlock with no warning."
    - "`python course.py skip 01.09`; later lessons stay locked until you do the exercises."
    - "`python course.py struggle 01.09`; `next` sends you to its optional foundations first."
    - "`python course.py read 01.09`; later lessons unlock, but `next` warns they build on a lesson you only read."
  correct: 3
- source: c35b009608db
  question: How do you try `course.py` commands without changing your real progress?
  options:
    - Run the commands with a `--dry-run` flag, which prints the changes without saving them.
    - Set `COURSE_PROGRESS_FILE` and `COURSE_PROGRESS_MD` to paths in a temporary folder for that terminal session.
    - Make `progress/progress.json` read-only, so `course.py` discards its writes.
    - Run `git stash` before and `git stash pop` after the commands to restore your progress.
  correct: 1
