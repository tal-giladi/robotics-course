- source: 1f8c5d33631e
  question: During a Nav2 test the robot nearly drove over the hallway stairs, although the map shows a wall there. Which assumption failed?
  options:
    - That the planner's costmap inflation radius was large enough for the robot's footprint.
    - That the battery could supply enough current to brake on a slope.
    - That the map and sensors see every hazard; a 2D LiDAR can't see a drop below its scan plane.
    - That the LiDAR rotates fast enough to see a wall at walking speed.
  correct: 2
- source: b4ad1acb18b0
  question: An LLM agent can call `publish_velocity(v, w)` with any values. Which set of changes makes it safe enough to test?
  options:
    - Allowlisted skills that validate parameters, limits and geofences enforced below the LLM, and human confirmation with independent hardware stops.
    - A stricter system prompt telling the LLM to use low speeds and avoid obstacles.
    - Running the LLM on the Pi instead of the cloud so its commands arrive with lower latency.
    - Letting the LLM call `publish_velocity` only once per second so it cannot react too fast.
  correct: 0
