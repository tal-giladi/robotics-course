  question: Which order of the safe testing procedure is correct?
  options:
    - Simulation → floor in an open area → review the change → robot on a stand → raise limits.
    - Robot on a stand → review the change → simulation → raise limits → floor in an open area.
    - Review the change → simulation → robot on a stand at low speed → floor, slow, hand on the stop → raise limits one at a time.
    - Review the change → floor, slow, hand on the stop → simulation → robot on a stand → raise limits.
