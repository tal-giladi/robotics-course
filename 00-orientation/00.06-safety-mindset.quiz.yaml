# Multiple-choice version of the quiz in 00.06-safety-mindset.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 5e75a2c4cc50
  question: What does "fail-safe" mean for a robot, and which is an example on karmel?
  options:
    - The robot never fails because every component is duplicated; e.g. two Picos run in parallel.
    - Any failure or lost communication leads to a safe state (usually motors stopped); e.g. the Pico stops the motors after 300 ms without a valid command.
    - Failures are logged safely for later analysis; e.g. rosbag2 records every command.
    - The robot finishes its current task before stopping after a failure; e.g. Nav2 completes the goal.
  correct: 1
- source: f90d06b1c6e7
  question: Why is karmel's battery a bigger hazard than its motion?
  options:
    - The moving robot has about 136,000 J of kinetic energy, while the battery stores only about 0.2 J.
    - The moving robot has about 0.2 J and the battery about 1,360 J, roughly 7,000 times more.
    - The battery's 12.6 V can cause electric shock, while motion energy is negligible.
    - The moving robot has about 0.2 J of kinetic energy, while the battery stores about 136,000 J that a short or runaway can release as heat and fire.
  correct: 3
- source: 2003077a57fc
  question: You pause the program that sends `cmd_vel` at a debugger breakpoint while the robot moves. What does the robot do?
  options:
    - It stops at once, because the debugger pauses all ROS 2 traffic.
    - It slowly decelerates, because the Pico ramps the speed down between commands.
    - It keeps driving until the battery runs out, because the command is still valid.
    - "It keeps the last command until a timeout below stops it: `base_node`'s 0.5 s timeout or the Pico's 300 ms watchdog."
  correct: 3
- source: 105b1f1f5362
  question: Where should the fuse go, and roughly what rating does karmel need?
  options:
    - Inline on the battery positive, close to the battery and before the switch; about 10 A.
    - On the ground wire at the motor driver; about 10 A.
    - Inline on the battery positive, after the switch; about 30 A.
    - Between the Pi and the Pico on the 5 V line; about 2 A.
