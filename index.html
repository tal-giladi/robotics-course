<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practical Robotics — from software engineer to autonomous AI robot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A hands-on robotics course: build, program and extend a real robot — ROS 2, simulation, control, SLAM, navigation, vision, a robotic arm, embodied AI and LLM agents.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <style>
    :root { --theme-color: #c2410c; }
    .sidebar { padding-top: 20px; }
    .sidebar > h1 { margin: 0 20px 10px; font-size: 1.1em; }
    .markdown-section { max-width: 920px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section details { margin: .4em 0 .8em; }
    .markdown-section summary { cursor: pointer; font-weight: 600; }
    .mermaid svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Practical Robotics',
      repo: 'https://github.com/tal-giladi/robotics-course',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      relativePath: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      // Full-text over every lesson is ~12 MB, which blows the localStorage quota and
      // makes the index rebuild on every page load. Index the reference pages instead:
      // the glossary and concept index name the lesson that owns each term.
      search: { placeholder: 'Search glossary and guides...', noData: 'No results — try the glossary.',
                depth: 3,
                paths: ['/README.md', '/COURSE_MAP.md', '/SAFETY.md', '/HARDWARE.md',
                        '/references/glossary.md', '/references/troubleshooting/README.md',
                        '/curriculum/concept-index.md', '/curriculum/dependency-graph.md'] },
      copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' },
      'flexible-alerts': {
        style: 'flat',
        note: { label: 'Note' }, tip: { label: 'Tip' }, important: { label: 'Important' },
        warning: { label: 'Warning' }, caution: { label: 'Caution' }
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              window.mermaid.run({ querySelector: '.markdown-section .mermaid' });
            }
            // KaTeX: rendered here rather than through a markdown plugin so that it does not
            // depend on docsify's bundled marked version. Code blocks are skipped, so `$PATH`
            // in a shell snippet is left alone.
            if (window.renderMathInElement) {
              document.querySelectorAll('.markdown-section').forEach(function (el) {
                window.renderMathInElement(el, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '\\[', right: '\\]', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false }
                  ],
                  ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                  throwOnError: false
                });
              });
            }
          });
        },
        // relativePath:true is what makes the lessons' own ../ links work, but it also resolves
        // the single root _sidebar.md against the *current* folder, so every sidebar link
        // becomes /<current-folder>/<sidebar-path> — a 404 as soon as you open a lesson.
        // The prefix docsify added is exactly the current folder, so strip it back off.
        // Synchronous, because the search plugin reads these hrefs on the first render.
        function (hook, vm) {
          hook.doneEach(function () {
            var path = (vm.router.getCurrentPath() || '/').split(/[?#]/)[0];
            var dir = path.slice(0, path.lastIndexOf('/'));
            if (!dir) { return; }                       // a page at the root: already correct
            var prefix = '#' + dir + '/';
            document.querySelectorAll('.sidebar-nav a').forEach(function (a) {
              var href = a.getAttribute('href') || '';
              if (href.indexOf(prefix) !== 0) { return; }
              var to = '/' + href.slice(prefix.length);
              if (to === '/README') { to = '/'; }
              a.setAttribute('href', '#' + to);
              var on = to === path;
              a.classList.toggle('active', on);
              if (a.parentNode && a.parentNode.tagName === 'LI') {
                a.parentNode.classList.toggle('active', on);
              }
            });
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });</script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cmake.min.js"></script>
</body>
</html>
