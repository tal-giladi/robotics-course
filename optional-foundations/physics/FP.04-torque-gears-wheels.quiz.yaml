  question: A datasheet says 6.5 kg·cm rated torque at 0.3 A, and 8.3 kg·cm stall at 4 A. Why don't you trust the rated line?
  options:
    - Rated torque is always measured at stall, so it must exceed the stall value
    - kg·cm is not a torque unit, so the rated line is meaningless
    - Torque ∝ current, so 78 % of stall needs ≈ 3.1 A, not 0.3 A; the lines contradict
    - Rated values are for AC motors and do not apply to DC gear motors
