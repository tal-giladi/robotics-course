  question: The loop reads encoder ticks at 200 Hz instead of 50 Hz with no averaging. Smoother or noisier speed estimate, and how does the step size change?
  options:
    - Smoother; one-tick steps shrink 4× (22.9 → 5.74 mm/s)
    - Noisier; one-tick steps grow 4× (5.74 → 22.9 mm/s)
    - Noisier; one-tick steps grow 2× (5.74 → 11.5 mm/s)
    - No change; the step size depends only on the encoder
  correct: 1
- source: fab5f95368d0
  question: A 0.2 m move with v_max = 0.5 m/s and a_max = 1.0 m/s² never reaches 0.5 m/s. What is its peak speed and why?
  options:
    - 0.4 m/s; the controller caps peak speed at 80 % of v_max for safety margin
    - 0.2 m/s; peak speed equals distance divided by one second of motion
    - 0.5 m/s briefly; it is reached for an instant at the midpoint of the move
    - 0.447 m/s; reaching 0.5 m/s and back needs 0.25 m, so the profile is a triangle
  correct: 3
