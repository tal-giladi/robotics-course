- source: c3f360034dbd
  question: Why is $v = \omega r$ true with no conversion factor only when ω is in rad/s?
  options:
    - rad/s is the SI unit for speed, so it always cancels against meters
    - Radians are larger than degrees, so the factor is too small to matter
    - A radian is defined so arc length = θ(rad) × r; other units need a factor
    - Only rad/s includes the wheel's circumference automatically
  correct: 2
