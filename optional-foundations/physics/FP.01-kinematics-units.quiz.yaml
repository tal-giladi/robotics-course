- source: 1bac1d9caa5a
  question: Why does integrating an accelerometer twice drift away within seconds, while differentiating encoder position doesn't drift?
  options:
    - Accelerometers are noisier than encoders, and noise always drifts
    - Integration accumulates a bias as ½bt²; differentiation amplifies noise but has no memory
    - Differentiation removes the bias, while integration doubles it each step
    - Encoders are absolute sensors, while accelerometers are relative
  correct: 1
