- source: 78b8de7f2dff
  question: Why does karmel's maximum acceleration not depend on its mass?
  options:
    - Heavier robots have larger motors, which exactly compensate for the mass
    - Acceleration is limited by the controller setting, not by physics
    - Traction ∝ weight and needed force ∝ mass, so mass cancels; geometry and μ remain
    - Mass only affects top speed, not the acceleration the wheels can deliver
  correct: 2
- source: 92921d0935a1
  question: Karmel's motors can deliver about 33 N at the rims, but it only pushes a scale to about 758 g on tile. What limits it, and where does the extra torque go?
  options:
    - Motor current limit (≈ 7.4 N); the extra torque is never produced
    - Scale stiffness (≈ 7.4 N); the extra torque compresses the scale
    - Gearbox efficiency (≈ 23 %); the extra torque heats the gears
    - Traction (≈ 7.4 N); the extra torque spins the wheels as slip and heat
  correct: 3
- source: 8dff28fc4f77
  question: You mop the floor (μ 0.6 → 0.2) and keep the 1.0 m/s² acceleration limit. What happens?
  options:
    - $a_{max}$ stays the same, since friction does not affect acceleration limits
    - $a_{max}$ drops to ≈ 0.33 m/s², so every start slips even on a clean floor
    - $a_{max}$ rises, since a wet floor reduces rolling resistance
    - "$a_{max}$ drops to ≈ 1.09 m/s²: starts barely work, and dusty patches slip and ruin odometry"
  correct: 3
