  question: What is the difference between static and kinetic friction, and which one does a rolling wheel use?
  options:
    - Static prevents sliding (up to $\mu_s N$), kinetic acts while sliding; rolling uses kinetic
    - Static prevents sliding (up to $\mu_s N$), kinetic acts while sliding; rolling uses static
    - Static acts on parked robots only, kinetic on any moving robot; rolling uses kinetic
    - Static is always larger than $\mu_s N$, kinetic smaller; rolling uses both equally
  correct: 1
