    - Energy is a rate (battery ≈ 37.8 W); power is an amount (Pi ≈ 4–5 Wh)
    - Both are amounts; the battery stores 37.8 Wh and the Pi stores 4–5 Wh
    - Energy is voltage times current; power is energy times time
