- source: 961f452ad886
  question: Why does energy per metre decrease as karmel drives faster, within its speed range?
  options:
    - Motors are more efficient at high speed, so drive power falls as speed rises
    - Rolling resistance falls with speed, so less force is needed per metre
    - The battery delivers more energy at high current, so each metre costs less
    - Fixed electronics power is spread over more metres; drive power grows only modestly
  correct: 3
- source: 798861c5d420
  question: Runtime is 2 h instead of the budgeted 6 h, and logs show 15 W average with the robot mostly parked. Two likely causes?
  options:
    - The battery is too small, and the wheels have too much rolling resistance
    - The Pi is busy or has extra loads, and motors/servos draw power while parked
    - The robot drives too slowly, and the fuse is rated too low
    - The charger is faulty, and the encoders draw too much current
  correct: 1
- source: e5da7d697128
  question: Why does a stalled drive matter more for the fuse and wiring than for runtime?
  options:
    - A stall draws little current but lasts long, so it slowly heats the fuse and wiring
    - A stall reverses current into the battery, which trips the fuse but restores energy
    - A brief stall draws a huge peak (≈ 7.2 A) but little energy; peaks set fuse and wire sizing
    - A stall draws no power at all, so it only matters for the mechanical parts
  correct: 2
