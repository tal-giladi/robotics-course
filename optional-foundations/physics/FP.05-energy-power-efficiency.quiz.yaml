  question: You replace the Pi 5 with a Pico-only design, saving 4 W. Roughly how does stage-1 runtime change?
  options:
    - From about 6.1 h to about 8 h
    - From about 6.1 h to about 12 h
    - From about 6.1 h to about 40 h
