  question: Why does a 3×3 conv layer from 3 to 64 channels have the same parameter count for a 32×32 and a 1920×1080 image?
  options:
    - The image is resized to a fixed size before the convolution
    - "Weight sharing: the same 64 kernels slide over every position"
    - Padding makes both images the same size inside the layer
    - Only the first 32×32 patch is used; the rest is pooled away
  correct: 1
