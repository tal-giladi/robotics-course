  question: What does a single neuron compute?
  options:
    - The maximum of its inputs, scaled by a learned weight
    - A weighted sum of inputs plus a bias, passed through an activation
    - The product of its inputs, passed through a softmax
    - The distance from its inputs to a learned centre
