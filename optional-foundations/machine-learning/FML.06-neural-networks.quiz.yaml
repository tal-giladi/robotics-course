- source: e762b1d2bdfc
  question: After training, 5 of your 8 hidden neurons output 0 for every training sample. What is this called, and what does it do?
  options:
    - Vanishing gradients; the neurons recover once training continues
    - Sparse activation; it improves generalization at no cost
    - Overfitting; the neurons memorized the training labels
    - Dead ReLUs; they get zero gradient, so the network is effectively width 3
  correct: 3
