  question: Why does a deep network with no activation functions have the same expressive power as a linear model?
  options:
    - A composition of affine maps is affine, so any depth collapses to one layer
    - Without activations the gradients vanish, so only the last layer learns
    - Without activations the weights are tied, so all layers are identical
    - Deep linear networks can only represent functions through the origin
  correct: 0
