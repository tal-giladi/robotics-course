  question: Why can a model that is linear in its parameters still represent $\text{speed} \propto d \cdot V$?
  options:
    - Because the optimizer adds interaction terms automatically during training
    - Because "linear" refers to how the parameters enter; you can give $d \cdot V$ as a feature
    - Because $d \cdot V$ is approximately linear over the robot's operating range
    - Because the bias term absorbs the product of the two inputs
