  question: Why do the mean range and nearest range work so badly as features for corridor vs room?
  options:
    - They are too noisy, since single LiDAR beams have large errors
    - They are highly correlated, so the model can't separate their effects
    - They need normalization first, which the lesson's classifier skipped
    - "Their distributions overlap; they miss what a corridor is: narrow one way, long the other"
  correct: 3
