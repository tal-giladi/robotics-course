  question: You use a 1N5819 Schottky in series with karmel's 10 A fused battery line for reverse-polarity protection; the robot draws 5 A peaks. What goes wrong?
  options:
    - It conducts backward at 5 A, so it gives no protection at all
    - It drops only 0.1 V at 5 A, which is fine; nothing goes wrong
    - "It is a 1 A diode: at 5 A it dissipates ~3 W, overheats and fails"
    - It blows the 10 A fuse, because Schottky diodes short at high current
