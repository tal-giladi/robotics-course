  question: What does a 100 nF capacitor next to a chip's supply pin do?
  options:
    - Stores energy to keep the chip running for several seconds after power loss
    - Blocks DC from the regulator so only clean AC reaches the chip
    - Supplies fast current bursts locally so the chip's supply doesn't dip (decoupling)
    - Raises the supply voltage slightly to compensate for wire resistance
  correct: 2
