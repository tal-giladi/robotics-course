- source: 732117c824e8
  question: Why does switching off a relay coil create a high voltage spike?
  options:
    - Capacitance in the coil releases its stored charge all at once when switched off
    - Inductance resists current change ($V = L\,dI/dt$); a sudden stop makes a huge $dI/dt$
    - The coil's resistance rises sharply when current stops, raising the voltage
    - The switch contacts generate the spike as they arc apart, not the coil
  correct: 1
- source: 8429dc99f1fc
  question: Where does a flyback diode go across a coil switched by a low-side MOSFET, and why doesn't it conduct normally?
  options:
    - Across the coil, anode to +12 V; normally forward-biased, it limits the coil current
    - Across the MOSFET, cathode to drain; normally reverse-biased, it conducts when the gate turns on
    - In series with the coil, cathode to drain; it blocks reverse current from the battery
    - Across the coil, cathode to +12 V; normally reverse-biased, it conducts when the drain swings above +12 V
  correct: 3
