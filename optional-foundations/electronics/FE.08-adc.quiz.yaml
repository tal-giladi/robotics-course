  question: Why doesn't averaging fix a 30 mV offset?
  options:
    - Averaging reduces random noise by √N; an offset is in every sample, so it stays
    - Averaging only works on AC signals, and an offset is a DC quantity
    - Averaging doubles the offset because the errors add up in the sum
    - Averaging needs at least 1,000 samples before any offset starts to shrink
  correct: 0
