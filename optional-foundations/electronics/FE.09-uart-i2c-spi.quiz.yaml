# Multiple-choice version of the quiz in FE.09-uart-i2c-spi.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: a01b9108f9d0
  question: Why does UART need both sides to agree on the baud rate, while I²C and SPI don't?
  options:
    - UART sends a clock line that must match; I²C/SPI time bits from a start bit
    - UART has no clock wire, so the receiver times bits itself; I²C/SPI send a clock line
    - UART is full duplex, so both directions must share one rate; I²C/SPI are half duplex
    - UART uses parity bits that depend on the rate; I²C/SPI use checksums instead
  correct: 1
- source: 18da2e2819e0
  question: At 57,600 baud, 8N1, how many bytes per second, and does 50 Hz × 46-byte telemetry fit?
  options:
    - 7,200 bytes/s; it fits at about 32 % load
    - 5,760 bytes/s; it doesn't fit (needs 23,000 bytes/s)
    - 57,600 bytes/s; it fits at about 4 % load
    - 5,760 bytes/s; it fits at about 40 % load
  correct: 3
