- source: e74e35802ad6
  question: Why can many I²C devices share SDA safely, while two SPI devices must not drive MISO at once?
  options:
    - I²C is open-drain (only pulls low); SPI is push-pull, so two drivers can short
    - I²C runs slower, so collisions are harmless; SPI is too fast to recover
    - I²C devices each have a series resistor; SPI devices have none
    - I²C uses differential signals; SPI uses single-ended lines
  correct: 0
