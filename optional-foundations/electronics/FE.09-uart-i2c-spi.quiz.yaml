- source: 117726e1a686
  question: An I²C scan finds 0x40 on the bench, but on the robot the bus sometimes returns EIO when the motors start. Two likely causes?
  options:
    - A wrong device address, and a baud-rate mismatch on the bus
    - The INA219 overheating, and the Pico running out of memory
    - Motor noise coupling into long wires, and weak pull-ups or ground bounce
    - A missing chip-select line, and MISO being driven by two devices
  correct: 2
- source: 51fe6ab8eff9
  question: You need to add a 1 kHz IMU and a GPS module to karmel. Which buses, and why?
  options:
    - IMU on UART (streams at a fixed baud), GPS on SPI (high steady rate)
    - IMU on SPI (high steady rate), GPS on UART (streams text at a fixed baud)
    - Both on I²C, since the existing bus has room for any number of devices
    - IMU on I²C at 100 kHz (plenty for 1 kHz), GPS on SPI (needs a clock)
  correct: 1
