  question: Your 4-leg pushbutton "is always pressed". Most likely placement error?
  options:
    - It's rotated so the switched pair shares one strip; rotate 90° and straddle the channel
    - It's placed across the channel; move it so all four legs are in one strip
    - It's missing a pull-down resistor; add 10 kΩ from the output to GND
    - It's inserted upside down; flip it so the flat side faces the rail
  correct: 0
- source: 69c9e9eefcdd
  question: Why is it a bad idea to run the motor supply through a breadboard?
  options:
    - Breadboard strips add capacitance that filters the PWM and slows the motors
    - Motor noise travels back through the rails and resets the breadboard itself
    - Amp-level motor currents heat and can melt the contacts, and a slip can short battery to logic
    - Breadboards only conduct up to 5 V, so a 12 V supply is blocked by the strips
  correct: 2
