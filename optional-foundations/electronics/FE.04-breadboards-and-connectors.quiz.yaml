  question: Why does a Pico 2 or a DIP chip go across the center channel?
  options:
    - So the chip can draw power from both power rails at the same time
    - So air can flow under the chip and keep it cool while running
    - So the chip's pins align with the 0.1-inch rail spacing on the edges
    - So each pin lands in its own strip instead of being shorted to the opposite pin
  correct: 3
