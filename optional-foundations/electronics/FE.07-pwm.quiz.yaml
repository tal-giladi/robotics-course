  question: Why is switching (PWM) more efficient than producing an intermediate voltage linearly?
  options:
    - The switch runs at high frequency, which transfers energy more efficiently
    - The switch is fully on or fully off, so $V \cdot I$ in it is small in both states
    - The switch stores excess energy in the motor and returns it to the battery
    - The switch only draws power during transitions, never while on or off
