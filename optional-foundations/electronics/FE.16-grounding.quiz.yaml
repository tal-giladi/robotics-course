# Multiple-choice version of the quiz in FE.16-grounding.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 1807e607aa23
  question: What is "ground" in a battery-powered robot?
  options:
    - The Earth connection made through the robot's chassis and wheels
    - The negative terminal of the 5 V regulator only, not the battery
    - Any wire colored black, regardless of where it connects
    - The agreed 0 V reference, normally the battery negative; unrelated to Earth
  correct: 3
- source: 6eb982997321
  question: Why must the Pico and a motor driver share a ground if the driver has its own supply?
  options:
    - The shared ground carries the motor current back to the Pico's supply
    - The Pico needs the driver's ground to power its own 3.3 V regulator
    - The driver reads inputs relative to its own ground; unlinked, 3.3 V is meaningless
    - The shared ground filters PWM noise, but signals would work without it
  correct: 2
- source: 9332a5e40677
  question: 6 A of motor current flows through a 0.05 Ω shared ground. What shift does a sensor on that ground see, and how does the 100 k / 22 k battery reading change?
  options:
    - 0.3 V; the battery reading is off by about 0.054 V
    - 0.3 V; the battery reading is off by about 1.66 V
    - 3.0 V; the battery reading is off by about 16.6 V
    - 0.12 V; the battery reading is off by about 0.66 V
  correct: 1
- source: a6a1eac139f4
  question: You open a switch in the battery's negative wire while the Pi is still on laptop USB and the Pico on the Pi. What can happen?
  options:
    - Circuits find a return via USB ground and pin diodes; boards half-power and parts can be damaged
    - Everything powers off cleanly, because no current can flow without the negative wire
    - Only the motors stop; the logic keeps running normally from the laptop's USB
    - The battery discharges through the laptop, which charges the pack in reverse
  correct: 0
- source: 1fbfc234ccbc
  question: What is a star ground, and what problem does it solve?
  options:
    - All grounds are tied to the metal chassis, so noise is shielded from the logic
    - All returns meet at one point near the battery, so motor current doesn't shift logic 0 V
    - Each board gets its own isolated ground, so they never share any current
    - Ground wires form a closed loop, so current can take the shortest path back
  correct: 1
- source: 74912488042a
  question: Encoder counts jump a few ticks every time the robot reverses, even with the wheel held still. A grounding cause and the confirming measurement?
  options:
    - A floating encoder input picks up noise; measure the encoder supply voltage at rest with the motors off
    - The encoder's pull-up is too weak; measure the resistance from the signal line to 3.3 V with power off
    - The motor's magnetic field disturbs the encoder; measure the field strength near the encoder magnet
    - Motor spikes on a shared ground cross the input threshold; measure mV encoder GND to battery − during reversal
  correct: 3
