- source: 4894ff0eb85a
  question: A cheap meter reads a divider's output 3% lower than a better meter. Both are accurate. What's going on?
  options:
    - The cheap meter has a larger burden voltage from its current shunt
    - The cheap meter samples faster and catches the divider's ripple
    - The cheap meter's lower input resistance loads the divider like a parallel resistor
    - The better meter adds a small offset to compensate for probe leads
  correct: 2
- source: 6cd7abbe8bcf
  question: The HC-SR04's echo is 5 V. Why is 1 k / 2 k preferred over 100 k / 200 k, though both give 3.33 V?
  options:
    - The 100 k / 200 k pair draws too much current from the sensor's echo pin
    - The Pico's input needs at least 1.67 mA to register a logic high
    - The 1 k / 2 k pair gives a higher voltage because of lower resistor tolerance
    - With 67 kΩ source resistance, pin capacitance slows edges and blurs the pulse timing
  correct: 3
