- source: 01f721bb250a
  question: Why not use 1 MΩ / 220 kΩ for the battery divider to save current?
  options:
    - The ratio changes to 4.5:1, so the ADC would saturate at full battery voltage
    - 1 MΩ resistors are not rated for battery voltages above 5 V
    - It would draw more current, not less, because of the higher total resistance
    - ≈180 kΩ source resistance vs ADC input ≥100 kΩ drops readings; 103 µA is already negligible
  correct: 3
