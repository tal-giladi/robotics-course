# Multiple-choice version of the quiz in FE.12-h-bridges-motor-drivers.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 9bb6d62205fe
  question: Why can't a Pico GPIO pin drive karmel's motor directly? Give two numbers.
  options:
    - The pin gives 5 V and ~40 mA; the motor needs 12 V and up to 400 mA
    - The pin gives 3.3 V and ~400 mA; the motor needs 12 V and up to 40 A
    - The pin gives 3.3 V and ~4 mA; the motor needs 9–12.6 V and up to 4 A
    - The pin gives 1.8 V and ~4 mA; the motor needs 3.3 V and up to 4 mA
  correct: 2
- source: 588f43dd49a2
  question: A MOSFET bridge has $R_{DS(on)}$ = 0.3 Ω (HS + LS). How much heat at 2 A, and what voltage does the motor lose?
  options:
    - 0.6 W and 1.2 V
    - 2.4 W and 0.6 V
    - 1.2 W and 0.15 V
    - 1.2 W and 0.6 V
  correct: 3
- source: 23e1306f58e2
  question: Which H-bridge switch combination is forbidden, and what happens if it occurs?
  options:
    - "Both low-side switches at once: it brakes the motor and destroys it"
    - "Both switches on one side at once (shoot-through): it shorts the battery and destroys them"
    - "Diagonal switches at once: the motor spins at full speed and burns out"
    - "All switches off at once: the motor coasts and the driver overheats"
  correct: 1
