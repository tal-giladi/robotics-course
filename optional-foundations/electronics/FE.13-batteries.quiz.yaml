- source: 4833b77c14c5
  question: A 3S pack measures 11.1 V; the cell groups are 4.05, 4.02 and 3.03 V. What's happening, and what do you do?
  options:
    - Normal imbalance; charge it with a balance charger and keep using it
    - The pack is simply discharged; charge it fully and re-measure
