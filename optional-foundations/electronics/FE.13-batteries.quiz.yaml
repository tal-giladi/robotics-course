- source: 8fcf0f7e95ba
  question: A pack is labeled 4S2P, with cells of 3.6 V and 3.0 Ah. What are its nominal voltage, full voltage, capacity and energy?
  options:
    - 7.2 V, 8.4 V, 12.0 Ah, 86.4 Wh
    - 14.4 V, 16.8 V, 3.0 Ah, 43.2 Wh
    - 14.4 V, 16.8 V, 12.0 Ah, 172.8 Wh
    - 14.4 V, 16.8 V, 6.0 Ah, 86.4 Wh
  correct: 3
