- source: 5521ccb21d7e
  question: Why does a short circuit on a 12.6 V Li-ion pack cause a fire risk, while touching both terminals with dry fingers is harmless?
  options:
    - Skin is milliohms but blocks DC; a wire conducts DC, so only the wire carries current
    - The pack limits current to milliamps for skin, but not for metal conductors
    - 12.6 V is too low to push current anywhere; the fire comes from a chemical reaction
    - Skin is thousands of ohms (mA); a wire is milliohms (~100 A), dissipating $I^2R$ heat
  correct: 3
- source: c13852560101
  question: You replace a 1 kΩ LED resistor with a 100 kΩ one. What happens to current and brightness?
  options:
    - Current rises ~100× (1.3 mA → 130 mA); the LED burns out
    - Current stays at 1.3 mA; only the resistor gets hotter
    - Current drops ~10× (1.3 mA → 0.13 mA); the LED is half as bright
    - Current drops ~100× (1.3 mA → 0.013 mA); the LED is essentially off
  correct: 3
- source: bf7c7f5acedb
  question: A sensor works on your desk powered from the Pico, but reads nothing on the robot. VCC goes to 3.3 V and signal to a GPIO. What wire is most likely missing?
  options:
    - "GND: without a return path there is no current and no shared reference"
    - "A pull-up resistor: without it the signal line always floats high"
    - "A second VCC wire: one wire cannot carry enough current for the sensor"
    - "A shield wire: robot motors induce noise that swamps the signal"
  correct: 0
