  question: "Which needs thicker wires: 60 W at 12 V, or 60 W at 5 V?"
  options:
    - 12 V, because the higher voltage needs thicker insulation
    - 5 V, because it draws 12 A vs 5 A and heating grows with $I^2R$
    - Both the same, because the power is the same
