- source: 20651a1662f7
  question: Why do occupancy grids store log-odds instead of probabilities?
  options:
    - Log-odds need less memory, since each cell becomes a single byte
    - Log-odds let each cell store the full distance to the nearest obstacle
    - Updates become addition, no normalization, stable near 0 and 1, easy clamping
    - Probabilities cannot represent unknown cells, but log-odds use NaN for them
  correct: 2
- source: cbcd48ce5b4a
  question: A door belief jumps to 0.9999 within one second of looking at a door, though the classifier is only 80% accurate. The camera runs at 30 fps. What's wrong?
  options:
    - The classifier's accuracy is actually 99.99%, so the belief is correct
    - 30 near-identical frames are treated as independent evidence, though their errors are correlated
    - The prior was set to 0.9999 at startup and the frames never changed it
    - The camera frame rate is too low; at 60 fps the belief would settle at 0.8
  correct: 1
- source: 6c202b1c8f0c
  question: In the 5-cell hallway example, why is the posterior $[0.12, 0.32, 0.12, 0.32, 0.12]$ and not just "cell 1"?
  options:
    - The prior was uniform, so the posterior must stay close to uniform
    - The robot has not moved yet, so Bayes cannot change the prior at all
    - Cell 1 is at the edge, so its probability is shared with its neighbors
    - Two cells have doors and the sensor also sees doors elsewhere 30% of the time
  correct: 3
