# Multiple-choice version of the quiz in FM.16-bayes-rule.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: e65394c954f3
  question: Name the four terms of Bayes' rule. Which comes from sensor calibration?
  options:
    - Prior, likelihood, evidence, posterior; the prior $P(x)$ comes from calibration
    - Prior, likelihood, evidence, posterior; the posterior $P(x \mid z)$ comes from calibration
    - Prior, likelihood, evidence, posterior; the likelihood $P(z \mid x)$ comes from calibration
    - Prior, likelihood, evidence, posterior; the evidence $P(z)$ comes from calibration
  correct: 2
- source: df3f1c4e319d
  question: Prior $P(\text{kitchen}) = 0.2$; $P(\text{hum} \mid \text{kitchen}) = 0.9$, $P(\text{hum} \mid \text{elsewhere}) = 0.1$. What is $P(\text{kitchen} \mid \text{hum})$?
  options:
    - "0.900"
    - "0.180"
    - "0.818"
    - "0.692"
  correct: 3
