  question: What does `math.atan2(0, -5)` return, and what does `math.atan2(-0.0, -5)` return?
  options:
    - $\pi$ and $\pi$ (signed zero is ignored)
    - $\pi$ and $-\pi$ (both mean straight back)
    - 0 and 0 (the y component is zero)
    - $-\pi/2$ and $\pi/2$ (pointing sideways)
  correct: 1
