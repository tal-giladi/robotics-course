  question: Your go-to-goal controller spins in circles when the goal is directly to the left, at $(0, 1)$. The code is `bearing = math.atan2(dx, dy)`. What is wrong?
  options:
    - atan2 returns degrees; the code must convert the bearing to radians first
    - The arguments are swapped; `atan2(0, 1)` returns 0 instead of 90°, so use `atan2(dy, dx)`
    - atan2 fails when dx is exactly 0; add a small epsilon to dx
    - The bearing must be wrapped to $[0, 2\pi)$ before it is used
