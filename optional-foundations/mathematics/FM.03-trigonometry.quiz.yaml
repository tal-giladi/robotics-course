- source: ece370769be9
  question: Why does `atan(y/x)` return the same angle for $(3, 4)$ and $(-3, -4)$?
  options:
    - atan uses degrees internally and rounds both results to the same whole degree
    - atan normalizes its input to the unit circle, which maps opposite points together
    - atan returns angles in $[0°, 360°)$, and both points are equally far from the origin
    - The division throws away the signs; both give $y/x = 4/3$, so atan returns only $(-90°, 90°)$
  correct: 3
