  question: Your EKF's position ellipse is tiny while the robot is clearly lost after a sharp slipping turn; the Monte Carlo cloud is banana-shaped. Underlying issue?
  options:
    - The Monte Carlo cloud is wrong, since a correct distribution must be an ellipse
    - The EKF's measurement noise is too large, so it ignores the sensor data
