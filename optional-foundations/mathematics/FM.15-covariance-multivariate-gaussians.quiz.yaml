- source: 05577dcfcaa9
  question: Why must a covariance matrix be symmetric and positive semi-definite?
  options:
    - It must be invertible for the Kalman filter, and only PSD matrices are invertible
    - cov(X, Y) = cov(Y, X), and $\mathbf{v}^\top\Sigma\mathbf{v}$ is a variance, which can't be negative
    - Its diagonal holds standard deviations, which are symmetric about zero
    - Correlations must lie in $[0, 1]$, which forces all entries to be positive
  correct: 1
