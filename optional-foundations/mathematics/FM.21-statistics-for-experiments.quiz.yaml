- source: 736377b44840
  question: An outlier inflates the sample sd. Why does that make the classic z-score test worse at detecting it?
  options:
    - The z-score uses the median, which the outlier shifts toward itself
    - The inflated sd makes every other point look like an outlier instead
    - The z-score ignores the sd and only uses the range of the data
    - The z-score divides by the sd the outlier inflated, so its own z shrinks
  correct: 3
- source: 217fa3f6e7bf
  question: Your robot completed 50 navigation runs with 0 collisions. What can you say about its collision rate?
  options:
    - It is 0%, since no collisions were observed
    - With 95% confidence it is below about 0.5% per run
    - With 95% confidence it is below about 6% per run
    - Nothing, since zero events give no information
  correct: 2
- source: 771eb3b0800d
  question: Odometry RMSE improved from 3.0 to 2.0 cm, but a colleague can't reproduce it. "Before" ran in the morning on a full battery, "after" in the evening. What went wrong?
  options:
    - Too few trials; repeat the same morning/evening schedule with twice as many runs
    - A confounder (battery, conditions); interleave both in random order and log voltage
    - The colleague's robot differs; send them your exact robot to reproduce it
    - RMSE is the wrong metric; report the median error instead to remove the gap
  correct: 1
