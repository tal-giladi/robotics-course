- source: 177f287c5ace
  question: Your simulated range sensor (Gaussian noise σ = 1 cm) never produces the 4.0 m ghost readings the real one does. What is missing from the noise model?
  options:
    - A larger σ, around 1 m, so that ghost readings appear naturally
    - A constant bias of about 3 m added to every reading
    - A low-pass filter that smooths readings like the real sensor does
    - "An outlier component: with small probability, return max range or a random value"
  correct: 3
- source: 6486b995e124
  question: Why is the Gaussian a common assumption for robot position error even though individual wheel-slip events are not Gaussian?
  options:
    - Wheel slips cancel out on average, leaving only the Gaussian encoder noise
    - Kalman filters force every error to become Gaussian after one update
    - Position error sums many small independent errors, so by the CLT it is ≈ Gaussian
    - Position error is bounded, and every bounded error is approximately Gaussian
  correct: 2
