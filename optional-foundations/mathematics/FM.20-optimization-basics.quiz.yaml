  question: Why is gradient descent slow when parameters have very different sensitivities?
  options:
    - η must suit the flattest direction, so steep directions oscillate forever and never converge
    - The gradient points exactly at the minimum, but its length is too small in steep directions
    - Each parameter needs its own separate optimizer run, which multiplies the iterations
    - η must suit the steepest direction, so flat directions shrink slowly; iterations grow with the condition number
