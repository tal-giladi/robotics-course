- source: 2829e3edee47
  question: What is the gradient-descent update, and the condition on η for a quadratic with largest curvature $\lambda_\text{max}$?
  options:
    - $\mathbf{x} \leftarrow \mathbf{x} + \eta\nabla f$; converges for $0 < \eta < 2/\lambda_\text{max}$
    - $\mathbf{x} \leftarrow \mathbf{x} - \eta\nabla f$; converges for $0 < \eta < 2\lambda_\text{max}$
    - $\mathbf{x} \leftarrow \mathbf{x} - \eta\nabla f$; converges for $0 < \eta < 2/\lambda_\text{max}$
    - $\mathbf{x} \leftarrow \mathbf{x} - \eta\nabla f$; converges for $\eta > 1/\lambda_\text{max}$
  correct: 2
- source: 1a68d1e3dd3c
  question: For $F = \frac{1}{2}\|\mathbf{r}\|^2$, what are the gradient and the Gauss-Newton step?
  options:
    - $\nabla F = J\mathbf{r}$; solve $J J^\top\,\boldsymbol\Delta = -J\mathbf{r}$
    - $\nabla F = \mathbf{r}$; solve $J\,\boldsymbol\Delta = \mathbf{r}$
    - $\nabla F = J^\top\mathbf{r}$; set $\boldsymbol\Delta = -J^\top\mathbf{r}$
    - $\nabla F = J^\top\mathbf{r}$; solve $J^\top J\,\boldsymbol\Delta = -J^\top\mathbf{r}$
  correct: 3
- source: 38a116b73ac2
  question: What does λ do in Levenberg-Marquardt, at both extremes?
  options:
    - "λ → 0: tiny gradient-descent step; λ → ∞: Gauss-Newton step"
    - "λ → 0: Gauss-Newton step; λ → ∞: tiny gradient-descent step"
    - "λ → 0: Newton step with exact Hessian; λ → ∞: no step at all"
    - "λ → 0: random search step; λ → ∞: Gauss-Newton step"
