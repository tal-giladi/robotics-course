# Multiple-choice version of the quiz in FM.19-linear-systems-least-squares.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 1781e6302c83
  question: Why does an overdetermined system usually have no exact solution, and what does least squares minimize?
  options:
    - Noisy equations are inconsistent; it minimizes $\|A\mathbf{x} - \mathbf{b}\|^2$
    - There are too few equations; it minimizes $\|\mathbf{x}\|^2$
    - The matrix is singular; it minimizes $\|A\mathbf{x} - \mathbf{b}\|_1$
    - The unknowns are correlated; it minimizes $\max_i |r_i|$
  correct: 0
- source: df1e963a4ae2
  question: Write the normal equations and state the geometric property of the residual at the solution.
  options:
    - $A A^\top\,\hat{\mathbf{x}} = A\mathbf{b}$; the residual is parallel to the columns of $A$
    - $A^\top A\,\hat{\mathbf{x}} = A^\top\mathbf{b}$; the residual is orthogonal to every column of $A$
    - $A^\top A\,\hat{\mathbf{x}} = A^\top\mathbf{b}$; the residual has zero length at the solution
    - $A\,\hat{\mathbf{x}} = \mathbf{b}$; the residual is orthogonal to $\mathbf{b}$
  correct: 1
