- source: 070e1402a1c5
  question: $\kappa(A) = 300$. What is $\kappa(A^\top A)$, and why does that matter?
  options:
    - 600; the normal equations lose one extra digit compared with `lstsq` on $A$
    - 300; transposing does not change conditioning, so either method is fine
    - 17.3; the normal equations are better conditioned than $A$ itself
    - 90,000; the normal equations lose about twice as many digits as `lstsq` on $A$
  correct: 3
- source: a9e816bfe085
  question: You fit $d = r\phi + c$ but all eight runs were exactly 1.0 m long. What happens?
  options:
    - The fit is perfect, since eight runs are more than enough for two unknowns
    - $c$ becomes exactly zero, and $r$ is estimated with normal accuracy
    - The fit fails with a divide-by-zero error that tells you to add runs
    - κ is huge, so $r$ and $c$ trade off; runs of different lengths are needed
  correct: 3
