- source: 20071b674ad1
  question: What is the difference between an event and a random variable? Pick the correct robot example.
  options:
    - 'Event: "measured range in meters" (has a probability); random variable: "the bump switch is pressed" (has a distribution)'
    - 'Both are the same thing: "the bump switch is pressed" is an event and also a random variable in meters'
    - 'Event: "number of wheel slips" (has a distribution); random variable: "the bump switch is pressed" (has a mean)'
    - 'Event: "the bump switch is pressed" (has a probability); random variable: "measured range in meters" (has a distribution)'
  correct: 3
