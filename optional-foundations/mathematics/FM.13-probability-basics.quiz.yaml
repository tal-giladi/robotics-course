- source: 2b619afd68aa
  question: You run the false-echo simulation ($p = 0.02$) with $n = 50$ readings, ten times with different seeds. What do the estimates look like?
  options:
    - They all land within ±0.001 of 0.02, since 50 readings is plenty
    - They are all exactly 0.02, since the seed does not affect the rate
    - They jump a lot (error ≈ 0.02, as big as $p$); many are 0.00, some 0.04 or 0.06
    - They are biased high, clustering around 0.10 because of the small sample
  correct: 2
- source: 184ff4ab142c
  question: 'Two side-by-side ultrasonic sensors each have 5% false echoes. The analysis says "both false: 0.25%" but testing shows 3%. Likely explanation?'
  options:
    - The 5% rate was measured wrong; it is really about 17% per sensor
    - The failures are not independent (crosstalk, shared surfaces); measure the joint rate
    - "The analysis should have added the rates: 5% + 5% ≈ 3% after rounding"
    - Random chance; 3% vs 0.25% is within normal test variation
  correct: 1
- source: 82d3905d397b
  question: Why does a Bayes filter need the law of total probability?
  options:
    - To normalize the posterior so the probabilities over all cells sum to one
    - To combine two independent sensors by multiplying their likelihoods
    - To convert a Gaussian sensor model into a discrete grid of cells
    - "To predict after moving: sum over prior cells of P(was there) × P(motion took it here)"
  correct: 3
