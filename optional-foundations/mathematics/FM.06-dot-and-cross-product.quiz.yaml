- source: 9b1048dc7ac9
  question: Why is $\mathbf{a}\cdot\hat{\mathbf{u}}$ the progress along $\hat{\mathbf{u}}$, but $\mathbf{a}\cdot\mathbf{u}$ (not normalized) isn't?
  options:
    - The unnormalized product has the wrong sign whenever $\mathbf{u}$ is longer than $\mathbf{a}$
    - The unnormalized product gives the perpendicular component instead of the parallel one
    - The unnormalized product is in squared units, so it is only off by a square root
    - It equals $\lVert\mathbf{a}\rVert\lVert\mathbf{u}\rVert\cos\theta$; only a unit $\mathbf{u}$ leaves the projected length
  correct: 3
