  question: Why is the trapezoid rule more accurate than the left Riemann sum for the same samples?
  options:
    - It uses more samples per interval, which averages out the sensor noise
    - It uses the midpoint value, which is exact for any curved rate
    - It assumes the rate stays at its starting value, which removes bias
    - It uses both ends, so linear rates are exact; error ∝ $\Delta t^2$ vs ∝ $\Delta t$
