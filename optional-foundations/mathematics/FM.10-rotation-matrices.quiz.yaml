  correct: 2
- source: dd770f7d962e
  question: Why is the inverse of a rotation matrix its transpose?
  options:
    - Its determinant is 1, and any matrix with determinant 1 has $R^{-1} = R^T$
    - It is symmetric, so transposing leaves it unchanged and inverting it too
    - Its diagonal is all ones, so transposing just negates the off-diagonal terms
    - Its columns are orthonormal, so $R^TR = I$, which defines $R^{-1} = R^T$
  correct: 3
- source: d7e78d1ba8f4
  question: A matrix has orthonormal columns and $\det = -1$. What is it, and what does it do to a right-handed frame?
  options:
    - A rotation plus reflection; it makes the frame left-handed, so it is not a valid orientation
    - A proper rotation by 180°; it keeps the frame right-handed and is a valid orientation
    - A scaling by −1; it keeps handedness but reverses every axis direction
    - A shear; it keeps handedness but the axes are no longer perpendicular
  correct: 0
