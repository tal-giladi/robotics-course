- source: 33f4aa401091
  question: Your EKF diverges whenever the landmark is almost directly behind the robot; the bearing Jacobian passed a gradient check with the landmark in front. Likely issue?
  options:
    - The Jacobian formula is wrong behind the robot and needs a sign flip there
    - The landmark is outside the sensor's field of view, so the EKF has no data
    - The bearing innovation isn't wrapped to $(-\pi, \pi]$, giving ~2π errors behind the robot
    - The step size of the gradient check was too large for landmarks behind
  correct: 2
