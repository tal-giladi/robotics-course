  question: Why does ROS use $(-\pi, \pi]$ rather than $[0, 2\pi)$ for yaw differences?
  options:
    - The error then has a meaningful sign (which way to turn) and zero is centered
    - It avoids floating-point overflow when angles grow large over time
    - Quaternion conversion only works for angles in $(-\pi, \pi]$
    - It halves the numerical resolution needed to store the angle
  correct: 0
