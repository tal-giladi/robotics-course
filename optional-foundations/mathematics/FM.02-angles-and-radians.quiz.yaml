  question: What is one radian, geometrically, and how many are in a full turn?
  options:
    - The angle whose arc length equals the diameter; a full turn is $\pi \approx 3.142$ rad
    - The angle whose arc length equals the radius; a full turn is $2\pi \approx 6.283$ rad
    - 1/360 of a full turn; a full turn is 360 rad
    - The angle whose chord equals the radius; a full turn is 6 rad
  correct: 1
