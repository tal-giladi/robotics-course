  question: The average of two IMU yaw readings, 3.13 rad and −3.13 rad, comes out as 0. Why, and what is the fix?
  options:
    - The IMU has a sign error on one axis; negate the second reading before averaging
    - The readings are in degrees, not radians; convert both before averaging
    - The mean is correct; the robot really is facing forward on average
    - Both point nearly backward but the arithmetic mean is forward; use `atan2(sum(sin), sum(cos))`
