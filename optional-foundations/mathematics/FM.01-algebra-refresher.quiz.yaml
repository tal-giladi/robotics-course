- source: 6e18fa5c7741
  question: "`ticks = d * N / 2 * math.pi * r` returns 174.2 for $d = 1$. What is wrong?"
  options:
    - Integer division truncates `N / 2`; it should be `d * N / 2.0 * math.pi * r` (174.5 ticks)
    - "Operator precedence: it computes $\\frac{dN}{2}\\pi r$; it should be `d * N / (2 * math.pi * r)` (8714.6 ticks)"
    - "The radius should be a diameter: `d * N / 2 * math.pi * (2 * r)` (348.4 ticks)"
    - "`math.pi` should be in degrees: `d * N / 2 * 180 * r` (9980 ticks)"
  correct: 1
