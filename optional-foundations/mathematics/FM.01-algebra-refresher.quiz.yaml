- source: f56eec9b4dcf
  question: You calibrate a motor with two runs at duty 0.40 and duty 0.40 (the same value twice, by accident). What does Cramer's rule do?
  options:
    - It returns the correct gain but an offset of zero, since both runs agree
    - It averages the two runs and returns a slightly noisier but valid fit
    - The determinant is 0, so it divides by zero; two identical inputs can't determine two unknowns
    - It returns a negative gain because the determinant becomes negative
  correct: 2
