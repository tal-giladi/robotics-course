  question: Why is the error of a pixel-to-floor mapping much larger at 2 m than at 0.5 m for the same 1 px error?
  options:
    - Lens distortion is stronger near the image edges
    - Far pixels are blurrier, so detection error grows
    - The homography is only valid within 1 m of the camera
    - Near the horizon, distance per pixel row grows roughly with $d^2$
  correct: 3
