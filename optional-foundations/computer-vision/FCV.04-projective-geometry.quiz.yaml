  question: How do you get the intersection of two image lines in homogeneous coordinates, and how do you recognise parallel lines?
  options:
    - Dot product of the line vectors; parallel if the result is 0
    - Cross product of the line vectors; parallel if the result has $w = 1$
    - Solve a 2×2 system; parallel if the determinant is 1
