- source: 093a4819ed48
  question: A floor homography places a detected mug 3 m away, but it's on a table 1 m away. Why?
  options:
    - The camera's focal length is wrong, so all distances are tripled
    - The mug's pixel is above the floor, so its ray hits the floor much farther away
    - The homography was computed at a different camera pitch
    - The mug is too small, so the detector's box is misplaced
  correct: 1
