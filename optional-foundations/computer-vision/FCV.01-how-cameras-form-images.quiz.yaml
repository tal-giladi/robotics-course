# Multiple-choice version of the quiz in FCV.01-how-cameras-form-images.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 5aea1db62b6c
  question: Why does a color camera need a Bayer filter at all?
  options:
    - Photodiodes respond to all visible wavelengths, so a per-pixel filter makes each measure one color band
    - Photodiodes see only green light, so red and blue filters extend the sensor's range
    - The filter blocks infrared light, which would otherwise wash out all three colors
    - The filter increases light sensitivity, since colored pixels collect more photons
  correct: 0
- source: 11ad0e750054
  question: A pixel collects 400 e⁻ with 3 e⁻ read noise. What is its SNR, and what is it if you double the exposure?
  options:
    - About 19.8; about 39.6 when doubled
    - About 133; about 267 when doubled
    - About 20.0; about 28.3 when doubled
    - About 19.8; about 28.1 when doubled
  correct: 3
- source: 5fed97503841
  question: The robot rotates at 2 rad/s with 20 ms exposure. How much blur does karmel's camera ($f \approx 467.7$ px) see near the image center?
  options:
    - About 1.9 px
    - About 9.4 px
    - About 18.7 px
    - About 47 px
