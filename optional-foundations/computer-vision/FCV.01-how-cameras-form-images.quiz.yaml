- source: 61bf873bd5a5
  question: Why are there twice as many green pixels as red or blue in a Bayer pattern?
  options:
    - Green filters are cheaper to make, so manufacturers use more of them
    - Luminance and most detail are dominated by green, so extra green gives better sharpness
    - Green light has the shortest wavelength, so it needs denser sampling
    - Red and blue are computed from green, so green needs double coverage
  correct: 1
- source: 46ee6056d30d
  question: A vertical pole looks tilted in images taken while the robot turns, but straight when it stands still. What is it, and what removes it?
  options:
    - Rolling-shutter skew; a global-shutter sensor removes it
    - Lens distortion; a camera calibration removes it
    - Motion blur; a shorter exposure time removes it
    - Chromatic aberration; a better lens removes it
  correct: 0
- source: 7b3b808b1a6d
  question: You point the camera at a fine black-and-white checkerboard 3 m away, where each square covers about 1 pixel. What artifacts appear?
  options:
    - Barrel distortion, since the board is far from the optical center
    - Motion blur, since each square is only one pixel wide
    - Vignetting, since the corners get less light at that distance
    - "Aliasing: moiré and false color, since red and blue are sampled every 2 px"
  correct: 3
