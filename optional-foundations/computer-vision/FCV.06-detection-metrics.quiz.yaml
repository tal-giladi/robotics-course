  question: You lower the confidence threshold from 0.5 to 0.2. What is the effect on precision, recall and AP?
  options:
    - Precision rises, recall falls, AP rises
    - Recall rises, precision usually falls, AP falls
    - Both rise, AP stays the same
    - Recall rises, precision usually falls, AP doesn't change
