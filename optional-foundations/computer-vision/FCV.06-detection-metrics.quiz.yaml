- source: 9eb1ed9b28a0
  question: What is the difference between mAP50 and mAP50:95, and when does a robot care about the second?
  options:
    - mAP50:95 averages AP over IoU 0.5–0.95; a robot cares when it uses box geometry like grasp points
    - mAP50:95 uses 95 % confidence; a robot cares when false positives are costly
    - mAP50:95 covers 50 to 95 classes; a robot cares when it detects many object types
    - mAP50:95 averages over image sizes; a robot cares when objects are far away
  correct: 0
