  question: Why does a second detection on an already-matched object count as a false positive?
  options:
    - Its IoU with the ground truth is always below 0.5 after the first match
    - Downstream consumers would see two objects; evaluation enforces one-to-one matching
    - It has a lower confidence, and low-confidence boxes are always false positives
    - NMS already removed it, so it no longer counts as a detection
