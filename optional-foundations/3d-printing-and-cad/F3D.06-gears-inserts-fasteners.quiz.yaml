  question: Why is a heat-set insert better than screwing into a printed hole for a bracket you will remove 20 times?
  options:
    - Printed threads wear and creep; a knurled brass insert survives many cycles
    - Inserts are cheaper than the extra plastic needed for threads
    - Printed holes can't be threaded at all without a tap
    - Inserts insulate the sensor electrically from the chassis
  correct: 0
