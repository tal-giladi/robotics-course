- source: 457a037fc200
  question: A pole sits at −40 s⁻¹. What does its response look like, and what is its time constant?
  options:
    - A decaying oscillation at 40 rad/s; time constant 25 ms
    - A pure exponential decay with no oscillation; time constant 40 ms
    - A growing exponential, since the pole is at 40; time constant 25 ms
    - A pure exponential decay with no oscillation; time constant 25 ms
  correct: 3
- source: 432fc5a2b830
  question: A pair of poles sits at $-1 \pm 20j$. Describe the response.
  options:
    - "A 20 rad/s oscillation decaying slowly as $e^{-t}$: stable but lightly damped (ζ ≈ 0.05)"
    - A fast decay with time constant 50 ms and a small 1 rad/s ripple on top
    - "An oscillation at 1 rad/s whose envelope decays as $e^{-20t}$: well damped"
    - An oscillation at 20 rad/s that grows slowly, since the imaginary part dominates
  correct: 0
- source: 6bc1a97b8716
  question: Why can't an ideal first-order plant under P control go unstable, while the real wheel can?
  options:
    - The ideal plant has no saturation; the real wheel's duty limit causes instability
    - Its one pole only moves left with gain (lag ≤ 90°); real filters, sampling and delays add lag to 180°
    - The ideal plant has infinite bandwidth, while the real wheel has a resonance at high speed
    - Its pole moves right with gain but never crosses zero; the real wheel's friction pushes it over
  correct: 1
