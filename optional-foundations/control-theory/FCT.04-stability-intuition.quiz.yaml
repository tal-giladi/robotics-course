- source: 8745f8784cd2
  question: What are sensible minimum gain and phase margins, and why keep margin at all?
  options:
    - About 1.2× and 15°, just enough to stay stable with a perfect model
    - About 2× (6 dB) and 45°, so model errors like battery, load and delay don't destabilize it
    - About 10× (20 dB) and 90°, so the loop never overshoots at all
    - About 2× (6 dB) and 45°, mainly to reduce steady-state error
  correct: 1
