- source: 6f583e6eeaca
  question: Why can't you remove all error by making $K_p$ very large?
  options:
    - A large $K_p$ amplifies only the setpoint, not the error, so the ratio stays the same
    - Loop lag makes high gain over-correct on stale data and go unstable, and the duty saturates
    - The integrator winds up at high $K_p$, which adds a constant offset to the output
    - Encoder quantization grows with $K_p$, so the measured error never reaches zero
  correct: 1
- source: 9b236395abb5
  question: After replacing a motor, the wheel runs to maximum reverse whenever the speed loop is enabled; the code hasn't changed. What happened, and where do you fix it?
  options:
    - The new motor has a larger gain; lower $K_p$ in the controller until it settles
    - The new motor's driver is faulty; replace the H-bridge channel for that wheel
    - Reversed motor/encoder polarity makes positive feedback; fix the direction flag in the HAL or config
    - Reversed polarity makes positive feedback; flip the sign of the controller's error term
  correct: 2
- source: 983c1108fff3
  question: Why does karmel run the wheel-speed loop on the Pico and the path-following loop on the Pi?
  options:
    - The Pico has more floating-point power, so the heavier of the two loops runs there
    - The Pi's USB port can't send setpoints faster than the encoders update
    - ROS 2 forbids running two nested control loops on the same computer
    - "Cascade: the fast inner loop sits by the encoders; the slow outer loop needs maps"
  correct: 3
