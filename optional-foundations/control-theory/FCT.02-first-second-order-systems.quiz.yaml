  question: Why can a first-order system never overshoot?
  options:
    - Its rate is proportional to the remaining gap, and it has only one energy storage
    - Its gain is always below one, so the output can't exceed the input
    - It has no friction, so nothing pushes it past the target
    - Its time constant is too short for the output to build momentum
  correct: 0
