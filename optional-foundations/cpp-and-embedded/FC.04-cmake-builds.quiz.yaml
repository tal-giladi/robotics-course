  question: What is the difference between `cmake -S . -B build` and `cmake --build build`?
  options:
    - The first configures and generates a native build system; the second runs it
    - The first compiles sources; the second links them into executables
    - The first builds Debug; the second builds Release
    - The first downloads dependencies; the second configures and compiles
  correct: 0
- source: f9ec083dd7f9
  question: "`target_include_directories(foo PRIVATE include/)` and `foo`'s public header includes something from `include/`. What fails, and at which stage?"
  options:
    - "`foo` itself fails at link time with `undefined reference`"
    - CMake fails at configure time with a missing directory error
    - Anything linking `foo` fails at compile time with `No such file`
    - Nothing fails; PRIVATE includes propagate to direct dependents
  correct: 2
- source: 38b6ca09e0c7
  question: You change one comment line in `include/wheelodom/odometry.hpp`. How many translation units recompile, and why?
  options:
    - None, because the compiler ignores changes to comments
    - One, `odometry.cpp`, because it is the header's implementation file
    - Two, the files that call `odometry` functions directly
    - All three, because `#include` is textual and their input bytes changed
  correct: 3
- source: 4b4e438cdf32
  question: "`undefined reference` versus `multiple definition`: what does each tell you, and which stage produces them?"
  options:
    - "Compiler errors: a missing `#include`, and a variable declared twice in one scope"
    - "Linker errors: a used symbol defined nowhere, and an ODR break like a non-inline body in a header"
    - Undefined is a compiler error and multiple is a linker error from duplicate libraries
    - "CMake errors: a missing target, and a target added twice with `add_library`"
  correct: 1
