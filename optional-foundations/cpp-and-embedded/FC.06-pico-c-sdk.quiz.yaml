- source: cc94a696b00d
  question: Which of `int32_t`, Q16.16, `float` and `double` would you use for karmel's wheel-speed PID on an RP2350, and why?
  options:
    - "`double`, because the M33's FPU runs double precision at integer speed"
    - Q16.16, because fixed point avoids FPU context switches in interrupts
    - "`float`, because the M33 has a hardware single-precision FPU and 7 digits is ample"
    - "`int32_t`, because the encoder counts are integers and floats drift over time"
  correct: 2
