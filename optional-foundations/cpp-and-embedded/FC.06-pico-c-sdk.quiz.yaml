  question: Your firmware works with `printf` enabled and hangs when you turn USB stdio off. What is the likely cause?
  options:
    - The logging provided a delay that something needed; wait on the peripheral's ready flag instead
    - The linker drops `main` when stdio is off; add `pico_enable_stdio_uart` to keep it
    - Without USB stdio the chip boots into BOOTSEL mode; hold the reset pin during power-up
    - The watchdog is fed by `printf` internally; call `watchdog_update()` yourself in the loop
  correct: 0
- source: 2d08f926dc3c
  question: You have 31 kB of firmware and want a 40 kB lookup table and a 6 kB buffer. Does it fit on a Pico 2?
  options:
    - "No: the table and buffer both go to RAM, and 46 kB exceeds the stack budget"
    - Only if the table is compressed, since flash is limited to 64 kB per image
    - Yes, but only after moving the buffer into flash as well
    - "Yes, comfortably: a `const` table lives in flash and the buffer uses little RAM"
  correct: 3
