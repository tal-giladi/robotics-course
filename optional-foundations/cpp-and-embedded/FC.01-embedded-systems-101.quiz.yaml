  question: MicroPython `main.py` sets a motor to 50 % and then hits an uncaught exception. What does the motor do?
  options:
    - Stops, because the interpreter resets all peripherals on an exception
    - Keeps turning at 50 %, because the PWM peripheral keeps generating the signal
    - Coasts to a stop, because the REPL disables PWM when it starts
    - Speeds up to 100 %, because the PWM pin floats high with no program
  correct: 1
