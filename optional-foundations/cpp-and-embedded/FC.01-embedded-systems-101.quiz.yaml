- source: 0859180aaa6c
  question: Why does the chip have separate `GPIO_OUT_SET` / `GPIO_OUT_CLR` registers instead of only `GPIO_OUT`?
  options:
    - To change some pins in one atomic write, avoiding a read-modify-write race with interrupts
    - Because `GPIO_OUT` is read-only and reflects only the input pin levels
    - To let the two cores each own half of the pins without locking
    - Because writing `GPIO_OUT` directly draws too much current on all pins
  correct: 0
