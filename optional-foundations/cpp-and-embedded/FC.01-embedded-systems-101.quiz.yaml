  question: Which is something a microcontroller does better than a Raspberry Pi 5, and something it can't do?
  options:
    - "Better: predictable microsecond timing and instant boot; can't: run ROS 2, SLAM or vision"
    - "Better: running many isolated programs at once; can't: generate PWM without an OS"
    - "Better: floating-point vision processing; can't: boot quickly after a power cut"
    - "Better: storing large logs; can't: react to hardware events without a driver"
  correct: 0
- source: c27a08cac590
  question: What is at `0x10000000` and at `0x20000000` on the RP2350, and which survives a power cycle?
  options:
    - "`0x10000000` is SRAM, `0x20000000` is flash; the SRAM survives"
    - "`0x10000000` is the boot ROM, `0x20000000` is flash; both survive"
    - "`0x10000000` is XIP-mapped flash, `0x20000000` is SRAM; the flash survives"
    - "`0x10000000` is flash, `0x20000000` is peripheral registers; neither survives"
  correct: 2
