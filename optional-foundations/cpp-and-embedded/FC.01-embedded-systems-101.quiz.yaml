- source: 6eb19d2b7e6d
  question: The Pico's USB serial port disappears every time the robot starts driving. Code bug or power problem, and what do you measure first?
  options:
    - Code bug, a stack overflow in the motor loop; measure free RAM with `gc.mem_free()`
    - USB driver bug on the laptop; check `dmesg` for enumeration errors first
    - Code bug, the UART and PWM share a timer; check the pin assignments first
    - Most likely power (brown-out); measure 3V3/VSYS while starting the motor and check `reset_cause()`
