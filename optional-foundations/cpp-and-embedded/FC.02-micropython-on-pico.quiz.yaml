- source: 80187a9803ef
  question: What is the difference between `mpremote run x.py` and `mpremote cp x.py :main.py`?
  options:
    - "`run` executes from RAM once without storing it; `cp … :main.py` writes it to flash to run at every power-up"
    - "`run` writes the file to flash and runs it; `cp … :main.py` only copies it without running it ever"
    - "`run` compiles to bytecode first; `cp … :main.py` stores the source, which runs more slowly"
    - Both store the file in flash; `run` also opens the REPL afterward for debugging
  correct: 0
