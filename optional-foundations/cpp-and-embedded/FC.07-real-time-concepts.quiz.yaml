  question: What is priority inversion, and what is the non-mutex version you will actually meet on a Pico?
  options:
    - A low-priority task preempts a high-priority one; on a Pico, two IRQs set to the same priority
    - A high task waits on a low one that a medium task preempts; on a Pico, any unbounded op in a bounded job
    - A task's priority is lowered after a deadline miss; on a Pico, the hardware watchdog's reset
    - Two tasks deadlock on each other's mutex; on a Pico, both cores waiting on the FIFO
