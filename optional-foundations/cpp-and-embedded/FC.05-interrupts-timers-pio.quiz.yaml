  question: Roughly how long is it from the electrical edge to the first line of a C interrupt handler on a 150 MHz Cortex-M33?
  options:
    - About 2–3 cycles, about 0.02 µs, since the NVIC jumps directly
    - About 20–25 cycles, about 0.15 µs, including stacking 8 registers
    - About 150 cycles, about 1 µs, for the OS to schedule the handler
    - About 20–25 µs, since the handler address is fetched from flash
  correct: 1
- source: 2721a79ac0d2
  question: "Which of these are legal inside a MicroPython hard IRQ: `count += 1`, `t = time.ticks_us()`, `speed = ticks * 0.01`, `buf[i] = 7` on a preallocated `bytearray`, `print(count)`?"
  options:
    - Only the `bytearray` write; all the others allocate
    - All except `print`, since floats live on the stack
    - "`count += 1`, `ticks_us()` and the `bytearray` write"
    - "`count += 1`, `ticks_us()` and `print`, not the float"
  correct: 2
