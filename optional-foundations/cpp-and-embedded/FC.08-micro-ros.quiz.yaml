# Multiple-choice version of the quiz in FC.08-micro-ros.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: a04278dd613c
  question: What does the micro-ROS agent do, and what breaks if it is not running?
  options:
    - It compiles the firmware's message types; without it the build fails at link time
    - It relays topics to the cloud; without it only local nodes can see the robot
    - It holds the DDS participant and proxies for the MCU; without it no entity can be created
    - It resets the MCU on errors; without it the firmware keeps running unsupervised
  correct: 2
- source: 0928bcbc585e
  question: Why is a `sensor_msgs/msg/JointState` with two joints 124 bytes when the same data fits in a 47-byte ASCII line?
  options:
    - CDR adds a header, `frame_id`, name strings, length prefixes and alignment padding
    - CDR stores every number as a 16-byte decimal for exact round-tripping
    - XRCE-DDS adds a 77-byte encryption envelope to every message
    - micro-ROS pads all messages to a fixed 128-byte slot, minus a 4-byte CRC
  correct: 0
- source: 3776db052888
  question: You want `JointState` (147 bytes with framing) at 100 Hz over a 115200-baud UART. Does it fit, and what is the highest rate at half the link?
  options:
    - Fits at 13 % of the link; half the link allows about 390 Hz
    - Fits at 64 % of the link; half the link allows about 78 Hz
    - Doesn't fit (about 128 %); half the link allows about 78 Hz
    - Doesn't fit (about 128 %); half the link allows about 39 Hz
  correct: 3
- source: f1419fc8c6ed
  question: Your node needs 1 node, 3 publishers, 6 subscriptions and 1 timer. What fails, where, and what is the fix?
  options:
    - The build fails at link time; add `-lmicroros` twice to the CMake target
    - The sixth subscription fails at run time (pool of 5); rebuild `libmicroros.a` with a larger pool
    - The fourth publisher fails at run time; merge publishers onto fewer topics
    - Nothing fails, but the executor must be sized for 10 handles including publishers
  correct: 1
