  question: The agent is killed while the robot drives at 0.5 m/s (200 ms ping interval, 100 ms ping timeout, 10 ms step). Worst case, how far is the blind travel?
  options:
    - About 0.155 m, plus braking
    - About 0.05 m, plus braking
    - About 0.10 m, plus braking
    - About 0.31 m, plus braking
  correct: 0
- source: 6d229d459217
  question: Why does the firmware run the control step in the superloop instead of an `rclc` timer?
  options:
    - "`rclc` timers can only run at up to 10 Hz, which is too slow for motor control"
    - "`rclc` timers use floating point, which is slow on the Cortex-M33"
    - "`rclc` timers only run while the session lives, but control must survive middleware failure"
    - The superloop can run on the second core, which `rclc` does not support
  correct: 2
- source: 302d3451b2ef
  question: The agent shows frames arriving, but `ros2 topic list` on another machine doesn't show the topic, while the Pi does. Where is the problem?
  options:
    - "In the firmware: the publisher was created with best-effort QoS"
    - "In micro-ROS: the entity pool is full, so the topic is only local"
    - "In the serial link: frames arrive but CRCs fail, so the agent drops them"
    - "In ordinary ROS 2 networking: `--net=host`, `ROS_DOMAIN_ID` or multicast"
  correct: 3
- source: 8a6dc346e256
  question: On a Pico 2 (4 MB flash, 520 kB RAM), micro-ROS costs 90 kB flash and 20 kB RAM. Is memory the reason not to use it?
  options:
    - Yes, since 20 kB RAM leaves too little for the control loop's stack
    - No, it is about 2 % of flash and 4 % of RAM; decide on the agent, protocol and bandwidth
    - Yes, since 90 kB of flash exceeds the XIP cache and slows every call
    - No, since micro-ROS runs from the agent's memory, not the Pico's
  correct: 1
