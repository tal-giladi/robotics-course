  question: What is the difference between "undefined behaviour" and "an exception"?
  options:
    - An exception is a defined outcome you can catch; UB imposes no requirement and the compiler may assume it never happens
    - UB always crashes the program at once; an exception can be caught and handled
    - UB is a runtime exception the standard library doesn't document; catch it with `catch (...)`
    - They are the same in release builds; the difference only exists with debug assertions
