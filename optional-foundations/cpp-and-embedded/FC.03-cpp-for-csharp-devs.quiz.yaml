- source: bbfb785bbd1a
  question: "`std::vector<double> v(1000);` as a local: where do the `vector` object and the 1,000 doubles live, and what destroys them?"
  options:
    - Both on the heap; the garbage collector frees them when `v` is unreachable
    - Both on the stack; the compiler pops them at the closing brace
    - Object on the heap, doubles on the stack; `delete v` frees both
    - Object on the stack, doubles on the heap; `~vector()` frees them at the closing brace
  correct: 3
