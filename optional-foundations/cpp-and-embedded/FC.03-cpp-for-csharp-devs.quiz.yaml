  question: Why does `MotorGuard` delete its copy constructor?
  options:
    - It owns a unique resource; copies would issue "stop" twice or close a descriptor twice
    - Copying is slower than moving, so deleting it forces faster code
    - The compiler cannot generate a copy constructor for classes with destructors
    - A deleted copy constructor makes the class usable in `constexpr` contexts
