  question: What is the difference between `tottime` and `cumtime`, and which do you sort by to find the loop body that burns CPU?
  options:
    - "`tottime` includes called functions, `cumtime` excludes them; sort by `cumtime`"
    - "`tottime` is wall time, `cumtime` is CPU time; sort by `cumtime`"
    - "`tottime` is per call, `cumtime` is summed over calls; sort by `tottime`"
    - "`tottime` excludes called functions, `cumtime` includes them; sort by `tottime`"
  correct: 3
