  question: Why is `sum(x * x for x in arr)` over a numpy array slower than the same loop over a Python list?
  options:
    - Each element becomes a boxed numpy scalar, whose arithmetic costs more than Python floats
    - numpy arrays are stored column-major, so iterating them causes cache misses
    - The generator copies the whole array to a list before summing
    - "`sum` falls back to `np.sum`, which recompiles for each element"
  correct: 0
