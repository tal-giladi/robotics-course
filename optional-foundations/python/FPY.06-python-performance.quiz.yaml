- source: 4b8b1656fba2
  question: When is numba a better choice than numpy vectorization?
  options:
    - When the data is small, since numba has no startup cost unlike numpy
    - For numeric loops with per-element branching or state that don't map onto whole-array ops
    - When code uses dicts and classes, which numba speeds up more than numpy
    - Whenever the code runs on the Pi, since numpy has no arm64 SIMD support
  correct: 1
- source: 7d411b9005e7
  question: Why does the course run the motor PID and the command watchdog on the Pico instead of in the Python process on the Pi?
  options:
    - The Pi's GPIO pins cannot generate PWM at the frequency the motor driver needs
    - The Pico's floating-point unit computes PID updates faster than the Pi's CPU
    - Python on the Pi can't import the PID library needed for motor control
    - Those loops need bounded latency, and the Pico keeps working if the Pi's software stalls
  correct: 3
