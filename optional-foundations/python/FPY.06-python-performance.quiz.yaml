  question: Your 10 Hz mapping update takes 45 ms mean but 140 ms p99 on the Pi. Is that acceptable, and what do you check first?
  options:
    - Yes, since the 45 ms mean is well under the 100 ms budget
    - Yes, if you raise the rate to 20 Hz so that the spikes average out
    - Not reliably, 1% overrun the budget; check if spikes match other load (py-spy)
    - No; rewrite the update in C++ first, since Python can't meet 10 Hz
