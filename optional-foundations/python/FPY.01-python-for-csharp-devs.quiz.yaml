- source: 2252bc1f887f
  question: '`for w in ["left", "right", "caster"]: bus.on(w, lambda msg: handle(w, msg))` makes every callback report `"caster"`. Why, and what is a fix?'
  options:
    - "`bus.on` overwrites earlier callbacks; register them in reverse order"
    - "The closures capture the variable `w`, read after the loop ends; use `lambda msg, w=w: handle(w, msg)`"
    - Lambdas are compiled once per loop; move the lambda outside the `for` statement
    - Strings are interned, so all three `w` values are the same object; use `w.copy()`
  correct: 1
