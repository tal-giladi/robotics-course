  question: What do `-13 % 12` and `-13 // 12` evaluate to in Python, and why is that useful for a 12-slot ring buffer?
  options:
    - "`-1` and `-1`; the negative index wraps from the end of the list automatically"
    - "`11` and `-1`; floor division rounds toward zero, keeping the index in range"
    - "`-1` and `-2`; the sign follows the dividend, so you can detect backward steps"
    - "`11` and `-2`; `%` takes the divisor's sign, so `(i - k) % n` is always in `[0, n)`"
  correct: 3
