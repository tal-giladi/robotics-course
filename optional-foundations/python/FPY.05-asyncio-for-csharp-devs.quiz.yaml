  question: Why does `pyserial`'s `readline()` with `timeout=None` make clean shutdown of an asyncio program hard?
  options:
    - It holds the GIL while waiting, so the event loop can't run the shutdown code
    - It runs in a worker thread that blocks forever, and Python threads can't be cancelled from outside
    - It raises `CancelledError` inside the serial driver, which corrupts the port state
    - It closes the port on cancel, so the shutdown stop command can't be sent
  correct: 1
