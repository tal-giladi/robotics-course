  question: A 20 Hz loop uses `await asyncio.sleep(0.05)` after 8 ms of work. What is the real rate, and how do you fix it?
  options:
    - About 17 Hz; schedule on absolute time with `next_t += 0.05` and sleep until `next_t`
    - Exactly 20 Hz; `asyncio.sleep` subtracts time already spent in the coroutine
    - About 17 Hz; shorten the sleep to `0.042` to compensate for the work
    - About 23 Hz; the sleep ends early because the timer rounds down
