# Multiple-choice version of the quiz in FPY.05-asyncio-for-csharp-devs.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 84d67b621b4e
  question: In C#, CPU-heavy work in one request doesn't slow others. Why can the same situation in asyncio stall a robot?
  options:
    - asyncio uses a thread pool with only one worker, which the CPU work saturates
    - asyncio's scheduler preempts coroutines every 10 ms, adding jitter to all tasks
    - asyncio runs all coroutines on one thread, so CPU work without `await` blocks every other coroutine
    - Python's `await` copies arguments to the pool, so large payloads block the caller
  correct: 2
- source: 7dacb68abc22
  question: You call `send_stop(port)` (an `async def`) inside an `except` block but forget `await`. What happens?
  options:
    - The stop is sent later, when the event loop next becomes idle
    - The stop is sent synchronously, blocking the loop until it finishes
    - A `TypeError` is raised immediately, crashing the handler
    - Nothing is sent; a `never awaited` warning appears and the robot keeps driving
  correct: 3
- source: a09d84b9886c
  question: A pure-Python path planner takes 400 ms. Which is the right way to run it from asyncio, and what about a 400 ms OpenCV resize + blur?
  options:
    - Planner in a `ProcessPoolExecutor`; OpenCV in `asyncio.to_thread`, since it releases the GIL
    - Planner in `asyncio.to_thread`; OpenCV in a `ProcessPoolExecutor`, since it holds the GIL
    - Both as plain coroutines, since `await` lets the loop run the rest in parallel
    - Both in `asyncio.to_thread`, since threads give true parallelism for any code
  correct: 0
