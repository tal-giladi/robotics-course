- source: 23d0d4cafa05
  question: Why prefer `fig, ax = plt.subplots()` and `ax.plot` over `plt.plot` in robot code?
  options:
    - "`ax.plot` renders on the GPU, which keeps live plots fast on the Pi"
    - "`plt.plot` is deprecated in current Matplotlib and prints a warning each call"
    - "`ax.plot` saves figures automatically, so plots survive a crashed run"
    - Explicit objects replace hidden global state, so functions can take `ax` and compose safely
  correct: 3
- source: 1014fba64e0f
  question: Telemetry at 50 Hz, 2464 ticks/rev. The speed plot shows values only at …, 9.94, 10.07, 10.20, … rad/s. Noise or something else?
  options:
    - "Quantization: one tick per 20 ms is 0.1275 rad/s, so speeds are multiples of it"
    - Electrical noise from the motor driver's PWM, which a ferrite bead would fix
    - "Aliasing: the wheel spins faster than 25 Hz, above the Nyquist frequency"
    - Float rounding in the telemetry format, which stores two decimal places
  correct: 0
- source: 750e090dba60
  question: You plot `np.diff(ticks)`-based speed against `t[1:]`. What error does that introduce, and how large is it at 50 Hz?
  options:
    - A full period early, 20 ms, since the diff uses the previous sample
    - A half-period late shift, 10 ms, since each difference belongs at the midpoint
    - A half-period early shift, 10 ms, since `np.diff` drops the last sample
    - No time error, only a factor-of-50 scaling error in the speed values
  correct: 1
