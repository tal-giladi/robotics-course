- source: 3cbafa8131b4
  question: A colleague says `isinstance(x, MotorDriver)` on a `runtime_checkable` `Protocol` guarantees `x.set_duty(0.5)` works. What's wrong?
  options:
    - It only checks that attributes with those names exist, not signatures or return types
    - It always returns `True` for any object, since Protocols are erased at runtime
    - It requires `x` to inherit from `MotorDriver`, so duck-typed drivers fail the check
    - It checks signatures but not return types, so only the return value can be wrong
  correct: 0
- source: 159c34eb2942
  question: Why is `@dataclass(frozen=True)` good for startup config, and what is the C# equivalent of `dataclasses.replace(cfg, max_duty=0.3)`?
  options:
    - It makes loading faster and uses less memory; C# `cfg.Clone()` then setting `MaxDuty`
    - It prevents silent mid-run changes and is hashable and thread-safe; C# `cfg with { MaxDuty = 0.3 }`
    - It lets you change fields only from `__post_init__`; C# `cfg with { MaxDuty = 0.3 }`
    - It serializes to YAML automatically; C# `new Config(cfg) { MaxDuty = 0.3 }`
  correct: 1
