- source: 57d5af1bc4e7
  question: What does `Ticks = NewType("Ticks", int)` cost at runtime, and what does it buy?
  options:
    - A small wrapper object per value; it raises `TypeError` at runtime on unit mix-ups
    - Nothing at runtime; it makes `Ticks` values immutable so they can't be changed
    - Nothing at runtime; a type checker rejects a plain `int` or `Meters` where `Ticks` is expected
    - An `isinstance` check per call; it converts floats to ints automatically
  correct: 2
- source: 92aa39339959
  question: Your library declares `dependencies = ["numpy==2.1.0"]`. On the Pi with ROS 2 Jazzy (apt numpy 1.26), what goes wrong, and what should you write?
  options:
    - pip shadows the system numpy that `cv_bridge` was built against; use `numpy>=1.26` in the library
    - pip refuses to install any numpy in the venv; use `numpy==1.26` pinned in the library
    - Nothing goes wrong, since the venv isolates it; keep the exact pin for reproducibility
    - apt upgrades the system numpy to 2.1 to match; add `numpy<2` to avoid the upgrade
  correct: 0
- source: f01f557fd466
  question: "Protocol or ABC: every sensor driver should share a `read_with_retry()` implementation that calls an abstract `_read_once()`. Which, and why?"
  options:
    - Protocol, because structural typing lets drivers share code without inheritance
    - ABC, because you are sharing implementation (a template method), which needs inheritance
    - Protocol, because ABCs cannot declare abstract private methods like `_read_once`
    - ABC, because Protocols cannot be used with `isinstance` checks at all
  correct: 1
