- source: d7cd44118dee
  question: Why is `pts @ R.T` correct for an `(M, 2)` array of row points, and what does `pts @ R` compute instead?
  options:
    - Rows are $p^{\mathsf T}$ and $(Rp)^{\mathsf T} = p^{\mathsf T}R^{\mathsf T}$; `pts @ R` rotates by $-\psi$
    - NumPy stores `R` column-major, so `.T` fixes the order; `pts @ R` raises a shape error
    - Rows are $p^{\mathsf T}$ and $(Rp)^{\mathsf T} = R^{\mathsf T}p$; `pts @ R` mirrors across the x-axis
    - "`R.T` scales by $\\cos\\psi$ first; `pts @ R` gives the same result for small angles only"
  correct: 0
