- source: e4ed0832bf8d
  question: "Distances from 1,000 points to 50 landmarks via broadcasting: what are the intermediate shape and float64 memory, and does it scale to 100,000 × 10,000?"
  options:
    - "`(1000, 50)`, 0.4 MB; yes, 100,000 × 10,000 needs only about 8 GB"
    - "`(1000, 50, 2)`, 0.8 MB; no, 100,000 × 10,000 needs about 16 GB, so chunk or use a KD-tree"
    - "`(1000, 50, 2)`, 8 MB; no, 100,000 × 10,000 needs about 160 GB"
