- source: 47d6caad786a
  question: What is the shape of `np.ones((480, 640, 3)) * np.array([0.5, 1.0, 1.0])`, and what does it do to an OpenCV image?
  options:
    - "`(480, 640, 3)`; it halves channel 0, which is blue in OpenCV's BGR order"
    - "`(480, 640, 3)`; it halves channel 0, which is red in OpenCV's order"
    - "`(3, 480, 640)`; it halves the first row of every channel"
    - It raises a broadcasting error, since `(3,)` doesn't match `(480,)`
  correct: 0
