- source: b0038afc976c
  question: "`apt install ros-jazzy-slam-toolbox` on the Pi gives unmet dependency errors on `ros-jazzy-rclcpp`; the laptop installs it fine. What is your first move?"
  options:
    - Download the `.deb` from the laptop's cache and install it on the Pi with `dpkg -i`
    - Run `sudo apt update && sudo apt full-upgrade` on the Pi so its ROS packages match the current sync
    - Build slam_toolbox from source on the Pi, since the binary package is broken for arm64
    - Remove `ros-jazzy-rclcpp` with `apt remove` and then install slam_toolbox again
  correct: 1
