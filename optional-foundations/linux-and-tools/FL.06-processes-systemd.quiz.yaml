  question: A driver's exit code is 137. What happened? And 130?
  options:
    - "137: killed by SIGTERM (128 + 9); 130: killed by SIGKILL (128 + 2)"
    - "137: out of disk space; 130: out of memory"
    - "137: killed by SIGKILL (128 + 9); 130: interrupted by SIGINT (128 + 2)"
    - "137: interrupted by SIGINT (128 + 9); 130: killed by SIGKILL (128 + 2)"
