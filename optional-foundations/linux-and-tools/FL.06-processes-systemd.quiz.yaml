- source: d46e4ff8c6bd
  question: With `Restart=on-failure`, the program catches SIGTERM from `kill` and exits 0. Does systemd restart it? What about `kill -9`?
  options:
    - "Exit 0: no restart; `kill -9`: yes, death by signal counts as failure"
    - "Exit 0: yes, any stop triggers a restart; `kill -9`: no restart"
    - "Exit 0: no restart; `kill -9`: no restart, since SIGKILL is intentional"
    - Both restart, since `on-failure` covers any exit
  correct: 0
