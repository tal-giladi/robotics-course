  question: Which signal does `systemctl stop` send first, and what happens if the process doesn't exit?
  options:
    - SIGKILL, then SIGTERM after `TimeoutStopSec`
    - SIGTERM, then SIGKILL after `TimeoutStopSec`
    - SIGINT, then SIGTERM after 90 s
    - SIGHUP, then the unit is marked failed
