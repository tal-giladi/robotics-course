  question: After a reboot your LiDAR is `/dev/ttyUSB0` and the motor board `/dev/ttyUSB1`; yesterday it was swapped. Robust fix?
  options:
    - Plug the devices in one at a time in the same order after each boot
    - Use `/dev/serial/by-id/...` or a udev rule making a fixed symlink
    - Hard-code `/dev/ttyUSB0` for the LiDAR and swap cables if needed
    - Add `sleep 10` at boot so the devices enumerate in a stable order
