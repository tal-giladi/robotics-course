  question: What does the `EXTERNALLY-MANAGED` file do, and where is it on Ubuntu 24.04?
  options:
    - It marks the OS Python as apt-managed, so pip refuses to install outside a venv; `/usr/lib/python3.12/EXTERNALLY-MANAGED`
    - It lists packages pip must never upgrade, but allows others; `/etc/pip/EXTERNALLY-MANAGED`
    - It redirects pip installs into `~/.local`, keeping the system clean; `/usr/lib/python3.12/EXTERNALLY-MANAGED`
    - It tells apt to ignore pip-installed packages when upgrading; `/usr/local/lib/python3.12/EXTERNALLY-MANAGED`
  correct: 0
