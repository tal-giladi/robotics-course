  question: Why does a ROS workspace venv need `--system-site-packages`?
  options:
    - So pip can install into `/usr/lib/python3` without hitting the PEP 668 error
    - So `colcon` can find the venv's interpreter when building C++ packages
    - So the venv uses the system Python binary instead of making its own copy
    - So the venv still sees apt-installed libraries like `python3-numpy` that ROS packages need
