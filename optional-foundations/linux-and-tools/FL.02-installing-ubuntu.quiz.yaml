- source: e911e5422895
  question: "`ubuntu-ready.sh` exits with code 1 inside `docker run ubuntu:24.04`. Which check fails, and why isn't that a problem with the image?"
  options:
    - The systemd check; containers don't run systemd, so it must be installed
    - The sudo check; containers run as root, so sudo must be installed
    - The UTF-8 locale; minimal images leave `LANG` unset, so set `ENV LANG=C.UTF-8`
    - The network check; containers have no internet until `--network host` is set
  correct: 2
