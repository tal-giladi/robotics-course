- source: dee5c8379674
  question: "`colcon build` takes 6 minutes in WSL vs 40 seconds for a colleague on the same laptop. The workspace is `/mnt/c/Users/you/karmel_ws`. Likely cause?"
  options:
    - WSL is limited to one CPU core by default; raise it in `.wslconfig`
    - Windows Defender scans every file inside WSL; disable it for the Linux disk
    - The colleague uses a release build; add `--cmake-args -DCMAKE_BUILD_TYPE=Release`
    - It's on the Windows filesystem via a slow cross-OS protocol; move it to `~/karmel_ws`
  correct: 3
