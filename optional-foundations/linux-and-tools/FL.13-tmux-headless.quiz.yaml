# Multiple-choice version of the quiz in FL.13-tmux-headless.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: c11daa287255
  question: Which signal kills programs started in an SSH session when the connection drops, and why doesn't it reach programs inside tmux?
  options:
    - SIGTERM; tmux traps it and forwards only SIGINT to its panes
    - SIGKILL; tmux runs its panes in a separate cgroup that SSH cannot signal
    - SIGPIPE; tmux buffers the output, so its programs never write to a closed pipe
    - SIGHUP; tmux programs run on ptys owned by the tmux server, so only the client is hung up
  correct: 3
