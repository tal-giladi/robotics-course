  question: What are the tmux keys to detach, split left/right, zoom a pane and enter scroll mode?
  options:
    - "`Ctrl+b d`, `Ctrl+b %`, `Ctrl+b z`, `Ctrl+b [`"
    - '`Ctrl+b d`, `Ctrl+b "`, `Ctrl+b z`, `Ctrl+b ]`'
    - "`Ctrl+b x`, `Ctrl+b %`, `Ctrl+b f`, `Ctrl+b [`"
    - "`Ctrl+b q`, `Ctrl+b |`, `Ctrl+b z`, `Ctrl+b s`"
  correct: 0
- source: de2ac17e265a
  question: Robot bringup must run after every boot, and during development you want to watch its logs live. How do you combine systemd and tmux?
  options:
    - Start bringup inside a tmux session from `.bashrc`, and use systemd only to restart tmux on crash
    - Run bringup as a systemd service, and watch `journalctl -u karmel-bringup -f` in a tmux window on the Pi
    - Run bringup in tmux from a cron `@reboot` entry, and attach with `tmux a` to watch the logs
    - Run bringup as a systemd service with `StandardOutput=tty`, and attach tmux to that tty
  correct: 1
- source: c4c16812d612
  question: What does `tmux ls` print when there are no sessions, and what is its exit code?
  options:
    - Nothing at all, exit code 0
    - "`no sessions`, exit code 0"
    - "`no server running on /tmp/tmux-<uid>/default`, exit code 1"
    - "`error connecting to /tmp/tmux-<uid>/default`, exit code 2"
  correct: 2
- source: 9da5c8a38d61
  question: You SSH from a tmux session on your laptop into the Pi and start tmux there. `Ctrl+b c` creates a window on the laptop. Why, and how do you reach the Pi's tmux?
  options:
    - The inner tmux has a different prefix by default; press `Ctrl+a c` for the Pi
    - SSH filters control keys; start SSH with `-t` so keys reach the Pi's tmux
    - The outer tmux intercepts the prefix; press `Ctrl+b Ctrl+b c` to send it to the inner tmux
    - The Pi's tmux is detached; run `tmux attach` there first, then `Ctrl+b c` works
  correct: 2
