- source: 22b30e19b946
  question: The webcam works in Cheese on the desktop, but your ROS camera node started over SSH gets `Permission denied` on `/dev/video0`. Why?
  options:
    - The desktop session gets a `uaccess` ACL; SSH doesn't, so join `video`
    - Cheese holds the camera open, so no other process can open it
    - SSH sessions run with a different kernel that lacks the camera driver
    - The ROS node needs `sudo` because cameras are always root-only
  correct: 0
- source: b62be6ec6fef
  question: In a udev rule, what's the difference between `ATTRS{idVendor}=="2e8a"` and `ATTRS{idVendor}="2e8a"`?
  options:
    - "`==` assigns; `=` matches, which is the normal form for `ATTRS`"
    - They are equivalent; udev accepts both forms for `ATTRS`
    - "`==` matches; `=` assigns, which is invalid for `ATTRS`"
    - "`==` is case-sensitive; `=` ignores case"
  correct: 2
