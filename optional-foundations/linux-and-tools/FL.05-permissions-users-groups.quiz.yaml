- source: e198e47b3f55
  question: "Decode `crw-rw---- 1 root video 81, 0 /dev/video0`: who can read frames from the camera?"
  options:
    - Everyone, since the device is readable by others
    - Only root, since the owner is root
    - Only members of `video`, not root
    - Root and members of `video` (in their current session)
  correct: 3
- source: e3b21b9cd002
  question: You ran `sudo usermod -aG dialout $USER` five minutes ago in this SSH session, and the driver still fails. What do you do?
  options:
    - Log out and reconnect; group membership is set at login
    - Run the command again with `-G` instead of `-aG`
    - Restart the driver with `sudo` so it inherits the group
    - Wait for the group cache to refresh after about ten minutes
  correct: 0
- source: ff897d379a15
  question: On Ubuntu 24.04 on the Pi 5, which group gives access to `/dev/gpiochip*` and `/dev/i2c-1`, and how do you check on an unknown system?
  options:
    - "`gpio`; `groups` lists every group the device needs"
    - "`dialout`; `ls -l /dev/gpiochip* /dev/i2c-*` shows the group"
    - "`i2c`; `lsmod` shows which group owns each driver"
    - "`video`; `getent group video` shows the device list"
  correct: 1
- source: b31408d90cab
  question: What's wrong with `sudo echo '...' > /etc/udev/rules.d/99-karmel.rules`?
  options:
    - "`echo` cannot write multi-character rules; use `printf` instead"
    - udev rules must be created with `udevadm`, not written as files
    - Your unprivileged shell does the `>` before `sudo` runs; use `| sudo tee`
    - "`sudo` strips the quotes, so the rule is written without them"
  correct: 2
