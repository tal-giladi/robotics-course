  question: What does Git store in history for a file tracked by LFS?
  options:
    - A compressed delta of the file against its previous version
    - The full file content, plus a flag telling clones to skip downloading it
    - A symbolic link to the file on the LFS server's filesystem
    - A small pointer file with the spec version, SHA-256 `oid` and `size`
  correct: 3
