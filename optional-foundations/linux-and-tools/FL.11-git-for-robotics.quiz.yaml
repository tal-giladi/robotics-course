  question: A teammate's clone crashes loading `detector.onnx` with "invalid protobuf", and the file is 133 bytes. What is wrong?
  options:
    - The model was exported with a newer ONNX opset than their runtime supports
    - They have the LFS pointer, not the model; run `git lfs install && git lfs pull`
    - Git converted line endings in the binary file; add `*.onnx binary` to `.gitattributes`
    - The file was truncated by a shallow clone; re-clone with `--depth 0`
