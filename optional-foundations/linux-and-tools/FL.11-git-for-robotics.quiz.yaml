  question: You added `*.onnx` to LFS tracking today, but `detector.onnx` was committed normally last month. Is the repository fixed?
  options:
    - Yes; LFS converts the old blob into a pointer the next time you push
    - Yes; `git gc` removes the old blob once the file is tracked by LFS
    - No; old commits keep the full blob, so rewrite with `git lfs migrate import`
    - No; you must delete the file and commit it again so that LFS picks it up
  correct: 2
