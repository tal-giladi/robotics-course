  question: "`uname -m` prints `aarch64` and `dpkg --print-architecture` prints `arm64`. Is this machine inconsistent?"
  options:
    - Yes; the kernel is 64-bit but the packages are 32-bit ARM
    - Yes; the machine is running an x86 emulator on ARM
    - No; `aarch64` is a newer ARM version that runs `arm64` packages
    - No; they are the kernel's and Debian's names for the same 64-bit ARM
  correct: 3
- source: eb5c73bb438e
  question: "`docker run --rm ubuntu:22.04 uname -r` on a 24.04 host prints the host's kernel version. Why?"
  options:
    - The image is misconfigured and falls back to the host's version string
    - Containers share the host kernel; the image only provides the userland
    - Docker replaces 22.04 images with 24.04 when the host is newer
    - "`uname -r` reads from a file that Docker copies from the host"
  correct: 1
