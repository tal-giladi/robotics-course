- source: cd413fcfeda1
  question: What does `a = np.full((2, 2), 250, dtype=np.uint8); print(a + 10, cv2.add(a, np.full_like(a, 10)))` print?
  options:
    - "`a + 10` is all 255s (numpy saturates); `cv2.add` is all 4s (OpenCV wraps)"
    - Both are all 260s, because the result is promoted to a wider integer type
    - "`a + 10` is all 4s (numpy wraps); `cv2.add` is all 255s (OpenCV saturates)"
    - Both are all 255s, because uint8 arithmetic always saturates in both libraries
  correct: 2
- source: 1c2d41fbe4f0
  question: Why does halving the light change an orange pixel's V but not its H or S (ideally)?
  options:
    - H and S are stored as angles, which are unaffected by brightness, while V is a linear sum of R, G, B
    - R, G, B scale by the same factor; V = max scales, while S and H are ratios where it cancels
    - The camera's auto white balance restores H and S after every frame, but cannot restore V
    - Halving the light only reduces the blue channel, which affects V but leaves the hue and saturation
  correct: 1
- source: e1bbfa037526
  question: Why is a red object harder to threshold in OpenCV HSV than an orange one?
  options:
    - Red sits at the hue wrap-around (≈ 0–5 and ≈ 170–179), so you need two ORed masks or a hue shift
    - Red has the lowest saturation of all hues, so it falls below typical S thresholds in normal light
    - OpenCV's hue range stops at 150, so red hues are clipped and cannot be selected with `inRange`
    - Red light is absorbed by the camera's IR filter, so red objects appear dark and have unreliable V
  correct: 0
