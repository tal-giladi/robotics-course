- source: 0f4e7cfa52b4
  question: In terms of the eigenvalues of $M$, why is a corner a better feature than a point on an edge?
  options:
    - At a corner both eigenvalues are small, so noise has little effect; on an edge both are large and noise dominates.
    - At a corner one eigenvalue is large, fixing position in 1D; on an edge both are large, which makes it ambiguous.
    - At a corner both eigenvalues are large, fixing position in 2D; on an edge only one is, so position along it is undetermined.
    - At a corner the eigenvalues are equal, so it is rotation invariant; on an edge they differ, so rotation breaks matching.
  correct: 2
