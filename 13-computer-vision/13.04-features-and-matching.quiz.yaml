  question: You match ORB features between frames while karmel drives 1 m down a corridor, and fit a homography. What goes wrong?
  options:
    - "Motion blur: ORB finds no features during forward motion, so RANSAC returns no homography at all"
    - "Scale change: ORB is not scale-invariant, so all matches fail beyond 10 cm of forward motion"
    - "Parallax: near and far walls move differently, so one H fits only one depth layer; use the essential matrix or depth"
    - "Nothing: forward translation in a corridor is exactly described by a homography with K"
