- source: 44db6a471a36
  question: In the checkerboard experiment RANSAC returned a homography with 21 inliers. Which checks would flag it as wrong?
  options:
    - High reprojection error on inliers, too few iterations run, and the ratio test threshold set above 0.75
    - Low inlier ratio (21/120 = 18%), implied rotation inconsistent with odometry/IMU, inliers forming a small regular grid
    - Inlier ratio above 90%, a determinant of exactly 1, and inliers spread evenly across the whole image
    - Fewer than 4 inliers, a singular matrix, and the homography mapping the image outside its own bounds
  correct: 1
- source: 2c148140eb86
  question: Why is the ratio test placed before RANSAC rather than after?
  options:
    - It needs the homography from RANSAC's first iteration to compute the distance ratio
    - It is cheaper after RANSAC, but placing it first avoids a known bug in `cv2.findHomography`
    - It removes geometrically inconsistent matches that RANSAC would otherwise keep as inliers
    - It raises RANSAC's inlier fraction $w$, and required iterations fall steeply with $w^4$
  correct: 3
