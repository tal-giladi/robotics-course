  question: Why does the naive detector choose the box, even though the ball is orange and the box is brown?
  options:
    - The box reflects more light, so its V is higher and it wins the brightness-based ranking of contours
    - The ball's specular highlight splits its blob in two, so each half is smaller than the box's single blob
    - Both have hue 13; the naive range starts at S = 50, so both pass, and "largest contour" picks the bigger box
    - The box is closer to the camera, so its hue shifts toward orange and it passes a tighter hue range
  correct: 2
