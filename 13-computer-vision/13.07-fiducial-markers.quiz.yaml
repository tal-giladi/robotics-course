# Multiple-choice version of the quiz in 13.07-fiducial-markers.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 034c741aa0d0
  question: Why does a marker need a known physical size to give a full pose, while its ID and 2D corners don't?
  options:
    - The ID is encoded relative to the tag size, so the decoder needs the size to read the bits correctly
    - Projection divides by depth, so a tag twice as large and far looks identical; size fixes scale and thus translation
    - Without size, orientation is ambiguous, although position can be recovered from the corners alone
    - The size is needed to undistort the corners, since distortion scales with the physical size of the tag
  correct: 1
