- source: 0a673e38c5e2
  question: The tag pose's reprojection error is 40 px. What do you do?
  options:
    - Use it but average it with the previous 10 poses, since 40 px is normal noise for four corners
    - Don't use it; check corner order, $K$/dist or the detection, try another solver, or drop the frame
    - Use it; reprojection error only matters for calibration, not for pose estimation of a single tag
    - Double the tag size in the code, since a 40 px error means the size is off by a factor of two
  correct: 1
