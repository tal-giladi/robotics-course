- source: 93139c937136
  question: A tag at 2 m viewed head-on vs. at 2 m viewed at 40°. Which has better rotation accuracy, and why?
  options:
    - "The head-on view: its corners are evenly spaced, so the solver has the most symmetric constraints"
    - "The head-on view: at 40° the tag appears smaller, so corner noise dominates the rotation estimate"
    - "The 40° view: head-on, two mirror-tilted poses give nearly identical corners; foreshortening separates them"
    - "Both are equal: rotation accuracy depends only on distance and tag size, not on viewing angle"
  correct: 2
