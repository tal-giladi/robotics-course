  question: "Code works on your laptop but fails on the Pi with `AttributeError: module 'cv2.aruco' has no attribute 'ArucoDetector'`. Why?"
  options:
    - The Pi's OpenCV was built without contrib, so the whole `cv2.aruco` module is missing
