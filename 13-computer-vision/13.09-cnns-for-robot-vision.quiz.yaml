# Multiple-choice version of the quiz in 13.09-cnns-for-robot-vision.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: c483c6e9d8b8
  question: What does a torchvision ImageNet classifier expect of its input tensor?
  options:
    - BGR order, 256 × 256 (resize only), [0, 255] uint8 values without normalization, float32 (3, H, W)
    - RGB order, any size, [0, 1] scaling only with no per-channel normalization, float32 (N, H, W, 3)
    - BGR order, 224 × 224 (resize 256 + center crop), [-1, 1] scaling, float16 (N, 3, H, W)
    - RGB order, 224 × 224 (resize 256 + center crop), [0, 1] then ImageNet mean/std normalization, float32 (N, 3, H, W)
  correct: 3
- source: 1a783e9b217e
  question: Logits are $(3.0, 1.0, 1.0)$. What is the softmax, and what happens if you add 5 to all three?
  options:
    - $(0.600, 0.200, 0.200)$; unchanged, since softmax only encodes differences
    - $(0.787, 0.107, 0.107)$; the top class approaches 1.0 as all logits grow
    - $(0.787, 0.107, 0.107)$; all three move toward 0.333 as logits grow
    - $(0.787, 0.107, 0.107)$; unchanged, since softmax only encodes differences
  correct: 3
