- source: 1e721b651296
  question: Why does a bottle 40 px tall in a 640×480 frame often go undetected by a classifier run on the whole frame?
  options:
    - Resize and crop shrink it to ~21 px, under one cell of the 7×7 feature map, so the rest of the image dominates
    - ImageNet has no bottle class, so the classifier can only label the scene around the bottle
    - Center cropping always removes the outer 30% of the frame, where the bottle usually sits
    - Normalization clips small bright objects to zero, so thin objects vanish before the first layer
  correct: 0
- source: 8546e4a1fef7
  question: When is a classifier (not a detector) the right tool on karmel?
  options:
    - When you need to locate several objects in a frame, e.g. all bottles on the kitchen counter
    - When the object is small in the full frame, e.g. a bottle 40 px tall at the far end of the room
    - When the crop is already known, e.g. the region between the gripper jaws, or refining a detector's box
    - When you need the object's position in the map, e.g. finding the charging dock from far away
  correct: 2
