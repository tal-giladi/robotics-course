- source: 63fe6d854296
  question: A stereo camera has $f = 600$ px and $B = 0.05$ m. What is the disparity at 1.5 m, and the depth error for 0.25 px disparity error?
  options:
    - 20 px; about 6 mm
    - 45 px; about 19 mm
    - 2 px; about 190 mm
    - 20 px; about 19 mm
  correct: 3
- source: 999411c007ea
  question: Why does doubling the distance quadruple the stereo depth error?
  options:
    - "$\\partial Z/\\partial d = -Z/(fB)$: disparity halves twice, once per camera, giving a factor of four"
    - Matching noise doubles with distance and the baseline effectively halves, together a factor of four
    - "$\\partial Z/\\partial d = -Z^2/(fB)$: disparity halves, so a fixed pixel error grows as $Z^2$"
    - $Z = fB \cdot d$, so the error grows with $d^2$, and disparity doubles when distance doubles
  correct: 2
