    - Publish the debug image at 1 Hz with a timer; `compressed` always encodes but drops frames when no one listens
    - Publish the debug image on a BEST_EFFORT topic; `compressed` switches to lossless when RViz subscribes
    - Draw boxes in RViz itself from the detections; `compressed` does the same by sending only box coordinates
