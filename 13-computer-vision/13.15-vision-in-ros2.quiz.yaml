  question: You subscribe to `/camera/image_raw` with RELIABLE QoS and get nothing. You add `time.sleep(1.0)` before creating the subscription. What happens?
  options:
    - "Nothing changes: RELIABLE never matches a BEST_EFFORT publisher; `ros2 topic info -v` shows it"
    - "It works: the sleep lets discovery finish before the subscription is created"
    - It works for a while, then stops again once the publisher's queue fills up
    - The node crashes, because sleeping before spinning blocks the ROS executor
  correct: 0
- source: 76c27e45e58c
  question: Why must a detection carry the image's `header.stamp` rather than the inference finish time?
  options:
    - ROS 2 rejects messages whose stamp is later than the current time, so finish times would be dropped
    - The inference finish time is always zero on the Pi, because the clock is not synchronized to the camera
    - Latency varies and the consumer can't know it; the capture time is when the geometry was true and what TF indexes
    - The capture stamp is smaller, so the message uses fewer bytes when serialized over the network
  correct: 2
