- source: 4fca25ef4895
  question: A camera publishes `rgb8`; your node calls `imgmsg_to_cv2(msg, desired_encoding="passthrough")`, then `cv2.cvtColor(img, cv2.COLOR_BGR2HSV)`. What is wrong?
  options:
    - Red and blue are swapped silently, so every hue is wrong; use `desired_encoding="bgr8"`
    - '`passthrough` returns grayscale, so saturation is always zero; use `desired_encoding="rgb8"`'
    - "`cvtColor` raises an error on `rgb8` data, so the node crashes; use `COLOR_RGB2GRAY` first"
    - "Nothing is wrong: `passthrough` always converts to BGR, which is what OpenCV expects"
  correct: 0
- source: 083cc7673216
  question: Your detector takes 200 ms per frame on a 15 Hz camera, subscribed with depth 8. What throughput and detection age do you expect?
  options:
    - 15 Hz throughput, about 200 ms age (the queue absorbs the difference)
    - 5 Hz throughput, about 1.6 s age (depth 1 would cut age to ~200 ms)
    - 5 Hz throughput, about 200 ms age (the queue only affects throughput)
    - 1.9 Hz throughput, about 1.6 s age (the queue slows the detector)
  correct: 1
- source: f16a93102063
  question: Why does the same table show 6 Hz of detections for depth 1, depth 5 and depth 10?
  options:
    - Depth is ignored for BEST_EFFORT subscriptions, so all three settings behave identically
    - The camera itself drops to 6 Hz under load, so the queue depth never fills up at all
    - cv_bridge limits conversions to 6 Hz, which is the real bottleneck independent of the queue
    - The queue only chooses which frames are processed; throughput is $\min(f, 1/L)$ either way
  correct: 3
- source: 48b7a4dc4799
  question: karmel streams 640×480 `bgr8` plus aligned `16UC1` depth, both at 15 Hz. What is the byte rate, and what is your first move?
  options:
    - About 14 MB/s (110 Mbit/s); switch middleware to a zero-copy transport first
    - About 23 MB/s (184 Mbit/s); switch middleware to a zero-copy transport first
    - About 23 MB/s (184 Mbit/s); reduce resolution and compress what leaves the robot
    - About 2.3 MB/s (18 Mbit/s); no action needed, since Wi-Fi handles that easily
  correct: 2
