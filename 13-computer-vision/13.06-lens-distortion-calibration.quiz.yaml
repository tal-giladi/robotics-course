# Multiple-choice version of the quiz in 13.06-lens-distortion-calibration.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 20e92e21abae
  question: What is the difference between barrel and pincushion distortion, and what sign does $k_1$ usually have for a wide-angle webcam?
  options:
    - "Barrel pushes points outward (lines bow inward), pincushion pulls them in; webcams: $k_1 > 0$"
    - "Barrel pulls points toward the center (lines bow outward), pincushion pushes them out; webcams: $k_1 < 0$"
    - "Barrel pulls points toward the center (lines bow outward), pincushion pushes them out; webcams: $k_1 > 0$"
    - "Barrel affects only the image corners, pincushion only the center; webcams: $k_1 = 0$ after focusing"
  correct: 1
- source: 7f471e0b6a4a
  question: Why does calibration need tilted views and views reaching the image corners?
  options:
    - Tilted views reduce motion blur on the board, and corner views give more corners per frame to average.
    - Tilted views measure the square size, and corner views measure the principal point, which is always at a corner.
    - Frontal views can't separate focal length from distance, and distortion is strongest at the corners, so high-order terms need them.
    - Frontal views overfit the distortion model, and corner views are only needed for cameras wider than 120°.
  correct: 2
- source: 23022c57a0cd
  question: "Calibration A: RMS 0.08 px from 4 frontal views. B: RMS 0.35 px from 25 varied views of a real webcam. Which do you trust?"
  options:
    - "A: a lower RMS always means more accurate parameters, and 4 views are enough for a simple webcam"
    - "A: frontal views avoid perspective error, so their RMS is more meaningful than tilted views'"
    - "Neither: any RMS above 0.1 px means the calibration failed, and below 0.1 px means it overfit"
    - "B: RMS measures fit, not correctness; A's views don't constrain the parameters, and 0.35 px is normal for real corners"
  correct: 3
