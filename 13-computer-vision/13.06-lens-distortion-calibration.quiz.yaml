- source: 96a0fc413073
  question: You calibrated with square size 20 mm, but the real squares are 25 mm. Your tag distances in 13.07 use the correct tag size. Are they wrong?
  options:
    - "No: $K$ and distortion don't depend on square size; only calibration's own board poses are 20% too small"
    - "Yes: $f$ is scaled by 20/25, so every tag distance comes out 20% too small"
    - "Yes: $f$ is scaled by 25/20, so every tag distance comes out 25% too large"
    - "No: but the distortion coefficients are wrong, so tags near the corners will be off by 20%"
  correct: 0
- source: 431e5fc11bfb
  question: The ROS calibrator prints "Waiting for service camera/set_camera_info" and stops. What are two fixes?
  options:
    - Restart the camera driver with `use_sim_time:=true`, or run the calibrator with `sudo` to access the service
    - Install `camera_info_manager` on the Pi, or rename the image topic to `camera/image_raw` in the driver
    - Remap the service to the driver's real name, or pass `--no-service-check` and point `camera_info_url` at `ost.yaml`
    - Lower the calibrator's `--size` to 7x5, or print a larger checkerboard so detection succeeds
  correct: 2
- source: cb07550fa5d5
  question: You undistort frames with `alpha=1` and then compute ball distances with the calibrated $K$. What's wrong?
  options:
    - "Nothing: undistortion only moves pixels, so the original $K$ stays valid on the new image"
    - "`alpha=1` crops the image to valid pixels only, so the ball may fall outside the frame"
    - The undistorted image corresponds to `newK`, with different $f$ and principal point; use `newK`
    - The distortion coefficients must be applied a second time, since undistortion is only approximate
  correct: 2
