- source: 79236c52e883
  question: You detect at 320 × 240 for speed but keep $f_x = 467.7$, $c_x = 320$ (full-resolution $K$). What happens to ground-plane distances?
  options:
    - "Nothing: $K$ is resolution-independent, so ground-plane distances stay correct at any image size"
    - They break; $K$ must scale with the image, since even with the right $c_y$ distances come out 2× too large
    - They come out 2× too small, because each pixel now covers twice the angle but $f$ assumes half
    - Only lateral positions break, because $c_x$ is wrong; forward distances depend on $f_y$ alone
  correct: 1
- source: 113c612ac9fb
  question: The camera is pitched 2° down but your code assumes it's level. Ball at 3 m. Roughly what distance does the code report?
  options:
    - About 2.9 m, because 2° changes the distance by only a few percent at any range
    - About 6 m, because the pitch moves the ball's row toward the horizon, doubling the distance
    - About 3 m, because pitch only affects lateral position, not forward distance on the floor
    - About 1.6 m, because 2° shifts rows by 16.3 px, nearly all of the 17.7 px between horizon and ball
  correct: 3
