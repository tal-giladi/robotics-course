- source: af3ac4fde8dd
  question: Why can't a single pixel give you a 3D point, and how can a robot get the missing number?
  options:
    - Pixels store only color, not position; depth comes from the camera's autofocus, the exposure time or the pixel's brightness.
    - Lens distortion scrambles the ray; depth comes from undistorting the image, then reading $Z$ directly from $K$.
    - All points on a ray project to one pixel; depth comes from a depth sensor, stereo, known object size or the floor plane.
    - A pixel covers too large an area; depth comes from upsampling the image until each pixel covers one point.
  correct: 2
