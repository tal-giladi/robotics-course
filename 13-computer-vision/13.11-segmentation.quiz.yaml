  question: A mask has covariance eigenvalues 900 and 100 px². What is the elongation, and the size of a uniform rectangle with these moments?
  options:
    - Elongation 9; about 104 × 34.6 px
    - Elongation 3; about 30 × 10 px
    - Elongation 3; about 60 × 20 px
    - Elongation 3; about 104 × 34.6 px
