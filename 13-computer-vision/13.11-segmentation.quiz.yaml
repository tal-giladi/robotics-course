- source: 819850e6174d
  question: Which segmentation type fits "which part of the floor is free?" and "pick up the left one of two touching cups"?
  options:
    - "Floor: instance (each tile is an object). Cups: semantic (one class label is enough to pick one)."
    - "Floor: promptable (click on the floor). Cups: semantic (the left cup has its own class)."
    - "Floor: semantic (every pixel needs a class). Cups: instance or promptable (semantic would merge them)."
    - "Floor: semantic (every pixel needs a class). Cups: semantic too, since touching cups stay separate."
  correct: 2
- source: fa22f8f23632
  question: Why does SAM return three masks for a single click, and how should a robot choose?
  options:
    - A click is ambiguous (part, object, group); prefer a box prompt, then highest predicted IoU with sanity checks
    - SAM runs three model sizes in parallel; pick the mask from the largest model since it is the most accurate
    - SAM samples three random seeds; average the three masks pixel-wise to get the final object mask
    - A click gives foreground, background and edge masks; use the foreground mask and discard the others
  correct: 0
