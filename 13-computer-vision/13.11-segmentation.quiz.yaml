- source: a0bd5d18d0b7
  question: A bottle's box fill ratio is 0.35. What does that tell you, and what goes wrong with box centre and box depth?
  options:
    - It is partly occluded; the box centre is still correct, but depth must be read from the top third of the box
    - It is very close to the camera; the box centre is fine, but depth saturates, so reduce the exposure time
    - It is a false positive; any box with fill ratio below 0.5 should be discarded before grasp planning
    - It is diagonal or thin; the box centre may miss it and box depth is dominated by background, so use mask centroid and depth
  correct: 3
