  question: You prompt SAM with a box and get a mask 3× the box area. Likely cause and fix?
  options:
    - It chose the "whole" candidate, leaking into a neighbour; pick a smaller one or clip to the box
    - The box was given in normalized coordinates; convert it to pixels and re-run the same prompt
    - The image resolution is too low; upsample the frame 3× so the mask matches the box size
    - SAM always over-segments box prompts; divide the mask area by three before using it
