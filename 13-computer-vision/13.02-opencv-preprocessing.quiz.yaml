  question: Which filter would you use for isolated white and black dots (dead pixels, transmission glitches), and why?
  options:
    - "A Gaussian filter: it weights the center pixel most, so isolated outliers are removed without blurring edges"
    - "A box filter: it averages all neighbours equally, which cancels isolated outliers completely"
    - "A bilateral filter: it ignores pixels with very different values, so it is the only filter that removes dots"
    - "A median filter: isolated outliers don't change a neighbourhood's median, while linear filters spread them"
  correct: 3
