  question: Why did Otsu mark 100% of the dim left third as "dark" in the gradient scene?
  options:
    - It picks one global threshold; with a strong gradient the best split is dim vs. bright half, so the threshold exceeds every dim pixel
    - It picks a separate threshold per region, and the dim region's threshold was computed from too few pixels to be reliable
