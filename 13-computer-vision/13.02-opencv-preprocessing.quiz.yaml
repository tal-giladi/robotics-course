  question: You apply `cv2.blur(mask, (5, 5))` to a binary mask and then `cv2.findContours`. What goes wrong?
  options:
    - The blur removes all foreground pixels below 128, so small blobs vanish before contours are found
    - "`findContours` rejects non-binary images and raises an error, so no contours are returned"
    - Intermediate values count as foreground, so blobs grow by the kernel radius and nearby blobs merge
    - Blob edges become jagged, so every contour's area roughly doubles while blobs stay separate
  correct: 2
- source: d6d9317f56ce
  question: What is the difference between opening and closing, with a robot example?
  options:
    - Opening fills small black holes (the highlight in the ball's blob); closing removes small white regions (speckle in a mask).
    - Opening removes small white regions (speckle in a mask); closing fills small black holes (the highlight in the ball's blob).
    - Opening sharpens edges before thresholding; closing blurs edges so contours become smoother and rounder.
    - Opening is dilation followed by erosion; closing is erosion followed by dilation, and both remove speckle equally.
  correct: 1
- source: 92aed5315804
  question: A 640 × 480 pipeline takes 12 ms on the Pi. Roughly how long at 320 × 240, and what is the risk?
  options:
    - About 6 ms; colors become less saturated at lower resolution, so HSV thresholds must be widened
    - About 3 ms; far objects shrink below kernel sizes and thresholds, so recheck minimum detectable distance
    - About 3 ms; there is no real risk, since detection is scale-invariant for contour-based pipelines
    - About 1.5 ms; near objects no longer fit in the frame, so the maximum detectable size drops
  correct: 1
