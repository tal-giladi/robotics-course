- source: 96efd6bfbf5c
  question: You open a mask with an 11 × 11 kernel and a far ball (disc of radius 5 px) disappears. Why, and what fixes it?
  options:
    - Dilation grows the background over the disc; use a larger kernel so the disc survives the closing step
    - Opening fills holes, merging the disc into the background; use closing instead with the same kernel
    - The kernel is even-sized, which shifts the disc off the image; use an odd kernel of the same size
    - Erosion keeps only pixels where the whole kernel fits, which is none; use a 3–5 px kernel or higher resolution
  correct: 3
