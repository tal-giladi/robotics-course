  question: What distinguishes point-to-point from point-to-line ICP, and why does point-to-line do better on LiDAR scans?
  options:
    - Point-to-line uses only normal distances, ignoring along-wall sampling offsets
    - Point-to-line uses twice as many points, averaging out noise
    - Point-to-line skips rotation, which is the noisy part of ICP
    - Point-to-line needs no initial guess, so it avoids local minima
