# Multiple-choice version of the quiz in 11.06-slam-toolbox-simulation.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 77df02c61f67
  question: What does "asynchronous" mean in `online_async`, and what does it cost you?
  options:
    - Scans are queued and processed later; it costs memory
    - Optimization runs on the GPU; it costs determinism
    - Busy optimizer means dropped scans; it costs lost scans under load
    - Map and pose are published separately; it costs TF consistency
  correct: 2
- source: b7ea48314226
  question: slam_toolbox publishes `map → odom`, not `map → base_footprint`. Why, and what would the latter break?
  options:
    - "REP-105: odometry owns the smooth edge; the latter gives two parents and jumpy control"
    - "`base_footprint` is not in the URDF, so the transform could not be built"
    - Publishing `map → base_footprint` would double the TF bandwidth
    - It is an arbitrary slam_toolbox convention with no consequence
  correct: 0
- source: 1a7258743e05
  question: "Turning in place at 0.8 rad/s with `minimum_travel_heading: 0.3` and `minimum_time_interval: 0.5`, how much rotation between keyframes, and what should worry you?"
  options:
    - About 0.3 rad (17.2°); `minimum_travel_distance`
    - About 0.8 rad (45.8°); `map_update_interval`
    - About 0.15 rad (8.6°); the map `resolution`
    - At least 0.4 rad (22.9°); `coarse_search_angle_offset`
  correct: 3
