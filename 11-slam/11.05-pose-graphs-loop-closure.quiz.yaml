  question: What does an edge's information matrix encode, and what happens if you set it to the identity?
  options:
    - The edge's age; identity makes every edge count as equally recent
    - Inverse covariance; identity weights all edges and axes the same
    - The edge's Jacobian; identity linearizes every edge at zero error
    - The robot's velocity; identity assumes it moved at constant speed
  correct: 1
- source: 6a79c08e9bec
  question: Why can one loop closure between the last node and the first correct node 25 in the middle?
  options:
    - It is chained to both ends; least squares spreads the error along
    - slam_toolbox silently adds hidden loop edges to every node
    - The optimizer first resets every node to its odometry value
    - It can't; only the nodes a loop edge touches ever move
  correct: 0
- source: 8cee89cc2ec8
  question: Why does a pose graph need an anchor, and what goes wrong numerically without one?
  options:
    - To set the map resolution; without it the grid is empty
    - To fix the time origin; without it stamps overflow
    - Edges are relative; $H$ has a 3D null space and is singular
    - To bound the edge count; without it memory grows forever
  correct: 2
