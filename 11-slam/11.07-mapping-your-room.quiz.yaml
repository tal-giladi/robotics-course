# question + answer; if the lesson changes, the site flags the question for review.
- source: 66ca3602cfe3
  question: Driving at 0.35 m/s and turning at 1.2 rad/s with a 10 Hz LiDAR, how far apart are consecutive scans, and what matters?
  options:
    - 35 cm and 69°; the distance is the problem
    - 3.5 cm and 6.9°; the angle is the problem, so slow the turns
    - 3.5 cm and 0.69°; neither matters at this rate
    - 0.35 cm and 12°; the distance is the problem
