  question: Why insist on revisiting already-mapped places four times in a flat rather than once at the end?
  options:
    - Each revisit refreshes the timestamps stored in the map
    - slam_toolbox needs at least four loops before it converges
    - Frequent closures keep drift small, so each is easy to find
    - Revisits let the LiDAR recalibrate its range against walls
