- source: 6be46e6f8bc2
  question: Why must the first call to `Odometry.update` only store the counts?
  options:
    - The first reading is always zero, so integrating it does nothing
    - The counts are cumulative from an arbitrary start; integrating them jumps the pose
    - The first telemetry frame is usually corrupted by the serial handshake
    - The wheel radius is not known until the second sample arrives
  correct: 1
