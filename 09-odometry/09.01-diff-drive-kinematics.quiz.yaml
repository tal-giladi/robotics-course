- source: 5e31c8170bcd
  question: The left wheel is blocked and doesn't turn, while the right wheel keeps turning forward. What does the robot do, and where is the ICC?
  options:
    - It spins in place; the ICC is at base_link
    - It pivots clockwise; the ICC is at the right wheel
    - It drives straight; the ICC is at infinity
    - It pivots counter-clockwise; the ICC is at the left wheel
