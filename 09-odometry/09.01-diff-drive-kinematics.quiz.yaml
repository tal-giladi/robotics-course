- source: 79005085902e
  question: Wheels (5, 5) rad/s give $v = 0.225$ m/s, $\omega = 0$, but (−5, 5) give $v = 0$, $\omega = 4.5$ rad/s. What is wrong?
  options:
    - "Nothing: 4.5 rad/s is the correct spin rate for karmel"
