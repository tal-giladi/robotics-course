# Multiple-choice version of the quiz in 09.01-diff-drive-kinematics.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 831385d64323
  question: Which is the forward kinematics of a differential drive, and which point does $v$ refer to?
  options:
    - $v = v_R + v_L$, $\omega = (v_R - v_L)/(2L)$; $v$ is the left wheel's speed
    - $v = (v_R + v_L)/2$, $\omega = (v_R - v_L)/L$; $v$ is base_link, between the wheels
    - $v = (v_R + v_L)/2$, $\omega = (v_L - v_R)/L$; $v$ is the robot's centre of mass
    - $v = (v_R - v_L)/2$, $\omega = (v_R + v_L)/L$; $v$ is the caster wheel's point
  correct: 1
