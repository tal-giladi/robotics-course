- source: 4aa65141dfcb
  question: Why can't karmel move 10 cm straight to its left, and how does it get there anyway?
  options:
    - Its motors are too weak sideways; it pushes harder on one wheel
    - Its caster blocks sideways motion; it lifts the caster briefly
    - Its wheels roll only forward (non-holonomic); it turns, drives, turns back
    - Its encoders cannot measure sideways motion; it uses the IMU instead
  correct: 2
- source: 13c2e7fa3f39
  question: Odometry uses $L = 0.200$ m but the effective wheelbase is 0.190 m. The robot really turns 90°. What does odometry report?
  options:
    - 94.7°, over-reporting by about 5%
    - 90°, since the wheelbase cancels out
    - 85.5°, under-reporting by 5%
    - 81°, under-reporting by 10%
