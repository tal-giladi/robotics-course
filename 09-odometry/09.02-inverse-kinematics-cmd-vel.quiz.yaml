- source: 04af641156ea
  question: Which is the inverse kinematics for $\omega_L$ and $\omega_R$?
  options:
    - $\omega_L = (v + \omega L/2)/r$, $\omega_R = (v - \omega L/2)/r$
    - $\omega_L = (v - \omega L)/r$, $\omega_R = (v + \omega L)/r$
    - $\omega_L = r(v - \omega L/2)$, $\omega_R = r(v + \omega L/2)$
    - $\omega_L = (v - \omega L/2)/r$, $\omega_R = (v + \omega L/2)/r$
  correct: 3
