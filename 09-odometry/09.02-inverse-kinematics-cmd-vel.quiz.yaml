  question: Why does multiplying both wheel speeds by the same factor keep the robot on the same path?
  options:
    - The turning radius depends only on the ratio of the wheel speeds
    - The controller normalises wheel speeds before applying them
    - Faster wheels slip more, which exactly cancels the extra speed
    - The path depends only on the sum of the wheel speeds
  correct: 0
