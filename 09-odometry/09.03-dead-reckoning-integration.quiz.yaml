# Multiple-choice version of the quiz in 09.03-dead-reckoning-integration.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 2480264cdd46
  question: Which is the midpoint (RK2) update for $x$ and $y$?
  options:
    - $x \mathrel{+}= \Delta s\cos\theta$, $y \mathrel{+}= \Delta s\sin\theta$, then $\theta \mathrel{+}= \Delta\theta$
    - $x \mathrel{+}= \Delta s\cos(\theta + \Delta\theta)$, $y \mathrel{+}= \Delta s\sin(\theta + \Delta\theta)$, then $\theta \mathrel{+}= \Delta\theta$
    - $x \mathrel{+}= \Delta s\cos(\theta + \Delta\theta/2)$, $y \mathrel{+}= \Delta s\sin(\theta + \Delta\theta/2)$, then $\theta \mathrel{+}= \Delta\theta$
    - $x \mathrel{+}= \Delta s\sin(\theta + \Delta\theta/2)$, $y \mathrel{+}= \Delta s\cos(\theta + \Delta\theta/2)$, then $\theta \mathrel{+}= \Delta\theta$
  correct: 2
- source: 6af5f4bcf57b
  question: Why does halving the time step halve Euler's error over a fixed trajectory, when each step's error is $\propto \Delta t^2$?
  options:
    - Round-off error grows as the steps shrink, cancelling half the gain
    - $T/\Delta t$ steps of $\Delta t^2$ error each sum to $\propto T\,\Delta t$
    - Euler's per-step error is actually $\propto \Delta t$, not $\Delta t^2$
    - Errors of successive steps cancel in pairs, halving the total
  correct: 1
- source: 41232d99aeb1
  question: A robot drives $\Delta s = 0.2$ m with $\Delta\theta = 1.0$ rad in one sample. How much shorter is the exact displacement than the midpoint one?
  options:
