- source: 54b124e6c787
  question: You switch karmel's odometry from Euler to the exact arc and drive a 3 m straight corridor and back. How much does the end-point error change?
  options:
    - It halves, since the exact arc is second order
    - It drops to zero, since the exact arc has no error
    - It grows, since the exact arc amplifies slip
    - "Almost not at all: on straights all methods agree"
  correct: 3
- source: ea103b01705c
  question: Why is the exact arc not exact on a real robot at 5 Hz?
  options:
    - It uses floating-point trigonometry, which is approximate
    - It assumes constant wheel speeds within each 0.2 s sample
    - It ignores the wheelbase, which changes during turns
    - It needs a gyro to be exact, which karmel lacks at 5 Hz
  correct: 1
- source: ac15090e6290
  question: "`exact_step` is correct for turns but returns `(nan, nan, 0.0)` when driving straight. What is the bug and fix?"
  options:
    - "`atan2(0, 0)` is undefined when straight; add a small offset to θ first"
    - The wheel speeds overflow when equal; clamp them before each step
    - $R = v/\omega$ divides by zero; branch to a straight move when $\omega \approx 0$
    - "`cos(0)` is taken in degrees; convert θ to radians before the step"
  correct: 2
