  question: In $\Sigma' = F\Sigma F^{\mathsf T} + GQG^{\mathsf T}$, which entries of $F$ make position uncertainty grow faster than heading uncertainty?
  options:
    - $F_{11}$ and $F_{22}$, the identity terms on $x$ and $y$
    - $F_{33}$, which multiplies the heading variance each step
    - $F_{12}$ and $F_{21}$, which couple $x$ and $y$
    - $F_{13} = -\Delta s\sin\mu$ and $F_{23} = \Delta s\cos\mu$
