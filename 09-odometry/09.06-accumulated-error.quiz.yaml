- source: 8dd9bfaebcc7
  question: Why does a heading error matter more than a distance error of "the same size"?
  options:
    - Heading sensors are noisier than distance sensors on cheap robots
    - A distance error compounds each metre; a heading error acts once
    - A heading error rotates every later metre, so lateral error keeps growing
    - Heading errors add slip, which distance errors never do
  correct: 2
