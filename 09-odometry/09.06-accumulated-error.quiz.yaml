  question: Your EKF trusts odometry far too much on long runs; the odometry pose covariance is a constant diag(0.001, 0.001, …, 0.01). What's wrong?
  options:
    - Constant covariance claims a fixed ±3 cm; grow it, or fuse only velocities
    - The values are too large; shrink them so the EKF trusts the IMU
