- source: e85d83fe2f35
  question: Why can't a 2×2 matrix represent a translation, and how does the homogeneous form fix it?
  options:
    - 2×2 matrices can't be inverted; the extra row makes them invertible.
    - Any matrix maps zero to zero, but a translation moves the origin; appending a constant 1 adds a column that supplies the translation.
    - 2×2 matrices only hold integers; the extra row allows floats.
    - A translation needs three numbers; the extra column stores the angle.
  correct: 1
