  question: A message arrives with orientation (0, 0, 0, 0). What does `Rotation.from_quat` do, and what should your code do?
  options:
    - It returns the identity rotation; accept it as "no rotation".
    - It returns NaNs; replace them with zeros.
    - It normalizes to (0, 0, 0, 1); log a warning and continue.
    - It raises `ValueError`; reject or log it, since the publisher forgot to set w = 1.
