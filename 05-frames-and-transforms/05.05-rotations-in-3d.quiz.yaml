- source: 8a73ea802ef3
  question: In the ROS rpy convention, how is the rotation written, and how is it read?
  options:
    - "$R = R_x(\\text{roll})R_y(\\text{pitch})R_z(\\text{yaw})$: yaw, pitch, roll about fixed axes."
    - "$R = R_z(\\text{yaw})R_y(\\text{pitch})R_x(\\text{roll})$: roll, pitch, yaw about fixed axes, or yaw, pitch, roll about moving axes."
    - "$R = R_y(\\text{pitch})R_z(\\text{yaw})R_x(\\text{roll})$: pitch first, then yaw and roll about fixed axes."
    - "$R = R_z(\\text{yaw})R_y(\\text{pitch})R_x(\\text{roll})$: yaw, pitch, roll about fixed axes only."
  correct: 1
