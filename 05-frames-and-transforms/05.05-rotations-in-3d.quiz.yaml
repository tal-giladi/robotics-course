- source: 6f17959d02ea
  question: Why can't you recover roll and yaw separately at pitch = 90°?
  options:
    - After pitching 90°, the roll axis lines up with the original yaw axis, so only their combination is determined (gimbal lock).
    - At 90° the rotation matrix becomes singular and can't be inverted.
    - Quaternions can't represent a 90° pitch exactly.
    - At 90° the pitch angle itself becomes ambiguous by 180°.
  correct: 0
- source: 3f4db33b4133
  question: '`Rotation.from_euler("xyz", [0, 0, 90]).as_quat()` returns `[0, 0, 0.8509, 0.5253]` instead of `[0, 0, 0.7071, 0.7071]`. Why?'
  options:
    - The order should be `"zyx"` for yaw-only rotations.
    - The angles were read as radians; add `degrees=True` or pass `math.radians(90)`.
    - scipy returns (w, x, y, z), so the order is swapped.
    - The quaternion needs normalizing after conversion.
  correct: 1
