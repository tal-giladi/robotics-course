- source: 91c5f1840c09
  question: Points from the camera appear 0.6 m above the robot, floating in the air. What is the most likely cause?
  options:
    - The camera's depth scale is wrong by a factor of 10.
    - Optical-frame data (z forward) is treated as if in a z-up frame; the frame should be `camera_optical_frame`.
    - The robot's base_link is placed 0.6 m too low.
    - The TF timestamps are 0.6 s behind the camera data.
  correct: 1
- source: 901613af2210
  question: Why does ROS store a tree of transforms instead of every pair of frames?
  options:
    - Trees allow cycles, which let every transform be cross-checked in both directions.
    - Storing every pair would need a separate DDS topic per pair, which discovery can't handle.
    - $n$ frames need only $n-1$ edges; all pairs is $O(n^2)$ and inconsistent when one mount changes.
    - A tree lets each frame have several parents, which gives redundancy if one publisher dies.
  correct: 2
