  question: The robot turns in place from 0° to 90°. Does the bottle's position change in base_link? In map?
  options:
    - Both change, since the robot moved.
    - Neither changes, since the robot didn't translate.
    - It changes in map, but not in base_link.
    - It changes in base_link, but stays the same in map.
