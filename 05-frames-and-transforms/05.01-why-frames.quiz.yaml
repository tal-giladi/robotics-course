- source: dee12fa891ed
  question: Why does each sensor report data in its own frame rather than in base_link?
  options:
    - The sensor doesn't know where it's mounted; the mounting is stored once in the robot description.
    - base_link isn't available until the robot has localized itself in the map.
    - Converting to base_link on the sensor would add too much latency to every reading.
    - ROS 2 forbids drivers from publishing data in any frame other than their own.
  correct: 0
