- source: f289239cb224
  question: '`lookup_transform("map", "camera_optical_frame", stamp)` raises `ExtrapolationException … into the future` on the first try but succeeds 20 ms later. Is the system broken?'
  options:
    - "Yes: the camera clock is ahead of the Pi's clock."
    - "Yes: TF should extrapolate a few ms automatically."
    - "No: the detection is newer than the latest odometry; keep it and retry. Switching to `Time()` would be the real bug."
    - No, but you should switch to `Time()` to avoid the exception.
  correct: 2
