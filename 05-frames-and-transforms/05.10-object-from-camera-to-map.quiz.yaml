# Multiple-choice version of the quiz in 05.10-object-from-camera-to-map.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: a505fcdbbe93
  question: A detector publishes `PointStamped` in `camera_optical_frame` with `point = (0.05, -0.02, 0.60)`. What do those numbers mean physically?
  options:
    - 0.05 m ahead, 0.02 m to the right, 0.60 m above the lens.
    - 0.60 m in front of the lens, 0.05 m to the right of the axis, 0.02 m above it.
    - 0.60 m in front of the lens, 0.05 m to the left of the axis, 0.02 m below it.
    - 0.05 m in front of the lens, 0.02 m below, 0.60 m to the right.
  correct: 1
- source: dd64fd7b2fe1
  question: Why does the bottle's `map` z come out as 0.165 m when it is 0.12 m above `base_link`?
  options:
    - The camera's optical frame adds 0.045 m of lens offset.
    - The map frame's origin is 0.045 m below the floor.
    - TF rounds heights up to the nearest wheel radius.
    - "`base_link` is at axle height, one wheel radius (0.045 m) above the ground: 0.120 + 0.045."
  correct: 3
