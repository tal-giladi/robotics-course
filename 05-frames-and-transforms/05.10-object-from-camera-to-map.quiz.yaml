  question: A detector runs at 5 Hz with 250 ms inference latency. What must it and the consumer do for correct geometry?
  options:
    - Stamp results with the time inference finished; the consumer uses `Time()`.
    - Stamp results with the image's `header.stamp`; the consumer looks up the transform at that stamp, retrying briefly.
