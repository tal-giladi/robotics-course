  question: Is ${}^{a}T_{b}\,{}^{b}T_{c} = {}^{b}T_{c}\,{}^{a}T_{b}$ in 2D?
  options:
    - "Yes: 2D rotations commute, so the products are equal."
    - Yes, as long as both transforms use the same rotation angle.
    - "No: e.g. $(1,0,0°)$ then $(0,0,90°)$ gives $(1,0,90°)$, the other order $(0,1,90°)$."
    - No, because the rotations don't commute in 2D.
