- source: 97a26d46c764
  question: What are the three numbers of a 2D pose, their units, and which direction is positive for the angle?
  options:
    - $x$, $y$ in metres; $\theta$ in degrees, clockwise positive, in $[0, 360)$.
    - $x$, $y$ in metres; $\theta$ in radians from +x, counter-clockwise positive, wrapped to $(-\pi, \pi]$.
    - $x$, $y$ in centimetres; $\theta$ in radians from +y, clockwise positive.
    - $x$, $y$ in metres; $\theta$ in radians from +x, clockwise positive, in $[0, 2\pi)$.
  correct: 1
