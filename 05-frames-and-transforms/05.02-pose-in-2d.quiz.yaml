- source: 1044f7b28f91
  question: Why does `wrap_angle` return $+\pi$ for both $\pi$ and $-\pi$?
  options:
    - Because $-\pi$ can't be represented exactly in floating point.
    - So one heading has exactly one representation in $(-\pi, \pi]$, and equal headings compare equal.
    - Because atan2 never returns negative values.
    - So that turning left is always preferred over turning right.
  correct: 1
- source: 630db4b76217
  question: Odometry heading reads 6285.4 rad. The controller wraps its error and works, but `if abs(theta - wall_heading) < 0.2` never fires. Why?
  options:
    - 6285.4 rad is 1000 turns plus 2.2 rad; the check compares unwrapped values, so wrap θ every step and every difference.
    - The value overflowed a float, so comparisons are meaningless.
    - The wall heading is in degrees while θ is in radians.
    - The tolerance 0.2 is too small for a heading that large.
  correct: 0
- source: cbed538689da
  question: A target is at $(-1.0, 1.0)$ in base_link. What is the heading error, and why don't you need to wrap?
  options:
    - −135°; atan2 in base_link is always negative behind the robot.
    - 45°; the robot's heading in base_link is 45° by convention.
    - "135°: the robot's heading in base_link is 0, and atan2 already returns $(-\\pi, \\pi]$."
    - 135°, but you do need to wrap because it exceeds 90°.
  correct: 2
