  question: A run's plot looks wrong and you want to know what produced it. What do you consult first?
  options:
    - "The run's metadata sidecar: run id, git commit, dirty flag, config hash, release label."
    - The telemetry values themselves, row by row.
    - The Pico firmware's source code.
