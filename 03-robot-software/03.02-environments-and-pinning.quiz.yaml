  question: Why does `labs/requirements.txt` use `>=` rather than `==`, while the Dockerfile pins a base image tag?
  options:
    - "`==` is not supported by `pip` for scientific packages like numpy."
    - The requirements file must keep working on unknown future machines (a floor); the container exists to be reproducible, so it names an exact image.
    - Docker ignores version ranges, so it must be pinned; pip resolves ranges faster.
    - The Dockerfile is only used in CI, where versions never matter.
  correct: 1
