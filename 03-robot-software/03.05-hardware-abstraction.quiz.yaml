  question: Why is `typing.Protocol` a better fit than an ABC for `DifferentialBase` in this course?
  options:
    - Protocols run faster at runtime because they skip method resolution.
    - Structural typing lets sims, fakes, test doubles and wrappers satisfy it without inheriting, and there's no shared implementation to inherit anyway.
    - ABCs can't declare method signatures, while Protocols can.
    - Protocols enforce the methods at import time, while ABCs only check at call time.
