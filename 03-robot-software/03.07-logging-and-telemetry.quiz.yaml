- source: 90506d248692
  question: Your telemetry CSV has both `host_time_s` and `t_s`. Which do you divide tick differences by, and what is the other for?
  options:
    - "`host_time_s` for speed; `t_s` for aligning with other devices."
    - "`t_s` (the Pico's clock) for speed; `host_time_s` for lining up with data from other machines after clock sync."
    - Either one, since they differ by a constant offset.
    - "`host_time_s` for speed; `t_s` only for detecting Pico resets."
  correct: 1
