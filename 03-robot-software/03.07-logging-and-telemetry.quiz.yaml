  question: Across 200 runs you want to know how often the watchdog tripped and what the robot was commanding then. What must your logging have gotten right?
  options:
    - A single giant log file for all runs, with plain-text messages that are easy to read by eye.
    - Machine-readable events, commanded values in each telemetry row, and a stable run identity linking events, telemetry, code and config.
    - Screenshots of the telemetry plots saved after each run, named by date and time.
    - Log compression and rotation, so that all 200 runs fit on the robot's SD card together.
