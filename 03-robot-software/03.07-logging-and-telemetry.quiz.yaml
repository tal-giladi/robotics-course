- source: f68966ee0233
  question: You add `f.flush(); os.fsync(f.fileno())` after each CSV row in a 50 Hz loop on the Pi. What happens?
  options:
    - Nothing noticeable; fsync is fast on modern SD cards.
    - The log file becomes corrupted because of partial writes.
    - Each row costs an SD commit (10–50 ms+), the loop becomes irregular, and the watchdog eventually stops the robot mid-run.
    - The loop runs faster because the buffer never fills.
  correct: 2
- source: eefea91209b9
  question: Why JSON Lines rather than one JSON array for an event log?
  options:
    - Append-only writes, crash-safety (a half line is one bad line) and constant-memory streaming, plus `grep` and `tail -f`.
    - JSON Lines files are smaller because they skip quotes around keys.
    - JSON Lines supports binary data that JSON arrays can't hold.
    - Python's `json` module can only parse one object at a time.
  correct: 0
- source: e46b99a7d6b1
  question: A run's summary says 48.6 Hz with one 0.22 s gap, and the PID looks badly tuned in the plot. What do you do first?
  options:
    - Lower the PID gains until the plot looks smooth.
    - Resample the log to 50 Hz to fill the gap before tuning.
    - Increase the watchdog timeout so the gap can't stop the motors.
    - Find and fix the cause of the gap (blocking call, slow sink, link), re-run, and tune against a clean log.
  correct: 3
