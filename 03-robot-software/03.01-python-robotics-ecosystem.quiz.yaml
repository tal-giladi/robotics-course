- source: 815e72536a46
  question: You need the nearest map point for each of 400 LiDAR points against a 10,000-point map, 10 times per second. Which tool fits?
  options:
    - A NumPy brute-force distance matrix, recomputed per point in a loop.
    - "`scipy.spatial.cKDTree`, built once per map and queried with the whole array: about $O(400 \\log 10{,}000)$."
    - A Python dictionary keyed by rounded coordinates, rebuilt each scan.
    - "`cv2.findContours` on a rasterised map, run per scan."
  correct: 1
- source: 74ada619b466
  question: Why does `isinstance(SimBase(...), DifferentialBase)` return `True` though `SimBase` does not inherit from it?
  options:
    - "`SimBase` is registered with `DifferentialBase.register()` at import time."
    - Python's `isinstance` ignores inheritance for classes defined in the same module.
    - "`DifferentialBase` is an abstract base class that every class inherits implicitly."
    - "`DifferentialBase` is a `@runtime_checkable` `typing.Protocol`; the check is structural, based on the methods present."
  correct: 3
