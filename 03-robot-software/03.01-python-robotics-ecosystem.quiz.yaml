  question: Your 20 Hz obstacle-check loop spends 0.4 ms in a Python loop over 360 beams. Should you vectorize it?
  options:
    - "Yes: 0.4 ms × 20 Hz is 8% of a core, which is too much."
    - "No: it's 8 ms per second, about 0.8% of one core; keep the clear version."
    - "Yes: any Python loop over sensor data should be vectorized."
    - No, but only because NumPy isn't available on the Pi.
