- source: c119a5e61636
  question: After `pip install opencv-python` on the Pi, your ROS 2 node can't find `cv2`. Which is a plausible mechanism?
  options:
    - OpenCV doesn't support ARM, so the install silently did nothing.
    - ROS 2 nodes can only import packages from the ROS workspace's `src` folder.
    - The install went into a venv or `--user` that `ros2 run` (system interpreter) doesn't use, or PEP 668 refused it.
    - The node needs to be rebuilt with `colcon build` after every pip install.
  correct: 2
