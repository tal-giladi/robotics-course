- source: 45428a844b05
  question: After a replug, `SerialBase` reconnects to `/dev/ttyACM0` but `read()` keeps raising `TelemetryTimeoutError`. Which pair of causes is plausible?
  options:
    - Wrong baud rate, or a checksum algorithm mismatch.
    - The Pico came back as `ttyACM1` (a different or stale node), or it enumerated but `main.py` didn't start.
    - The user lost `dialout` membership, or the USB cable is charge-only.
    - The watchdog is too short, or the keep-alive thread is disabled.
  correct: 1
