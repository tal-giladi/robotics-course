- source: 079df77195dc
  question: A colleague proposes rewriting karmel's 50 Hz obstacle-stop loop in C++ "for safety". How do you respond?
  options:
    - "Agree: C++ removes the GIL and garbage collector, which are the main safety risks on the Pi."
    - It buys ~0.3 ms per cycle, costs a week, and doesn't help if the Pi stalls; safety comes from layers, and a guaranteed stop belongs on the Pico.
    - Agree, but only if the loop also moves to 1 kHz so it reacts twenty times faster.
    - "Disagree: C++ can't access the Pi's USB serial port without a kernel driver."
  correct: 1
