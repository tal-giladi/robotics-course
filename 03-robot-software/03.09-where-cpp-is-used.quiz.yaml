  question: How do `SerialBase` (Python) and `KarmelSystem` (C++) get telemetry, and why is each right?
  options:
    - "`SerialBase` uses a background reader thread since callers lack a fixed loop; `KarmelSystem` polls synchronously since the controller manager already schedules `read()`."
    - Both use background threads, since serial reads always block.
    - Both poll synchronously, since threads are unsafe in robotics.
    - "`SerialBase` polls synchronously; `KarmelSystem` uses a thread for real-time safety."
