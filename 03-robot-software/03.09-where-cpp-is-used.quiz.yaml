# Multiple-choice version of the quiz in 03.09-where-cpp-is-used.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: f9dbdfda449b
  question: What does RAII give a robot that `try/finally` does not?
  options:
    - Faster cleanup, because destructors run before the exception is raised.
    - Automatic garbage collection of hardware handles.
    - Thread safety for every resource without locks.
    - "A guarantee in the type itself: the destructor cleans up on every exit path without anyone writing code at each call site."
  correct: 3
- source: 61257e01d2ef
  question: "`controller_manager` runs at 1 kHz. Why can't its loop be Python, when karmel's 50 Hz Pi loop can?"
  options:
    - The 1 ms budget is smaller than CPython's overhead and its GIL/GC pauses (up to 5–10 ms); at 50 Hz the same pauses cost one tick.
    - Python can't call the serial port more than 100 times per second.
    - ROS 2 forbids Python nodes above 100 Hz.
    - Python floats are too imprecise for 1 kHz control.
  correct: 0
- source: bb76a1a202d0
  question: You see `std::optional<Telemetry> parse_telemetry(std::string_view payload)`. What do the two type names tell you?
  options:
    - It never fails, and it copies the payload into the result.
    - It can fail without exceptions or magic values, and it doesn't copy or keep the payload, so the caller owns the bytes.
    - It throws on failure, and it takes ownership of the payload.
    - It returns a pointer that may be null, and it modifies the payload in place.
  correct: 1
- source: 0c973ae3bfb3
  question: You delete the body of `~MotorGuard()` and rebuild with `-Wall -Wextra -Wpedantic`. What happens?
  options:
    - The compiler warns about an empty destructor and refuses to link.
    - The program crashes at exit with a double free.
    - It builds and runs cleanly, just without the final "STOP sent"; nothing warns, and only the Pico's watchdog would save a real robot.
    - The destructor is regenerated by the compiler with the original body.
  correct: 2
- source: f7935303941a
  question: Why must `on_init` in a ros2_control hardware component not touch hardware?
  options:
    - "`on_init` runs in a real-time thread where I/O is forbidden."
    - "`on_init` runs after the controllers start, which is too late to open the port."
    - Hardware access in `on_init` is blocked by ROS 2 security policies.
    - "`on_init` runs whenever the description loads (visualization, tests, CI) with no robot present, so opening the port would fail everywhere."
  correct: 3
