- source: 748833a06eb3
  question: Why does a trapezoidal profile vibrate the arm, and what does a quintic change?
  options:
    - Its acceleration jumps (infinite jerk); a quintic sets $\ddot q = 0$ at both ends, so jerk stays finite
    - Its velocity jumps at the ends; a quintic sets $\dot q = 0$ at both ends, so velocity is continuous
    - Its peak speed is too high; a quintic lowers peak speed, so the move is always faster and smoother
    - Its duration is too short; a quintic stretches the move, which is the only reason vibration drops
  correct: 0
