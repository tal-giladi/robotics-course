- source: c67dd04cc637
  question: Why is a 90° move 2.00 / 2.25 / 2.81 s (trapezoid / cubic / quintic), but a 10° move 0.577 / 0.707 / 0.694 s, with the quintic faster than the cubic?
  options:
    - The quintic needs a minimum duration of 0.69 s, so short moves are rounded up while the cubic's are rounded more
    - Short moves use a triangle profile inside the quintic, but not inside the cubic, which makes it slower
    - "Different limits bind: velocity on the long move (quintic peak higher), acceleration on the short one (quintic peak lower)"
    - Measurement noise dominates at 10°; with more samples the quintic would be slower than the cubic there too
  correct: 2
