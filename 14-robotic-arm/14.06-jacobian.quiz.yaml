- source: c22c56be2e73
  question: Why is damped least squares better, not just safer, than the exact inverse when servos have speed limits?
  options:
    - DLS is exact while the inverse is approximate, so DLS always ends closer to the goal than the inverse
    - The exact answer is unexecutable and saturation mangles its direction; DLS returns the best executable command
    - DLS runs faster per iteration, so the loop rate rises and the arm tracks the path more precisely
    - DLS ignores joint speed limits entirely, so it never needs to be clipped by the servo firmware
  correct: 1
- source: f3ec1872607a
  question: The SO-101's `wrist_roll` column has a near-zero top half. What does that imply for a position-only task and the null space?
  options:
    - The position Jacobian is singular everywhere, and the null space is empty for all tasks
    - "`wrist_roll` dominates $\\sigma_{\\min}$, and the null space spans the three wrist joints"
    - The position Jacobian is effectively 3×4, and `wrist_roll` is nearly a pure null-space direction
    - The Jacobian is 6×4 for all tasks, and `wrist_roll` must be locked to avoid singularities
