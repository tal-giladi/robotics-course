- source: d3daec4e1c0c
  question: What are the units of a linear Jacobian entry, and what does an entry of 0.135 mean physically?
  options:
    - rad/m; moving the tool 1 m along that axis turns that joint by 0.135 rad
    - m/s; that joint moves the tool 0.135 m per second at any joint speed
    - m/rad; turning that joint at 1 rad/s moves the tool at 0.135 m/s along that axis
    - N·m/N; a 1 N force along that axis produces 0.135 N·m at every joint
  correct: 2
- source: a500ebc2c80a
  question: The 2-link arm has manipulability $w = l_1 l_2 |\sin q_2|$. Why does $q_1$ not appear?
  options:
    - $q_1$ is the base joint, whose speed limit is so high that it never constrains the tool velocity
    - $q_1$ cancels out of $\det J$ because $\sin^2 q_1 + \cos^2 q_1 = 1$ multiplies the other terms
    - $q_1$ appears only in the angular Jacobian, which manipulability deliberately leaves out
    - $q_1$ rotates the whole arm rigidly, which rotates the velocity ellipse without changing its shape or area
  correct: 3
- source: 94ee9bb0ee4e
  question: You command the 2-link tip straight outward at 5 cm/s with $\lambda = 0$, at $q_2 = 5°$. What joint speed is demanded, and what does the servo do?
  options:
    - About 443 °/s; the servo saturates, the joint speed ratio breaks, and the tool jerks off-direction
    - About 44 °/s; well within the servo's limits, so the tool moves smoothly outward as commanded
    - About 443 °/s; the servo delivers it briefly, so the motion is fast but stays in the commanded direction
    - About 4,430 °/s; the servo detects the overload and disables torque until the command is cleared
