# Multiple-choice version of the quiz in 01.11-drive-and-rotate.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 8a07cdab172a
  question: Why does `drive_open_loop.py` re-send the same duty command every 50 ms instead of sending it once?
  options:
    - The Pico forgets the duty after each PWM period and needs it refreshed.
    - Re-sending averages out serial errors, so the duty is more accurate.
    - The firmware watchdog stops the motors after 300 ms without a command; re-sending keeps them alive and guarantees a stop if the link dies.
    - The motor driver needs a new command to update its current limit.
  correct: 2
