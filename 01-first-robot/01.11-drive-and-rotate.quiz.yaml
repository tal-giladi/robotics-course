- source: 5cb99c91d599
  question: You run the same `forward:3` command with a full battery and again at 10.5 V. What changes, and roughly by how much?
  options:
    - "Nothing: the duty cycle fixes the speed regardless of voltage."
    - The distance drops by about 15–20%, since speed is roughly proportional to the applied voltage.
    - The distance drops by about 50%, because power scales with voltage squared.
    - The distance rises slightly, because the motors draw less current at lower voltage.
  correct: 1
