  question: The robot drives straight with the wheels in the air but curves hard left on the floor. What do you check first?
  options:
    - "Mechanical load: a wheel rubbing or binding, then the caster dragging, then weight distribution."
    - The encoder wiring on the left wheel, then the PWM frequency.
    - The motor driver current limit, then the battery voltage under load.
    - The serial checksum errors, then the watchdog timeout.
  correct: 0
- source: 8c64fe9975d1
  question: Why can't a differential-drive robot move directly to its left, and what does it do instead?
  options:
    - Its motors can't reverse fast enough; it drives backwards in a loop instead.
    - Its firmware forbids sideways commands for safety; it asks the planner to reroute.
    - Its caster blocks sideways motion; it lifts the caster by rotating in place.
    - Both wheels roll along its x axis (non-holonomic); it must rotate first or drive an arc.
  correct: 3
- source: dad102257a89
  question: Deadband is 0.11 on the left motor and 0.17 on the right. Is the robot broken, and what does it do at duty 0.14?
  options:
    - "Broken: the right driver is faulty; at 0.14 neither wheel turns."
    - Not broken but mismatched; at 0.14 the left wheel turns and the right doesn't, so it pivots around the right wheel.
    - Not broken; at 0.14 both wheels turn at the same speed.
    - Not broken; at 0.14 the right wheel turns and the left doesn't, so it pivots around the left wheel.
  correct: 1
