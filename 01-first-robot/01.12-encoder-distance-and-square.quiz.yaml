- source: c6381e7e6175
  question: "Your heading errors: −5.2°, −4.9°, −5.4°, −4.6°, −5.1°. Your friend's: −1°, +4°, −6°, +2°, −3°. Whose robot is easier to fix, and how?"
  options:
    - "Your friend's: the average is near zero, so only a small offset is needed."
    - "Yours: the errors are random, so a heading sensor fixes them."
    - "Both equally: average the five runs and subtract the mean from each."
    - "Yours: the tight cluster is systematic, so calibrating the track width removes most of it."
  correct: 3
- source: d8d3c54a7d54
  question: Why does `move()` slow down over the last 10 cm instead of driving at full speed and then braking?
  options:
    - Braking at full speed trips the motor driver's current limit.
    - The encoders lose ticks at full speed, so the last 10 cm need slower counting.
    - The watchdog needs time to confirm the stop command before arrival.
    - The motors and mass take 0.1–0.2 s to stop; arriving slowly keeps the overshoot tiny.
  correct: 3
- source: 4a0ccc1aa520
  question: The square is beautiful at 0.15 m/s and terrible at 0.4 m/s. What are the two most likely reasons?
  options:
    - Slip during fast turns in place, and overshoot because the fixed 10 cm ramp can't bleed off the higher speed.
    - Encoder ticks lost at high speed, and the battery sagging during the run.
    - Serial commands delayed at high speed, and the watchdog tripping mid-segment.
    - The track width changing with speed, and the caster lifting off the floor.
  correct: 0
- source: c0cc30ed1b45
  question: Why run the square clockwise and counter-clockwise?
  options:
    - To average out battery sag, which affects one direction more than the other.
    - To check that both motor drivers can reverse properly.
    - To separate a wrong track width (same error in both directions) from unequal wheel diameters (sign flips with direction).
    - To detect encoder wiring faults, which only show up in one direction.
  correct: 2
