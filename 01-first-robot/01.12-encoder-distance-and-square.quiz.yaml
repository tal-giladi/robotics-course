  question: You command a 90° turn and the robot turns 86.5° every time, in both directions. What constant is wrong, and what is its corrected value?
  options:
    - The track width is too small; correct it to about 0.208 m.
    - The track width is too large; correct it to about 0.192 m.
    - The wheel radius is too small; correct it to about 46.8 mm.
    - The ticks per revolution are too high; correct them to about 2371.
  correct: 0
- source: aacdf13d6f03
  question: You drive a 1 m square with a wheel radius 2% too large in the config. Where does the robot end up, and what does its odometry say?
  options:
    - It ends about 8.8 cm away and 7.2° off, and odometry reports the same error.
    - It ends exactly at the start, because the errors of the four sides cancel.
    - It ends about 8.8 cm away and 7.2° off, yet odometry reports a near-perfect square.
