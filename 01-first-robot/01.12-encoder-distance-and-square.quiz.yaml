# Multiple-choice version of the quiz in 01.12-encoder-distance-and-square.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 108b4e86937c
  question: One encoder tick is how many millimetres on karmel?
  options:
    - About 0.459 mm (282.7 mm circumference / 616 ticks)
    - About 0.057 mm (141.4 mm circumference / 2464 ticks)
    - About 0.230 mm (282.7 mm circumference / 1232 ticks)
    - About 0.115 mm (282.7 mm circumference / 2464 ticks)
  correct: 3
- source: 072eacc5a489
  question: Why does the wheel radius not appear in $\Delta\theta = (d_R - d_L)/b$?
  options:
    - Because the radius cancels out between the left and right wheel terms.
    - Because the radius only matters for straight driving, not for turning.
    - Because $d_R$ and $d_L$ are already distances in metres; the radius was used to convert ticks into them.
    - Because the formula assumes both wheels have a radius of exactly 1.
  correct: 2
