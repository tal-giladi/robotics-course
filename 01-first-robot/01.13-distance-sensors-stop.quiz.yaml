# Multiple-choice version of the quiz in 01.13-distance-sensors-stop.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 29be576e9df4
  question: Why does the US-100 work directly with the Pico while an HC-SR04 needs extra components?
  options:
    - The US-100 runs from 3.3 V so its Echo is 0–3.3 V; the HC-SR04 needs 5 V and its 5 V Echo exceeds the Pico's limit, needing a divider.
    - The US-100 uses I2C while the HC-SR04 uses analog output, which needs an external ADC.
    - The US-100 has a built-in temperature sensor, while the HC-SR04 needs an external one.
    - The US-100 draws less current, while the HC-SR04 needs its own regulator.
  correct: 0
