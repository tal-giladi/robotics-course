- source: 605cca477160
  question: Range readings are fine while stationary and go to `None` a second after the motors start. What is your hypothesis?
  options:
    - Electrical noise from the motors corrupts the I²C bus or echo timing; test on a stand with and without motor power.
    - The robot drives out of the sensor's range, so no target is detected.
    - The motors vibrate the sensor loose from its mount.
    - The firmware skips sensor reads while the motor control loop is busy.
  correct: 0
- source: "020681207498"
  question: Why does the firmware read the range sensor at 10 Hz while the control loop runs at 100 Hz?
  options:
    - The I2C bus can only run at 10 Hz on the Pico.
    - Reading at 100 Hz would drain the battery faster.
    - The ultrasonic read blocks up to 30 ms and the VL53L1X updates only every ~100 ms; the control loop must never wait for a sensor.
    - The control loop needs averaged range readings, so it collects ten per reading.
  correct: 2
- source: f2ee3515ede6
  question: What is the difference between `state.range_m is None` and `state.flags & FLAG_RANGE_ERROR`, and why are both treated as "stop"?
  options:
    - None means the sensor failed; the flag means nothing in range; only the flag should stop the robot.
    - None means no valid measurement this time; the flag means the sensor itself failed; neither says the path is clear.
    - Both mean the same thing; the flag is kept only for backward compatibility.
    - None means the obstacle is too close; the flag means it is too far; both need a stop.
  correct: 1
