    - "Perfectly fine: only the p50 matters for teleop."
    - Usable only below 0.1 m/s; lower the loop rate to 5 Hz to match the latency.
    - Usable but it will feel sticky (9 cm late once in a hundred); first disable Wi-Fi power save on the Pi.
