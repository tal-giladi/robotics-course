  question: Why does `teleop_keyboard.py` use `tty.setcbreak` rather than `tty.setraw`, and why restore the terminal inside a `try`?
  options:
    - "`setcbreak` is faster; the `try` hides harmless warnings from the user."
    - "`setraw` doesn't work over SSH; the `try` retries the restore until it succeeds."
    - "`setcbreak` keeps `Ctrl-C` working as a stop; the `try` stops a dead terminal's error from skipping cleanup such as stopping the motors."
    - "`setcbreak` echoes keys for feedback; the `try` logs the terminal state for debugging."
  correct: 2
