- source: 9380ebc3dce8
  question: Why does the robot stop when you release `w`, although the program never sends a "stop" on key release?
  options:
    - The terminal sends a special key-up code that the loop maps to `stop()`.
    - Auto-repeat refreshes `last_key_time`; when keys stop arriving, the dead-man calls `base.stop()` after `--deadman` seconds.
    - The Pico detects that the key is no longer held via the USB HID interface.
    - SSH closes the session on key release, and the program exits and brakes.
  correct: 1
- source: 87bc14b305eb
  question: Your laptop's Wi-Fi dies while you hold `w`. What stops the robot first?
  options:
    - The dead-man on the Pi calls `stop()` about 0.5 s after keys stop arriving.
    - The Pico's watchdog, 300 ms after the last command.
    - SSH's `ServerAliveCountMax` expiring and the program getting `SIGHUP`.
    - The laptop's teleop program detecting the lost connection and sending `S`.
  correct: 0
- source: 5b75befda333
  question: Why are there three timeouts instead of one good one?
  options:
    - Each has a different length, so together they give a smooth deceleration.
    - Two are for teleop and one is for Nav2, which uses the same drive path.
    - Each covers a failure the others can't see; only the Pico's watchdog survives `kill -9`, a Pi crash or an unplugged cable.
    - Three timeouts let the system vote on whether a failure really happened.
  correct: 2
