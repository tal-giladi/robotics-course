# Multiple-choice version of the quiz in 20.01-final-architecture.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 5c4b429a5022
  question: "`collision_monitor` subscribes to `/scan` as `reliable`; the LiDAR driver publishes with `qos_profile_sensor_data`. What happens, and what does `ros2 topic hz /scan` show?"
  options:
    - It receives data with some dropped frames; `hz` shows about 5 Hz
    - The subscriber gets nothing (reliable request vs best-effort offer); `hz` still shows a healthy 10 Hz
    - The publisher upgrades to reliable automatically; `hz` shows 10 Hz
    - The subscriber gets nothing; `hz` also shows nothing, so the bug is easy to spot
  correct: 1
