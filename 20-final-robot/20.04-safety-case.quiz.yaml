  question: Your safety case passes with ten hazards and thirty-seven controls, none ever tested. What is its actual value?
  options:
    - A design document, but zero as a safety argument
    - Full value, since the hazard analysis is the hard part
    - "Partial value: about 70% of controls usually work when fitted"
    - None at all, not even as a design document
  correct: 0
