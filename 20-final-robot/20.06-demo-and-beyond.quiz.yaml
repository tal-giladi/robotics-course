  question: Why is the e-stop test the second segment of the demo rather than the last?
  options:
    - It frames everything after it, and its failure must end the demo before any autonomous driving
    - It is the least interesting segment, so it goes early while people settle
    - The battery is fullest early, which the e-stop relay needs
    - The e-stop must be tested before the robot warms up, or it may stick
  correct: 0
- source: 592d26306883
  question: The demo consumes 3.0 Wh of a 36.2 Wh pack. Why is the battery still the most likely thing to end your demo?
  options:
    - The pack's real capacity is only about 3 Wh after cold storage
    - The arm's peak draw can trip the pack's protection circuit
    - Compute draws ~11 W while switched on for setup and waiting; two hours ≈ 22 Wh
    - The e-stop test drains the pack by resetting the relay
  correct: 2
