  question: During the navigation segment, somebody steps into the robot's path and it stops. What do you do?
  options:
    - Apologise and restart the segment from the beginning
    - Let it happen and narrate it as the collision monitor working
    - Press the e-stop to be safe and move to the next segment
    - Ask the person to move and switch to teleop to finish
