    difficulty: beginner
    time: 60
    requires: ["01.02"]
    optional: ["FE.03", "FE.17"]
    hardware: [tools]
    software: []
    teaches: [workbench-setup, continuity-test, basic-soldering]
    skip_if: You can measure voltage and continuity and solder header pins cleanly.
  - id: "01.04"
    slug: raspberry-pi-setup
