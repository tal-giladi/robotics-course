  - id: "01.02"
    slug: buying-hardware-in-israel
    title: "Stage 1 shopping list: buying the parts in Israel"
    difficulty: beginner
    time: 45
    requires: ["01.01"]
    optional: []
    hardware: []
    software: []
    teaches: [bom, sourcing-israel, import-rules]
    skip_if: You have all Stage-1 hardware in hand.
    version_sensitive: true
  - id: "01.03"
    slug: workbench-and-tools
