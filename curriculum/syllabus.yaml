- id: "02"
  dir: 02-robot-electronics
  track: main
  title: Robot electronics in practice
  summary: From a breadboard that works to a robot that keeps working — power budgets, drivers, buses, noise, wiring and systematic electrical debugging.
  lessons:
  - id: "02.01"
    slug: datasheets-and-pinouts
    title: Reading datasheets and pinouts without drowning
    difficulty: beginner
    time: 45
    requires: ["01.08"]
    optional: ["FE.01"]
    hardware: []
    software: []
    teaches: [datasheet-reading, absolute-maximum-ratings, pinout]
    skip_if: You routinely extract absolute max ratings, logic levels and timing from datasheets.
  - id: "02.02"
    slug: power-budget
    title: Power budgets and power architecture (why the Pi reboots when motors start)
    difficulty: intermediate
    time: 60
    requires: ["01.07", "02.01"]
    optional: ["FE.15", "FP.05"]
    hardware: [robot-base]
    software: []
    teaches: [power-budget, brownout, worst-case-current, battery-runtime, separate-rails]
    skip_if: You can compute worst-case current per rail and runtime for your robot.
  - id: "02.03"
    slug: motor-drivers-in-depth
    title: Motor drivers in depth — H-bridges, PWM frequency, current, braking
    difficulty: intermediate
    time: 60
    requires: ["01.08", "02.01"]
    optional: ["FE.12", "FE.18"]
    hardware: [robot-base]
    software: [micropython]
    teaches: [h-bridge, pwm-frequency, brake-vs-coast, back-emf, current-limits]
    skip_if: You can choose a motor driver for a given motor's stall current and explain decay modes.
  - id: "02.04"
    slug: buses-i2c-spi-uart
    title: "Buses in practice: I²C scanning, SPI, UART"
    difficulty: intermediate
    time: 75
    requires: ["01.13"]
    optional: ["FE.09", "FE.06"]
    hardware: [robot-base]
    software: [python, micropython]
    teaches: [i2c-scan, i2c-addresses, pull-ups-practice, spi-practice, uart-practice]
    skip_if: You have debugged an I²C bus with a scan and know how to pick pull-up values.
  - id: "02.05"
    slug: logic-levels-and-protection
    title: Logic levels, level shifting and protecting GPIO pins
    difficulty: beginner
    time: 45
    requires: ["02.04"]
    optional: ["FE.05"]
    hardware: [robot-base]
    software: []
    teaches: [logic-levels, level-shifter, series-resistor-protection, 5v-tolerance]
    skip_if: You never connect a 5 V signal to a 3.3 V pin and know why.
  - id: "02.06"
    slug: noise-grounding-emi
    title: Noise, grounding, decoupling and motor EMI
    difficulty: intermediate
    time: 60
    requires: ["02.03"]
    optional: ["FE.16", "FE.18"]
    hardware: [robot-base]
    software: []
    teaches: [ground-loops, decoupling-capacitors, motor-noise-suppression, star-ground]
    skip_if: You can explain and fix sensor glitches that happen only when motors run.
  - id: "02.07"
    slug: wiring-harness
    title: Connectors, crimping and a wiring harness that survives vibration
    difficulty: beginner
    time: 60
    requires: ["01.07"]
    optional: ["FE.04"]
    hardware: [robot-base, tools]
    software: []
    teaches: [jst-xh, xt30-xt60, crimping, strain-relief, wire-gauge]
    skip_if: Your robot's wiring uses keyed connectors with strain relief and correct gauges.
  - id: "02.08"
    slug: from-breadboard-to-perfboard
    title: From breadboard to a soldered robot board
    difficulty: intermediate
    time: 120
    requires: ["02.07", "02.06"]
    optional: ["FE.17"]
    hardware: [robot-base, tools]
    software: []
    teaches: [perfboard-layout, soldered-power-board, design-for-debug]
    skip_if: Your electronics are already soldered and documented.
  - id: "02.09"
    slug: electrical-debugging-method
    title: "Systematic electrical debugging: the motor doesn't move"
    difficulty: intermediate
    time: 60
    requires: ["02.03", "02.05"]
    optional: ["FE.03"]
    hardware: [robot-base, tools]
    software: []
    teaches: [debugging-by-bisection, measure-dont-guess, fault-tree]
    skip_if: You debug hardware by measuring from power source to load, not by swapping parts at random.
  - id: "02.10"
    slug: can-bus-and-smart-actuators
    title: CAN bus and smart actuators — when bigger robots need them
    difficulty: intermediate
    time: 40
    requires: ["02.04"]
    optional: ["FE.19"]
    hardware: []
    software: []
    teaches: [can-bus-practice, smart-servo-buses, rs485]
    skip_if: You know when a robot should use CAN or RS-485 instead of I²C or UART.

