    software: []
    teaches: [power-distribution, fuse, buck-converter, common-ground, battery-safety-practice]
    skip_if: Never skip the safety checks, even if you have built power systems before.
  - id: "01.08"
    slug: first-motor-spin
    title: Wire the motor driver and spin a motor (PWM and direction)
