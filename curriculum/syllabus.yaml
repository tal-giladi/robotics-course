# ============================================================================
# SINGLE SOURCE OF TRUTH for the course structure and dependency graph.
#
#   * Every lesson, foundation lesson and project is declared here.
#   * `tools/build.py` turns this into curriculum/graph.json (read by course.py),
#     the "At a glance" header of every lesson, _sidebar.md and COURSE_MAP tables.
#   * `tools/validate.py` fails if a file is missing, a prerequisite points
#     nowhere, or the graph has a cycle.
#
# Field reference (see MAINTAINING.md for the full schema):
#   id          canonical id. Main path "NN.MM", foundations "FM.05", projects "P04".
#   slug        file name part: <module dir>/<id>-<slug>.md
#   difficulty  beginner | intermediate | advanced
#   time        estimated minutes including exercises (not optional challenges)
#   requires    HARD prerequisites (you will be lost without them)
#   optional    SOFT prerequisites: foundation lessons that help if the topic is new
#   hardware    hardware catalog ids (see `hardware:` at the bottom). [] = none
#   software    what must be installed
#   teaches     concepts this lesson owns; `course.py learn <concept>` searches these
#   skip_if     one sentence: who can safely skip it
#   version_sensitive  true when instructions depend on fast-moving versions
# ============================================================================

course:
  title: "Practical Robotics: From Software Engineer to Autonomous AI Robot"
  robot_name: karmel
  created: "2026-09-16"

tracks:
  main:
    title: Main practical path
    description: Build, program and extend a real robot. Do these in order.
  foundations:
    title: Optional foundations
    description: Learn a prerequisite exactly when you need it. Skip what you know.
  projects:
    title: Projects
    description: Milestones that prove you can do it, not just that you read it.

modules:

# ---------------------------------------------------------------------------
- id: "00"
  dir: 00-orientation
  track: main
  title: Orientation — what robotics actually is
  summary: The vocabulary and the mental map of the whole robotics stack, plus how to study this course with an AI teacher.
  lessons:
  - id: "00.01"
    slug: what-is-a-robot
    title: What is a robot? The sense–think–act loop
    difficulty: beginner
    time: 30
    requires: []
    optional: []
    hardware: []
    software: []
    teaches: [robot, sense-think-act, autonomy, embodiment]
    skip_if: You can explain why a robot is a closed loop between software and physics, not a program with motors attached.
  - id: "00.02"
    slug: the-robotics-stack
    title: The robotics stack from AI down to motors
    difficulty: beginner
    time: 45
    requires: ["00.01"]
    optional: []
    hardware: []
    software: []
    teaches: [robotics-stack, perception, planning, control, middleware]
    skip_if: You can draw the layers from an LLM planner down to a PWM signal and say what runs at which rate.
  - id: "00.03"
    slug: actuators-and-sensors-field-guide
    title: "Field guide: motors, servos, encoders, IMUs, cameras, LiDAR, ToF, ultrasonic"
    difficulty: beginner
    time: 45
    requires: ["00.02"]
    optional: []
    hardware: []
    software: []
    teaches: [actuator, sensor, motor, servo, encoder, imu, camera, lidar, tof, ultrasonic, motor-controller]
    skip_if: You know what each of these parts measures or moves and roughly what it costs.
  - id: "00.04"
    slug: robot-computers
    title: "Robot computers: microcontrollers, single-board computers and GPUs"
    difficulty: beginner
    time: 35
    requires: ["00.03"]
    optional: []
    hardware: []
    software: []
    teaches: [microcontroller, sbc, embedded-computer, real-time, edge-gpu]
    skip_if: You can explain why a robot typically has both a Raspberry Pi and a microcontroller.
    version_sensitive: true
  - id: "00.05"
    slug: ros2-in-one-page
    title: ROS 2 and robot middleware in one page
    difficulty: beginner
    time: 30
    requires: ["00.02"]
    optional: []
    hardware: []
    software: []
    teaches: [ros2-overview, robot-middleware]
    skip_if: You have used ROS or ROS 2 before.
  - id: "00.06"
    slug: safety-mindset
    title: The safety mindset for home robotics
    difficulty: beginner
    time: 30
    requires: ["00.03"]
