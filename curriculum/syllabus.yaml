    skip_if: Your robot drives a 1 m square using encoder feedback and returns near its start.
  - id: "01.13"
    slug: distance-sensors-stop
    title: Ultrasonic and ToF sensors — stop before hitting things
    difficulty: beginner
    time: 75
    requires: ["01.11"]
    optional: ["FE.09", "FE.05"]
