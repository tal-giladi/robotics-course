  question: In a `--symlink-install` workspace you edit `battery_monitor.py` and add a new console script in `setup.py`. What must you do?
  options:
    - "Nothing: both work immediately thanks to the symlinks."
    - Rebuild for both, since symlinks only cover data files.
    - The edit works immediately; the new console script needs `colcon build`, since entry points are generated at build time.
    - Re-source only; `setup.py` is read at runtime by `ros2 run`.
  correct: 2
- source: 8aabc2382132
  question: Using `AMENT_PREFIX_PATH`, which copy of a package runs if it exists in both the overlay and the underlay?
  options:
    - The underlay's, because `/opt/ros/jazzy` is always searched first.
    - Whichever was built most recently.
    - "Neither: `ros2 run` fails with a duplicate-package error."
    - The overlay's, because its prefixes come first on the path and the first match wins.
  correct: 3
