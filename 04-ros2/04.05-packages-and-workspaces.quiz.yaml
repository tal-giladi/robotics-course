- source: "570190e27617"
  question: On the Pi, `ros2 run karmel_tutorial battery_health` fails with `No module named 'karmel_tutorial_interfaces'`; on the laptop it works. What's the systematic fix?
  options:
    - "`pip install karmel_tutorial_interfaces` on the Pi."
    - Copy the laptop's `install/` folder to the Pi.
    - Add the interfaces folder to `PYTHONPATH` in `~/.bashrc`.
    - Put the interface package in the Pi's workspace, declare `<depend>` on it, build with `--packages-up-to`, and re-source.
  correct: 3
