- source: 42b7298df956
  question: 'After fixing a QoS mismatch, a new error appears: "No battery data for 3.8 s". Did your fix break something?'
  options:
    - "Yes: the new QoS drops samples that the old one kept."
    - "Probably not: the QoS fault masked a flow fault; the watchdog only arms after a first sample, and data now arrives too slowly."
    - "Yes: changing QoS resets the node's clock."
    - "Probably not: it's a one-time warning that appears after any restart."
  correct: 1
- source: d3266a42cd7d
  question: Why is logging the effective configuration once at start-up more useful than logging parameters when they're declared?
  options:
    - It uses less disk space than logging each declaration.
    - Declared values are always identical to effective ones, so it avoids duplicates.
    - It is what the node actually runs with after defaults, YAML, `-p` and validation, so silent config faults become visible.
    - It is required for `ros2 param dump` to work.
  correct: 2
