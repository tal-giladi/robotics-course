# Multiple-choice version of the quiz in 04.13-debugging-and-introspection.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 2bf65bee355e
  question: Which order of the debugging layers is correct?
  options:
    - Content, flow, contract, wiring, discovery, process, config, logic.
    - Process, discovery, wiring, contract, flow, content, config, logic.
    - Logic, config, content, flow, contract, wiring, discovery, process.
    - Discovery, process, contract, wiring, content, flow, logic, config.
  correct: 1
- source: d45349db9733
  question: "`ros2 topic info /scan` shows 1 publisher and 0 subscriptions, but you're sure your node subscribes. What are the two most likely causes?"
  options:
    - A QoS mismatch, or a message type mismatch.
    - A firewall on the data ports, or a different RMW.
    - The node subscribes to a different fully qualified name, or it isn't running or never created the subscription.
    - The daemon is stale, or the LiDAR publishes too fast.
  correct: 2
