  question: How do you enable DEBUG output for only `/karmel1/battery_health` at start-up from a launch file?
  options:
    - "`ros_arguments=['--log-level', 'karmel1.battery_health:=debug']` in the `Node` action."
    - "`parameters=[{'log_level': 'debug'}]` in the `Node` action."
    - "`ros_arguments=['--log-level', '/karmel1/battery_health:=debug']` in the `Node` action."
    - Set `RCUTILS_LOGGING_SEVERITY=DEBUG` in the launch environment.
  correct: 0
