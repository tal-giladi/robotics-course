  question: How many bytes does the constant `BatteryHealth.STATE_LOW` add to each published message?
  options:
    - "Zero: constants are class attributes in code and never serialized."
    - One byte, the size of its `uint8` type.
    - Four bytes, since constants are aligned to 4.
    - It depends on whether the field it describes is set.
  correct: 0
