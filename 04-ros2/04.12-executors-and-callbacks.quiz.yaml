- source: 27e15c5e0d00
  question: Why does `client.call()` inside a timer callback deadlock under `rclpy.spin(node)`, although the server is in another process and answers?
  options:
    - The server's response is dropped because the client uses BEST_EFFORT QoS.
    - The single-threaded executor's only thread is blocked in the timer callback, so nobody processes the response that would complete the future.
    - The timer callback holds the GIL, so the server process can't run.
    - The client can't send requests from inside a callback at all.
  correct: 1
- source: 837d7b1dcb07
  question: You switch to `MultiThreadedExecutor(num_threads=8)` and it still hangs. What did you forget?
  options:
    - To increase the service's QoS depth above 1.
    - To call `rclpy.init()` with the thread count.
    - To make the timer period longer than the service latency.
    - The client is still in the same mutually exclusive group as the blocked timer; put it in a separate group.
  correct: 3
