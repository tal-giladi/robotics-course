  question: A slow pure-Python callback computes for 400 ms. You move it to its own group on a `MultiThreadedExecutor`. Does the 20 Hz timer recover?
  options:
    - "Mostly not: the pure-Python loop holds the GIL, so jitter stays high; offload to a process or GIL-releasing code."
    - Yes, completely, since it now runs on its own core.
    - Yes, but only with `num_threads` set to at least 4.
    - No, and the timer stops entirely until the callback finishes.
  correct: 0
