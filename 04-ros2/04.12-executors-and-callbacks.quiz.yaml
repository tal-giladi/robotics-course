  question: Why does `drive_distance_server` use a `ReentrantCallbackGroup` and also a `threading.Lock`?
  options:
    - The reentrant group lets callbacks run during a long `execute`; the lock protects the shared `_busy` flag they can now touch concurrently.
    - The group sets thread priorities; the lock stops the executor from shutting down.
    - The group is required for actions; the lock serializes feedback messages.
    - The lock replaces the group on Python 3.12; both are kept for compatibility.
  correct: 0
