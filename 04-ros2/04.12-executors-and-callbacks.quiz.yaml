- source: 2372a182dc02
  question: What does a `MutuallyExclusiveCallbackGroup` guarantee, and what does it not guarantee?
  options:
    - No callback of any group runs concurrently; nothing about ordering.
    - Callbacks run in the order they were registered; nothing about locking.
    - No two callbacks of that group run at once; callbacks in other groups can still run concurrently, so shared state needs a lock.
    - Each callback gets its own thread; nothing about timing.
  correct: 2
