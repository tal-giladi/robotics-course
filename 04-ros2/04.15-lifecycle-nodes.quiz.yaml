- source: c07dc5194a20
  question: Which transition leads into each of `inactive`, `active` and `finalized`?
  options:
    - "`inactive` via `activate`; `active` via `configure`; `finalized` via `cleanup`."
    - "`inactive` via `configure` (or `deactivate`); `active` via `activate`; `finalized` via `shutdown`."
    - "`inactive` via `cleanup`; `active` via `configure`; `finalized` via `deactivate`."
    - "`inactive` via `shutdown`; `active` via `activate`; `finalized` via `cleanup`."
  correct: 1
- source: 26d8564c5d80
  question: In Jazzy's rclpy, what happens when `on_configure` returns `FAILURE`, and when it raises an exception?
  options:
    - Both move the node to `finalized` and log the exception.
    - "`FAILURE` goes to `errorprocessing`; an exception goes straight back to `unconfigured`."
    - "`FAILURE` returns to `unconfigured`; an exception is treated as `ERROR`, runs `on_error`, and by default also ends in `unconfigured`, unlogged."
    - Both leave the node in `inactive` so it can retry `activate`.
  correct: 2
- source: 1340febd90ca
  question: A lifecycle node is `active`, its subscription callback runs, but its output topic shows nothing. What's the most likely bug?
  options:
    - "`on_activate` doesn't call `super().on_activate(state)`, so the lifecycle publisher was never activated."
    - The publisher uses BEST_EFFORT QoS, which lifecycle nodes can't send.
    - The node is still `inactive`, and `ros2 lifecycle get` shows a cached state.
    - The subscription and publisher share one callback group.
  correct: 0
