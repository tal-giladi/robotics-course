  question: Why does Nav2's lifecycle manager configure all nodes before activating any?
  options:
    - Activation is only possible once, so it must be batched.
    - So every server validates config and allocates resources before any acts; if one fails, nothing has moved yet.
    - Configuring is slow, so it's done in parallel while activation is serial.
    - DDS discovery needs all nodes configured before topics appear.
