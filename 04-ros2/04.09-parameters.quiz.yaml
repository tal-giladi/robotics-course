- source: 6a6ea40acdfa
  question: "`ros2 param set /battery_health low_threshold_v 11` fails. Why, and what's the fix?"
  options:
    - The parameter is read-only; restart the node with `-p`.
    - The value is out of range; use 10.9.
    - "`11` is parsed as an integer while the parameter is a `double`; use `11.0`."
    - The node name needs a namespace; use `/karmel/battery_health`.
  correct: 2
- source: 1831a572d502
  question: You set `filter_alpha` at runtime, `ros2 param get` shows the new value, but the behaviour is unchanged. What's the most likely cause?
  options:
    - The parameter server hasn't synced with the node yet.
    - The node copied the value into the filter at start-up and nothing updates it on change.
    - "`ros2 param get` shows a cached value, not the node's real one."
    - Parameters only take effect after the node is re-launched.
  correct: 1
