[develop]
script_dir=$base/lib/course_launch_examples
[install]
install_scripts=$base/lib/course_launch_examples

[flake8]
# Course code favours readable, commented lines over the 99-column ROS default.
max-line-length = 120
extend-ignore = Q000, D100, D101, D102, D103, D104, D105, D107, I100, I101, I201, I202
import-order-style = google

[pydocstyle]
add-ignore = D100,D101,D102,D103,D104,D105,D107,D203,D212,D404
