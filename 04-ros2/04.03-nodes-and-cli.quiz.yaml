# Multiple-choice version of the quiz in 04.03-nodes-and-cli.md (question N = question N there).
# The lesson's model answer is shown as the explanation. `source` fingerprints the original
# question + answer; if the lesson changes, the site flags the question for review.
- source: 6aff5e7d29ab
  question: Node `battery_monitor` in namespace `/karmel` subscribes to `battery/voltage` and publishes `~/status` and `/diagnostics`. What are the resolved names?
  options:
    - "`/battery/voltage`, `/karmel/status`, `/karmel/diagnostics`"
    - "`/karmel/battery/voltage`, `/karmel/battery_monitor/status`, `/diagnostics`"
    - "`/karmel/battery/voltage`, `/karmel/status`, `/diagnostics`"
    - "`/karmel/battery_monitor/battery/voltage`, `/battery_monitor/status`, `/karmel/diagnostics`"
  correct: 1
- source: 8569e48d652b
  question: What does `ros2 node info` tell you that `ros2 topic list` doesn't, and when is it the first command to run?
  options:
    - The node's CPU and memory use; run it first when the robot is slow.
    - The node's source file and package; run it first when a build fails.
    - The node's publishers, subscribers, services and actions with types; run it first when one component misbehaves.
    - The node's QoS history; run it first when messages arrive late.
  correct: 2
